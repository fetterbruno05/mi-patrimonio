<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrimonio Cloud - Bruno</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen text-sm selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, Component } = React;

    // EL ESCUDO ANTI-CRASHEOS
    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { hasError: false, errorInfo: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, errorInfo: error.message }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex h-screen items-center justify-center p-4">
              <div className="bg-rose-950 border border-rose-500 p-6 rounded-xl text-center max-w-sm">
                <h1 className="text-white font-bold mb-2">Error Visual</h1>
                <p className="text-rose-300 text-xs mb-4">{this.state.errorInfo}</p>
                <button onClick={() => window.location.reload()} className="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-lg font-bold">Recargar App</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ==========================================
    // 1. CONEXIÓN A TU NUEVA BASE DE DATOS
    // ==========================================
    const SUPABASE_URL = "https://nbluvlbsuvmkcaflmjei.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IuVcRy48mLa5P02gRC7B_Q_tI3C6Wuk";
    
    // Cambié el nombre de esta variable a supaClient para evitar conflictos con Vercel
    let supaClient = null;
    try {
      if (window.supabase) {
        supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (err) { console.error("Error iniciando Supabase:", err); }

    // Plantilla base para cuando la base de datos está vacía
    const DB_TEMPLATE = {
      cotizacionDolar: 1500,
      activos: [],
      gastosFijos: [],
      gastosPuntuales: []
    };

    function App() {
      // ESTADOS DE SISTEMA
      const [isLoaded, setIsLoaded] = useState(false);
      const [sesion, setSesion] = useState(false);
      const [passInput, setPassInput] = useState('');
      const [errorLogin, setErrorLogin] = useState('');

      // EL CEREBRO DE TUS DATOS (Reflejo de la nube)
      const [db, setDb] = useState(DB_TEMPLATE);

      // ESTADOS DE FORMULARIOS
      const [nuevoActivo, setNuevoActivo] = useState({ nombre: '', monto: '', moneda: 'USD' });
      const [nuevoGastoFijo, setNuevoGastoFijo] = useState({ concepto: '', monto: '', moneda: 'ARS', tipo: 'fijo', cuotasTotales: '3' });
      const [nuevoGastoPuntual, setNuevoGastoPuntual] = useState({ concepto: '', monto: '', moneda: 'ARS' });

      // ESTADOS UI
      const [editandoDolar, setEditandoDolar] = useState(false);
      const [dolarInput, setDolarInput] = useState('');

      // ==========================================
      // 2. LECTURA DE SUPABASE (Al entrar)
      // ==========================================
      useEffect(() => {
        async function fetchNube() {
          // Si el cliente falló, cortamos igual la pantalla de carga para que no se trabe
          if (!supaClient) {
            console.warn("No se pudo conectar a la base de datos externa.");
            setIsLoaded(true);
            return;
          }

          try {
            const { data, error } = await supaClient.from('iconnecture_data').select('payload').eq('id', 1).single();
            if (error) throw error;
            
            if (data && data.payload) {
              setDb({
                cotizacionDolar: data.payload.cotizacionDolar || 1500,
                activos: Array.isArray(data.payload.activos) ? data.payload.activos.filter(Boolean) : [],
                gastosFijos: Array.isArray(data.payload.gastosFijos) ? data.payload.gastosFijos.filter(Boolean) : [],
                gastosPuntuales: Array.isArray(data.payload.gastosPuntuales) ? data.payload.gastosPuntuales.filter(Boolean) : []
              });
            }
          } catch (err) {
            console.error("Base de datos limpia, iniciando de cero.", err);
          }
          // AHORA ESTO SIEMPRE SE EJECUTA
          setIsLoaded(true);
        }
        fetchNube();
      }, []);

      // ==========================================
      // 3. MOTOR DE ESCRITURA EN LA NUBE
      // ==========================================
      const guardarEnNube = async (nuevoEstadoDb) => {
        setDb(nuevoEstadoDb); // Actualiza la pantalla rápido
        if (supaClient) {
          const { error } = await supaClient.from('iconnecture_data').update({ payload: nuevoEstadoDb }).eq('id', 1);
          if (error) {
            console.error("Error al subir a la nube:", error);
            alert("Atención: No se pudo guardar en la nube. Revisá tu conexión.");
          }
        }
      };

      // ==========================================
      // 4. FUNCIONES Y CÁLCULOS
      // ==========================================
      const login = (e) => {
        e.preventDefault();
        if (passInput === 'bruno123') { setSesion(true); setErrorLogin(''); }
        else { setErrorLogin('Clave incorrecta'); setPassInput(''); }
      };

      const calcularUSD = (monto, moneda) => {
        const val = parseFloat(monto) || 0;
        return moneda === 'USD' ? val : val / db.cotizacionDolar;
      };

      const formatDinero = (montoUSD) => {
        return `$ ${parseFloat(montoUSD || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD`;
      };

      // --- HANDLERS PARA AGREGAR DATOS ---
      const agregarActivo = (e) => {
        e.preventDefault();
        const item = { id: Date.now(), nombre: nuevoActivo.nombre, monto: parseFloat(nuevoActivo.monto) || 0, moneda: nuevoActivo.moneda };
        guardarEnNube({ ...db, activos: [item, ...db.activos] });
        setNuevoActivo({ nombre: '', monto: '', moneda: 'USD' });
      };

      const agregarGastoFijo = (e) => {
        e.preventDefault();
        const item = { 
          id: Date.now(), concepto: nuevoGastoFijo.concepto, monto: parseFloat(nuevoGastoFijo.monto) || 0, 
          moneda: nuevoGastoFijo.moneda, tipo: nuevoGastoFijo.tipo,
          cuotasTotales: nuevoGastoFijo.tipo === 'cuotas' ? parseInt(nuevoGastoFijo.cuotasTotales) || 1 : null,
          cuotasPagadas: nuevoGastoFijo.tipo === 'cuotas' ? 1 : null
        };
        guardarEnNube({ ...db, gastosFijos: [item, ...db.gastosFijos] });
        setNuevoGastoFijo({ concepto: '', monto: '', moneda: 'ARS', tipo: 'fijo', cuotasTotales: '3' });
      };

      const agregarGastoPuntual = (e) => {
        e.preventDefault();
        const item = { 
          id: Date.now(), concepto: nuevoGastoPuntual.concepto, monto: parseFloat(nuevoGastoPuntual.monto) || 0, 
          moneda: nuevoGastoPuntual.moneda, fecha: new Date().toLocaleDateString()
        };
        guardarEnNube({ ...db, gastosPuntuales: [item, ...db.gastosPuntuales] });
        setNuevoGastoPuntual({ concepto: '', monto: '', moneda: 'ARS' });
      };

      // --- CÁLCULOS TOTALES ---
      const totalPatrimonioUSD = db.activos.reduce((acc, item) => acc + calcularUSD(item.monto, item.moneda), 0);
      const totalGastosFijosUSD = db.gastosFijos.reduce((acc, item) => acc + calcularUSD(item.monto, item.moneda), 0);
      const totalGastosPuntualesUSD = db.gastosPuntuales.reduce((acc, item) => acc + calcularUSD(item.monto, item.moneda), 0);

      // ==========================================
      // 5. INTERFACES (PANTALLAS)
      // ==========================================
      
      if (!isLoaded) {
        return <div className="flex h-screen items-center justify-center font-bold text-blue-400 animate-pulse text-xl">Conectando a tu Nube...</div>;
      }

      if (!sesion) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 p-4">
            <form onSubmit={login} className="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-sm w-full space-y-6 shadow-2xl fade-in">
              <div className="text-center space-y-2">
                <i className="fa-solid fa-fingerprint text-5xl text-blue-500 mb-3"></i>
                <h1 className="text-3xl font-black text-white">Patrimonio</h1>
                <p className="text-slate-400 text-sm font-bold tracking-widest uppercase">Acceso Privado</p>
              </div>
              <div>
                <input type="password" required placeholder="Tu clave..." value={passInput} onChange={e => {setPassInput(e.target.value); setErrorLogin('');}} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-4 text-center text-2xl font-mono text-white tracking-widest focus:outline-none focus:border-blue-500" />
                {errorLogin && <p className="text-rose-400 text-xs font-bold text-center mt-3">{errorLogin}</p>}
              </div>
              <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition text-base">Desbloquear</button>
            </form>
          </div>
        );
      }

      return (
        <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-8 fade-in pb-20">
          
          {/* HEADER Y COTIZACIÓN */}
          <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl">
            <div>
              <h1 className="text-3xl font-black text-white">Mi Patrimonio Central</h1>
              <p className="text-slate-400 text-sm mt-1"><i className="fa-solid fa-cloud text-blue-400 mr-2"></i>Sincronizado y 100% Seguro</p>
            </div>
            
            <div className="flex items-center gap-3 bg-slate-950 p-3 rounded-2xl border border-slate-700">
              <div className="px-3">
                <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Cotización USD</p>
                {!editandoDolar ? (
                  <div className="flex items-center gap-3">
                    <span className="text-xl font-black text-emerald-400">${db.cotizacionDolar}</span>
                    <button onClick={() => { setDolarInput(db.cotizacionDolar); setEditandoDolar(true); }} className="text-slate-400 hover:text-white bg-slate-800 px-2 py-1 rounded"><i className="fa-solid fa-pen text-xs"></i></button>
                  </div>
                ) : (
                  <div className="flex items-center gap-2 mt-1">
                    <input type="number" value={dolarInput} onChange={e => setDolarInput(e.target.value)} className="w-24 bg-slate-900 border border-emerald-500 rounded-lg px-3 py-1.5 text-white font-mono text-base focus:outline-none" />
                    <button onClick={() => { guardarEnNube({...db, cotizacionDolar: parseFloat(dolarInput) || 1500}); setEditandoDolar(false); }} className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-bold text-xs">Ok</button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* DASHBOARD DE TOTALES */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-gradient-to-br from-blue-900/40 to-slate-900 border border-blue-500/30 rounded-3xl p-6 shadow-xl">
              <p className="text-xs font-bold text-blue-400 uppercase tracking-widest mb-3"><i className="fa-solid fa-vault mr-2"></i>Patrimonio Total</p>
              <h2 className="text-4xl font-black text-white">{formatDinero(totalPatrimonioUSD)}</h2>
              <p className="text-slate-400 text-xs font-mono mt-3 bg-slate-950/50 inline-block px-3 py-1.5 rounded-lg border border-slate-800">Eq: ${(totalPatrimonioUSD * db.cotizacionDolar).toLocaleString('es-AR')} ARS</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
              <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3"><i className="fa-solid fa-calendar-days mr-2"></i>Gastos Fijos</p>
              <h2 className="text-3xl font-black text-amber-400">{formatDinero(totalGastosFijosUSD)}<span className="text-sm text-slate-500 ml-1">/mes</span></h2>
            </div>
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
              <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3"><i className="fa-solid fa-receipt mr-2"></i>Gastos Sueltos</p>
              <h2 className="text-3xl font-black text-rose-400">{formatDinero(totalGastosPuntualesUSD)}</h2>
            </div>
          </div>

          {/* ÁREAS DE TRABAJO (3 COLUMNAS) */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            {/* 1. ACTIVOS Y BILLETERAS */}
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6 shadow-xl">
              <div className="border-b border-slate-800 pb-3">
                <h3 className="text-lg font-bold text-white"><i className="fa-solid fa-wallet text-blue-400 mr-2"></i>Billeteras y Activos</h3>
                <p className="text-xs text-slate-400 mt-1">Cuentas, efectivo, valor de autos, etc.</p>
              </div>
              
              <form onSubmit={agregarActivo} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-inner">
                <input type="text" required placeholder="Nombre (Ej: Mercadopago / Efectivo)" value={nuevoActivo.nombre} onChange={e => setNuevoActivo({...nuevoActivo, nombre: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500" />
                <div className="flex gap-2">
                  <input type="number" step="any" required placeholder="Monto" value={nuevoActivo.monto} onChange={e => setNuevoActivo({...nuevoActivo, monto: e.target.value})} className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono focus:outline-none focus:border-blue-500 text-lg" />
                  <select value={nuevoActivo.moneda} onChange={e => setNuevoActivo({...nuevoActivo, moneda: e.target.value})} className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white font-bold focus:outline-none focus:border-blue-500"><option value="USD">USD</option><option value="ARS">ARS</option></select>
                  <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-3 rounded-xl transition"><i className="fa-solid fa-plus"></i></button>
                </div>
              </form>

              <div className="space-y-3">
                {db.activos.length === 0 ? <p className="text-center text-slate-500 py-6 text-sm font-bold border-2 border-dashed border-slate-800 rounded-xl">Sin activos registrados.</p> : db.activos.map(item => (
                  <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex justify-between items-center hover:border-slate-700 transition">
                    <div>
                      <p className="font-bold text-white text-base">{item.nombre}</p>
                      <p className="text-[11px] text-slate-500 font-mono mt-1">Ingresado: {item.monto} {item.moneda}</p>
                    </div>
                    <div className="flex items-center gap-4">
                      <span className="font-mono font-black text-blue-400 text-lg">{formatDinero(calcularUSD(item.monto, item.moneda))}</span>
                      <button onClick={() => guardarEnNube({...db, activos: db.activos.filter(x => x.id !== item.id)})} className="text-slate-600 hover:text-rose-400 transition-colors p-2"><i className="fa-solid fa-trash"></i></button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* 2. GASTOS FIJOS Y CUOTAS */}
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6 shadow-xl">
              <div className="border-b border-slate-800 pb-3">
                <h3 className="text-lg font-bold text-white"><i className="fa-solid fa-calendar-check text-amber-400 mr-2"></i>Fijos y Cuotas</h3>
                <p className="text-xs text-slate-400 mt-1">Suscripciones o compras a largo plazo.</p>
              </div>

              <form onSubmit={agregarGastoFijo} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-inner">
                <div className="flex gap-2">
                  <input type="text" required placeholder="Concepto (Ej: Gimnasio)" value={nuevoGastoFijo.concepto} onChange={e => setNuevoGastoFijo({...nuevoGastoFijo, concepto: e.target.value})} className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500" />
                  <select value={nuevoGastoFijo.tipo} onChange={e => setNuevoGastoFijo({...nuevoGastoFijo, tipo: e.target.value})} className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white font-bold focus:outline-none focus:border-amber-500"><option value="fijo">Fijo Mensual</option><option value="cuotas">Cuotas</option></select>
                </div>
                <div className="flex gap-2">
                  <input type="number" step="any" required placeholder="Monto" value={nuevoGastoFijo.monto} onChange={e => setNuevoGastoFijo({...nuevoGastoFijo, monto: e.target.value})} className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono focus:outline-none focus:border-amber-500 text-lg" />
                  <select value={nuevoGastoFijo.moneda} onChange={e => setNuevoGastoFijo({...nuevoGastoFijo, moneda: e.target.value})} className="bg-slate-900 border border-slate-700 rounded-xl px-2 py-3 text-white font-bold focus:outline-none focus:border-amber-500"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                  {nuevoGastoFijo.tipo === 'cuotas' && <input type="number" required placeholder="Meses" value={nuevoGastoFijo.cuotasTotales} onChange={e => setNuevoGastoFijo({...nuevoGastoFijo, cuotasTotales: e.target.value})} className="w-20 bg-slate-900 border border-amber-500 rounded-xl px-3 py-3 text-white font-mono focus:outline-none" title="Cantidad total de cuotas" />}
                  <button type="submit" className="bg-amber-600 hover:bg-amber-500 text-white font-bold px-5 py-3 rounded-xl transition"><i className="fa-solid fa-plus"></i></button>
                </div>
              </form>

              <div className="space-y-3">
                {db.gastosFijos.length === 0 ? <p className="text-center text-slate-500 py-6 text-sm font-bold border-2 border-dashed border-slate-800 rounded-xl">Sin gastos fijos.</p> : db.gastosFijos.map(item => (
                  <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex justify-between items-center hover:border-slate-700 transition">
                    <div>
                      <p className="font-bold text-white text-base">{item.concepto} {item.tipo === 'cuotas' && <span className="bg-amber-950 text-amber-400 px-2 py-0.5 rounded border border-amber-800 text-[10px] ml-2">Cuota {item.cuotasPagadas}/{item.cuotasTotales}</span>}</p>
                      <p className="text-[11px] text-slate-500 font-mono mt-1">Valor base: {item.monto} {item.moneda}</p>
                    </div>
                    <div className="flex items-center gap-4">
                      <span className="font-mono font-black text-amber-400 text-lg">-{formatDinero(calcularUSD(item.monto, item.moneda))}</span>
                      <div className="flex flex-col gap-2">
                        {item.tipo === 'cuotas' && item.cuotasPagadas < item.cuotasTotales && (
                          <button onClick={() => guardarEnNube({...db, gastosFijos: db.gastosFijos.map(x => x.id === item.id ? { ...x, cuotasPagadas: x.cuotasPagadas + 1 } : x)})} className="bg-emerald-950 hover:bg-emerald-900 text-emerald-400 border border-emerald-800 px-3 py-1.5 rounded-lg text-[10px] font-bold transition">+1 Pago</button>
                        )}
                        <button onClick={() => guardarEnNube({...db, gastosFijos: db.gastosFijos.filter(x => x.id !== item.id)})} className="bg-rose-950 hover:bg-rose-900 text-rose-400 border border-rose-800 px-3 py-1.5 rounded-lg text-[10px] font-bold transition"><i className="fa-solid fa-trash"></i> Eliminar</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* 3. GASTOS PUNTUALES */}
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6 shadow-xl">
              <div className="border-b border-slate-800 pb-3">
                <h3 className="text-lg font-bold text-white"><i className="fa-solid fa-cart-shopping text-rose-400 mr-2"></i>Gastos Sueltos</h3>
                <p className="text-xs text-slate-400 mt-1">Lo que fuiste gastando en el día a día.</p>
              </div>

              <form onSubmit={agregarGastoPuntual} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-inner">
                <input type="text" required placeholder="Concepto (Ej: Kiosco, Uber...)" value={nuevoGastoPuntual.concepto} onChange={e => setNuevoGastoPuntual({...nuevoGastoPuntual, concepto: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500" />
                <div className="flex gap-2">
                  <input type="number" step="any" required placeholder="Monto" value={nuevoGastoPuntual.monto} onChange={e => setNuevoGastoPuntual({...nuevoGastoPuntual, monto: e.target.value})} className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono focus:outline-none focus:border-rose-500 text-lg" />
                  <select value={nuevoGastoPuntual.moneda} onChange={e => setNuevoGastoPuntual({...nuevoGastoPuntual, moneda: e.target.value})} className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white font-bold focus:outline-none focus:border-rose-500"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                  <button type="submit" className="bg-rose-600 hover:bg-rose-500 text-white font-bold px-5 py-3 rounded-xl transition"><i className="fa-solid fa-plus"></i></button>
                </div>
              </form>

              <div className="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                {db.gastosPuntuales.length === 0 ? <p className="text-center text-slate-500 py-6 text-sm font-bold border-2 border-dashed border-slate-800 rounded-xl">Sin gastos diarios.</p> : db.gastosPuntuales.map(item => (
                  <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex justify-between items-center hover:border-slate-700 transition">
                    <div>
                      <p className="font-bold text-white text-base">{item.concepto}</p>
                      <p className="text-[11px] text-slate-500 mt-1">{item.fecha} • Base: {item.monto} {item.moneda}</p>
                    </div>
                    <div className="flex items-center gap-4">
                      <span className="font-mono font-black text-rose-400 text-lg">-{formatDinero(calcularUSD(item.monto, item.moneda))}</span>
                      <button onClick={() => guardarEnNube({...db, gastosPuntuales: db.gastosPuntuales.filter(x => x.id !== item.id)})} className="text-slate-600 hover:text-rose-400 transition-colors p-2"><i className="fa-solid fa-trash"></i></button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
