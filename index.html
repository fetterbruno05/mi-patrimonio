<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrimonio Cloud - Bruno</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen text-sm selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, Component, useRef } = React;

    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { hasError: false, errorInfo: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, errorInfo: error.message }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex h-screen items-center justify-center p-4">
              <div className="bg-rose-950 border border-rose-500 p-6 rounded-xl text-center max-w-sm">
                <h1 className="text-white font-bold mb-2">Error Visual</h1>
                <p className="text-rose-300 text-xs mb-4">{this.state.errorInfo}</p>
                <button onClick={() => window.location.reload()} className="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-lg font-bold">Recargar App</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ==========================================
    // 1. CONEXIÓN A BASE DE DATOS
    // ==========================================
    const SUPABASE_URL = "https://nbluvlbsuvmkcaflmjei.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IuVcRy48mLa5P02gRC7B_Q_tI3C6Wuk";
    
    let supaClient = null;
    try {
      if (window.supabase) supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (err) { console.error("Error iniciando Supabase:", err); }

    const DB_TEMPLATE = { 
        cotizacionDolar: 1500, fechaUltimaCotizacion: '',
        activos: [], gastosFijos: [], gastosPuntuales: [], 
        deudas: [], deudasCobrar: [], 
        stock: [], ventas: [], taller: [], reparacionesFin: [], // NUEVO
        historiaConceptos: [], historiaStock: [], historiaGremios: ['iConnecture'], actividad: [] 
    };

    const COLORES_GRAFICO = ['bg-rose-500', 'bg-blue-500', 'bg-amber-500', 'bg-emerald-500', 'bg-purple-500', 'bg-cyan-500', 'bg-pink-500', 'bg-indigo-500'];

    function App() {
      const [isLoaded, setIsLoaded] = useState(false);
      const [sesion, setSesion] = useState(false);
      const [passInput, setPassInput] = useState('');
      const [errorLogin, setErrorLogin] = useState('');

      const [db, setDb] = useState(DB_TEMPLATE);
      const [vista, setVista] = useState('patrimonio'); 

      // ESTADOS DE LA APP
      const [bloqueoCotizacion, setBloqueoCotizacion] = useState(false);
      const [cotizacionDiariaInput, setCotizacionDiariaInput] = useState('');
      const [monedaVisual, setMonedaVisual] = useState('USD'); 
      const [modoPrivado, setModoPrivado] = useState(false); 

      // ESTADOS DE FORMULARIOS
      const [nuevoActivo, setNuevoActivo] = useState({ nombre: '', monto: '', moneda: 'USD', tipo: 'billetera' });
      const [nuevaTransferencia, setNuevaTransferencia] = useState({ origenId: '', destinoId: '', monto: '', moneda: 'ARS' });
      const [nuevoGastoPuntual, setNuevoGastoPuntual] = useState({ concepto: '', monto: '', moneda: 'ARS', walletId: '' });
      const [mostrarInputConceptoLibre, setMostrarInputConceptoLibre] = useState(false);
      const [nuevoGastoFijo, setNuevoGastoFijo] = useState({ concepto: '', monto: '', moneda: 'ARS', tipo: 'fijo', cuotasTotales: '3', diaVencimiento: '1' });
      const [nuevaDeuda, setNuevaDeuda] = useState({ acreedor: '', motivo: '', monto: '', moneda: 'USD' });
      const [nuevaDeudaCobrar, setNuevaDeudaCobrar] = useState({ deudor: '', motivo: '', monto: '', moneda: 'USD', walletId: '' }); 
      const [nuevoStock, setNuevoStock] = useState({ concepto: '', cantidad: '1', monto: '', moneda: 'USD' });
      const [mostrarInputStockLibre, setMostrarInputStockLibre] = useState(false);
      const [nuevaVenta, setNuevaVenta] = useState({ cantidad: '1', comisionPorUnidad: '20000', moneda: 'ARS' });

      // ESTADOS DE TALLER Y REPARACIONES
      const [nuevaReparacion, setNuevaReparacion] = useState({
        origen: 'cliente', gremio: '', modelo: '', imei: '', clienteNombre: '', clienteTelefono: '', estadoVisual: '', falla: '', presupuesto: '', presupuestoMoneda: 'ARS'
      });
      const [mostrarInputGremioLibre, setMostrarInputGremioLibre] = useState(false);

      // NUEVO: ESTADO FINALIZAR REPARACIÓN
      const [nuevaReparacionFinalizada, setNuevaReparacionFinalizada] = useState({ idEquipoTaller: '', montoCobrado: '', monedaCobro: 'ARS', walletId: '' });

      // ESTADOS UI
      const [editandoDolar, setEditandoDolar] = useState(false);
      const [dolarInput, setDolarInput] = useState('');
      const [pagoActivo, setPagoActivo] = useState({ idGasto: null, walletId: '' });
      const [pagoDeudaActivo, setPagoDeudaActivo] = useState({ idDeuda: null, walletId: '', montoAbono: '' });
      const [cobroDeudaActivo, setCobroDeudaActivo] = useState({ idDeuda: null, walletId: '', montoCobro: '' }); 
      
      const [editandoActivo, setEditandoActivo] = useState(null);
      const [editandoFijo, setEditandoFijo] = useState(null);
      const [editandoDeuda, setEditandoDeuda] = useState(null);
      const [editandoDeudaCobrar, setEditandoDeudaCobrar] = useState(null); 
      const [editandoStock, setEditandoStock] = useState(null);
      const [editandoGastoPuntual, setEditandoGastoPuntual] = useState(null); 
      const [modalRegistroActividad, setModalRegistroActividad] = useState(null);

      // ESTADOS DE AUDITORÍA
      const [filtroUsuario, setFiltroUsuario] = useState('');
      const [filtroDesde, setFiltroDesde] = useState('');
      const [filtroHasta, setFiltroHasta] = useState('');
      const [consultaAsistente, setConsultaAsistente] = useState('');
      const [chatAsistente, setChatAsistente] = useState([{ emisor: 'bot', texto: '¡Hola! Soy tu asistente de auditoría. Preguntame por ej: "qué gastos agregué ayer", o "movimientos de stock de hoy".' }]);
      const chatEndRef = useRef(null);

      // ==========================================
      // LÓGICA DE AUDITORÍA (LOGS)
      // ==========================================
      const generarLog = (accion, detalle, datosExtra = null) => {
        return { id: Date.now() + Math.floor(Math.random() * 1000), fecha: new Date().toISOString(), usuario: 'Bruno', accion, detalle, datosExtra };
      };

      const opcionesConcepto = useMemo(() => [...new Set(db.historiaConceptos || [])], [db.historiaConceptos]);
      const opcionesStock = useMemo(() => [...new Set(db.historiaStock || [])], [db.historiaStock]);
      const opcionesGremios = useMemo(() => [...new Set(db.historiaGremios || ['iConnecture'])], [db.historiaGremios]);
      const billeterasDisponibles = useMemo(() => (db.activos || []).filter(a => a.tipo !== 'activo'), [db.activos]);

      // LECTURA Y ESCRITURA NUBE
      useEffect(() => {
        async function fetchNube() {
          if (!supaClient) { setIsLoaded(true); return; }
          try {
            const { data, error } = await supaClient.from('iconnecture_data').select('payload').eq('id', 1).single();
            if (error) throw error;
            if (data && data.payload) {
              const baseCargada = {
                cotizacionDolar: data.payload.cotizacionDolar || 1500,
                fechaUltimaCotizacion: data.payload.fechaUltimaCotizacion || '',
                activos: Array.isArray(data.payload.activos) ? data.payload.activos.filter(Boolean) : [],
                gastosFijos: Array.isArray(data.payload.gastosFijos) ? data.payload.gastosFijos.filter(Boolean) : [],
                gastosPuntuales: Array.isArray(data.payload.gastosPuntuales) ? data.payload.gastosPuntuales.filter(Boolean) : [],
                deudas: Array.isArray(data.payload.deudas) ? data.payload.deudas.filter(Boolean) : [],
                deudasCobrar: Array.isArray(data.payload.deudasCobrar) ? data.payload.deudasCobrar.filter(Boolean) : [],
                stock: Array.isArray(data.payload.stock) ? data.payload.stock.filter(Boolean) : [],
                ventas: Array.isArray(data.payload.ventas) ? data.payload.ventas.filter(Boolean) : [],
                taller: Array.isArray(data.payload.taller) ? data.payload.taller.filter(Boolean) : [],
                reparacionesFin: Array.isArray(data.payload.reparacionesFin) ? data.payload.reparacionesFin.filter(Boolean) : [], // Carga reparaciones finalizadas
                historiaConceptos: Array.isArray(data.payload.historiaConceptos) ? data.payload.historiaConceptos : [],
                historiaStock: Array.isArray(data.payload.historiaStock) ? data.payload.historiaStock : [],
                historiaGremios: Array.isArray(data.payload.historiaGremios) ? data.payload.historiaGremios : ['iConnecture'],
                actividad: Array.isArray(data.payload.actividad) ? data.payload.actividad.filter(Boolean) : []
              };
              setDb(baseCargada);
              
              const hoyStr = new Date().toLocaleDateString();
              if (baseCargada.fechaUltimaCotizacion !== hoyStr) {
                  setCotizacionDiariaInput(baseCargada.cotizacionDolar);
                  setBloqueoCotizacion(true);
              }
            }
          } catch (err) { console.error("Iniciando de cero."); }
          setIsLoaded(true);
        }
        fetchNube();
      }, []);

      const guardarEnNube = async (nuevoEstadoDb) => {
        setDb(nuevoEstadoDb);
        if (supaClient) {
          const { error } = await supaClient.from('iconnecture_data').update({ payload: nuevoEstadoDb }).eq('id', 1);
          if (error) alert("Atención: No se pudo guardar en la nube. Revisá tu conexión.");
        }
      };

      const login = (e) => {
        e.preventDefault();
        if (passInput === 'bruno123') { setSesion(true); setErrorLogin(''); }
        else { setErrorLogin('Clave incorrecta'); setPassInput(''); }
      };

      const procesarBloqueoCotizacion = (e) => {
          e.preventDefault();
          const val = parseFloat(cotizacionDiariaInput) || 1500;
          const hoyStr = new Date().toLocaleDateString();
          const log = generarLog('Actualizó Cotización Diaria', `Confirmó cotización del día a $${val}`);
          guardarEnNube({...db, cotizacionDolar: val, fechaUltimaCotizacion: hoyStr, actividad: [log, ...(db.actividad || [])].slice(0, 500)});
          setBloqueoCotizacion(false);
      };

      const convertirParaMostrar = (montoBase, monedaBase) => {
          const val = parseFloat(montoBase) || 0;
          if (monedaVisual === 'USD') return monedaBase === 'USD' ? val : val / db.cotizacionDolar;
          else return monedaBase === 'ARS' ? val : val * db.cotizacionDolar;
      };

      const formatDinero = (monto) => {
          if (modoPrivado) return `**** ${monedaVisual}`;
          const val = parseFloat(monto || 0);
          return `${monedaVisual === 'USD' ? 'U$D' : '$'} ${val.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${monedaVisual}`;
      };

      const calcularDiasPasados = (timestamp) => {
          if (!timestamp) return 0;
          return Math.floor((Date.now() - timestamp) / (1000 * 60 * 60 * 24)); 
      };

      // ==========================================
      // FUNCIONES DE LIMPIEZA
      // ==========================================
      const limpiarHistoriaConceptos = () => {
        if(window.confirm("¿Estás seguro de vaciar el historial de nombres de gastos? (Tus gastos cargados no se borran)")) {
          const log = generarLog('Limpió Historial', 'Vació la memoria de conceptos de gastos.');
          guardarEnNube({...db, historiaConceptos: [], actividad: [log, ...(db.actividad || [])].slice(0, 500)});
        }
      };

      const limpiarHistoriaStock = () => {
        if(window.confirm("¿Estás seguro de vaciar el historial de nombres de repuestos? (Tu stock actual no se borra)")) {
          const log = generarLog('Limpió Historial', 'Vació la memoria de conceptos de stock.');
          guardarEnNube({...db, historiaStock: [], actividad: [log, ...(db.actividad || [])].slice(0, 500)});
        }
      };

      // ==========================================
      // ASISTENTE INTELIGENTE
      // ==========================================
      useEffect(() => { if(chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: 'smooth' }); }, [chatAsistente, vista]);

      const procesarConsultaAsistente = (e) => {
        e.preventDefault();
        const textoUser = consultaAsistente.trim();
        if(!textoUser) return;
        
        setChatAsistente(prev => [...prev, { emisor: 'user', texto: textoUser }]);
        setConsultaAsistente('');

        const lower = textoUser.toLowerCase();
        let logsMatch = [...(db.actividad || [])];
        const hoy = new Date();
        const ayer = new Date(); ayer.setDate(hoy.getDate() - 1);

        if (lower.includes('hoy')) { logsMatch = logsMatch.filter(l => new Date(l.fecha).toLocaleDateString() === hoy.toLocaleDateString()); } 
        else if (lower.includes('ayer')) { logsMatch = logsMatch.filter(l => new Date(l.fecha).toLocaleDateString() === ayer.toLocaleDateString()); }

        if (lower.includes('gasto') || lower.includes('gastos')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('gasto'));
        else if (lower.includes('deuda') || lower.includes('deudas')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('deuda'));
        else if (lower.includes('stock') || lower.includes('repuesto') || lower.includes('bateria') || lower.includes('batería')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('stock') || l.accion.toLowerCase().includes('repuesto'));
        else if (lower.includes('activo') || lower.includes('billetera') || lower.includes('plata') || lower.includes('transferencia')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('billetera') || l.accion.toLowerCase().includes('activo') || l.accion.toLowerCase().includes('pago') || l.accion.toLowerCase().includes('movimiento'));
        else if (lower.includes('venta') || lower.includes('comision')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('venta') || l.accion.toLowerCase().includes('comisi'));
        else if (lower.includes('taller') || lower.includes('reparacion') || lower.includes('arreglo') || lower.includes('equipo')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('taller') || l.accion.toLowerCase().includes('equipo'));

        if (lower.includes('bruno')) logsMatch = logsMatch.filter(l => l.usuario.toLowerCase() === 'bruno');

        setTimeout(() => {
            let respuesta = '';
            if (logsMatch.length === 0) respuesta = "Revisé los registros y no encontré ningún movimiento que coincida con lo que me pedís.";
            else {
                let limite = 5;
                const ultimos = logsMatch.slice(0, limite);
                respuesta = `Encontré ${logsMatch.length} movimientos relacionados a eso. Acá tenés los más recientes:\n\n` + ultimos.map(l => `• ${l.detalle}`).join('\n\n');
                if(logsMatch.length > limite) respuesta += `\n\n*(Y ${logsMatch.length - limite} movimientos más que podés ver abajo en la tabla)*`;
            }
            setChatAsistente(prev => [...prev, { emisor: 'bot', texto: respuesta }]);
        }, 500); 
      };

      // ==========================================
      // REEMBOLSOS Y DESCUENTOS SEGUROS
      // ==========================================
      const procesarDescuentoSeguro = (walletId, montoGasto, monedaGasto, activosActuales) => {
        const activosClon = [...activosActuales];
        const idx = activosClon.findIndex(w => w.id === parseInt(walletId));
        if (idx === -1) return { success: false, msg: 'Billetera no encontrada' };
        
        const wallet = activosClon[idx];
        let montoARestar = parseFloat(montoGasto);
        if (monedaGasto === 'ARS' && wallet.moneda === 'USD') montoARestar = montoARestar / db.cotizacionDolar;
        if (monedaGasto === 'USD' && wallet.moneda === 'ARS') montoARestar = montoARestar * db.cotizacionDolar;
        
        if (parseFloat(wallet.monto) < montoARestar) {
            return { success: false, msg: `Saldo insuficiente en ${wallet.nombre}. Tenés ${wallet.monto} ${wallet.moneda} e intentás descontar el equivalente a ${montoARestar.toFixed(2)} ${wallet.moneda}.` };
        }
        
        activosClon[idx].monto = (parseFloat(wallet.monto) - montoARestar).toFixed(2);
        return { success: true, activosActualizados: activosClon };
      };

      const procesarReembolsoWallet = (walletId, montoAReembolsar, monedaReembolso, activosActuales) => {
        const activosClon = [...activosActuales];
        const idx = activosClon.findIndex(w => w.id === parseInt(walletId));
        if (idx === -1) return activosClon; 
        
        const wallet = activosClon[idx];
        let montoASumar = parseFloat(montoAReembolsar);
        if (monedaReembolso === 'ARS' && wallet.moneda === 'USD') montoASumar = montoASumar / db.cotizacionDolar;
        if (monedaReembolso === 'USD' && wallet.moneda === 'ARS') montoASumar = montoASumar * db.cotizacionDolar;
        
        activosClon[idx].monto = (parseFloat(wallet.monto) + montoASumar).toFixed(2);
        return activosClon;
      };

      // ==========================================
      // HANDLERS FINANCIEROS Y DE NEGOCIO
      // ==========================================
      const agregarActivo = (e) => {
        e.preventDefault();
        const item = { id: Date.now(), nombre: nuevoActivo.nombre.trim(), monto: parseFloat(nuevoActivo.monto) || 0, moneda: nuevoActivo.moneda, tipo: nuevoActivo.tipo };
        const log = generarLog('Creó Billetera/Activo', `Creó ${item.tipo}: "${item.nombre}" con saldo inicial de ${item.monto} ${item.moneda}`, item);
        guardarEnNube({ ...db, activos: [item, ...db.activos], actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevoActivo({ nombre: '', monto: '', moneda: 'USD', tipo: 'billetera' });
      };

      const procesarTransferenciaInterna = (e) => {
          e.preventDefault();
          if (nuevaTransferencia.origenId === nuevaTransferencia.destinoId) return alert('La billetera de origen no puede ser igual a la de destino.');
          const montoTransferir = parseFloat(nuevaTransferencia.monto);
          if (montoTransferir <= 0) return alert('Ingresá un monto válido para transferir.');

          const operacionDescuento = procesarDescuentoSeguro(nuevaTransferencia.origenId, montoTransferir, nuevaTransferencia.moneda, db.activos);
          if (!operacionDescuento.success) return alert(operacionDescuento.msg);

          const activosPostTransferencia = procesarReembolsoWallet(nuevaTransferencia.destinoId, montoTransferir, nuevaTransferencia.moneda, operacionDescuento.activosActualizados);

          const nombreOrigen = db.activos.find(a => a.id === parseInt(nuevaTransferencia.origenId))?.nombre;
          const nombreDestino = db.activos.find(a => a.id === parseInt(nuevaTransferencia.destinoId))?.nombre;
          
          const log = generarLog('Movimiento Interno', `Transfirió ${montoTransferir} ${nuevaTransferencia.moneda} de "${nombreOrigen}" hacia "${nombreDestino}".`);
          
          guardarEnNube({ ...db, activos: activosPostTransferencia, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
          setNuevaTransferencia({ origenId: '', destinoId: '', monto: '', moneda: 'ARS' });
      };

      const agregarGastoPuntual = (e) => {
        e.preventDefault();
        if (!nuevoGastoPuntual.walletId || !nuevoGastoPuntual.concepto) return alert('Completá los datos.');
        const operacion = procesarDescuentoSeguro(nuevoGastoPuntual.walletId, nuevoGastoPuntual.monto, nuevoGastoPuntual.moneda, db.activos);
        if (!operacion.success) return alert(operacion.msg); 
        
        const walletUsada = db.activos.find(w => w.id === parseInt(nuevoGastoPuntual.walletId));
        const conceptoTrim = nuevoGastoPuntual.concepto.trim();
        const item = { id: Date.now(), concepto: conceptoTrim, monto: parseFloat(nuevoGastoPuntual.monto) || 0, moneda: nuevoGastoPuntual.moneda, fecha: new Date().toLocaleDateString(), pagadoCon: walletUsada?.nombre || 'Desconocido', walletIdOriginal: walletUsada?.id };

        const nuevaHistoriaConceptos = [...new Set([conceptoTrim, ...(db.historiaConceptos || [])])];
        const log = generarLog('Creó Gasto Suelto', `Registró gasto en "${item.concepto}" por ${item.monto} ${item.moneda}. Pagado con ${item.pagadoCon}.`, item);

        guardarEnNube({ ...db, activos: operacion.activosActualizados, gastosPuntuales: [item, ...(db.gastosPuntuales || [])], historiaConceptos: nuevaHistoriaConceptos, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevoGastoPuntual({ concepto: '', monto: '', moneda: 'ARS', walletId: nuevoGastoPuntual.walletId });
        setMostrarInputConceptoLibre(false);
      };

      const eliminarGastoPuntual = (itemGasto) => {
        if(window.confirm(`¿Eliminar gasto de ${itemGasto.concepto}? El dinero será reembolsado a ${itemGasto.pagadoCon}.`)){
            const activosReembolsados = procesarReembolsoWallet(itemGasto.walletIdOriginal, itemGasto.monto, itemGasto.moneda, db.activos);
            const log = generarLog('Eliminó Gasto Suelto', `Eliminó gasto de "${itemGasto.concepto}" por ${itemGasto.monto} ${itemGasto.moneda}. Dinero reembolsado a ${itemGasto.pagadoCon}.`, itemGasto);
            guardarEnNube({ ...db, activos: activosReembolsados, gastosPuntuales: db.gastosPuntuales.filter(x => x.id !== itemGasto.id), actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        }
      };

      const procesarEdicionGastoPuntual = (e) => {
        e.preventDefault();
        const gastoOriginal = db.gastosPuntuales.find(g => g.id === editandoGastoPuntual.id);
        const activosReembolsados = procesarReembolsoWallet(gastoOriginal.walletIdOriginal, gastoOriginal.monto, gastoOriginal.moneda, db.activos);
        const operacionNuevoDescuento = procesarDescuentoSeguro(editandoGastoPuntual.walletIdOriginal, editandoGastoPuntual.monto, editandoGastoPuntual.moneda, activosReembolsados);
        
        if (!operacionNuevoDescuento.success) { return alert(operacionNuevoDescuento.msg + " (El gasto original no se modificó)."); }

        const nombreWalletNueva = operacionNuevoDescuento.activosActualizados.find(w => w.id === parseInt(editandoGastoPuntual.walletIdOriginal))?.nombre;

      const agregarGastoFijo = (e) => {
        e.preventDefault();
        const item = { 
          id: Date.now(), concepto: nuevoGastoFijo.concepto.trim(), monto: parseFloat(nuevoGastoFijo.monto) || 0, moneda: nuevoGastoFijo.moneda, tipo: nuevoGastoFijo.tipo, diaVencimiento: nuevoGastoFijo.diaVencimiento,
          cuotasTotales: nuevoGastoFijo.tipo === 'cuotas' ? parseInt(nuevoGastoFijo.cuotasTotales) || 1 : null, cuotasPagadas: nuevoGastoFijo.tipo === 'cuotas' ? 0 : null, ultimoPago: null
        };

        setNuevoGastoFijo({ concepto: '', monto: '', moneda: 'ARS', tipo: 'fijo', cuotasTotales: '3', diaVencimiento: '1' });

      const procesarPagoFijo = (itemFijo) => {
        if (!pagoActivo.walletId) return alert('Elegí una billetera para descontar el pago.');
        const operacion = procesarDescuentoSeguro(pagoActivo.walletId, itemFijo.monto, itemFijo.moneda, db.activos);
        if (!operacion.success) return alert(operacion.msg); 
        
        const gastosFijosActualizados = db.gastosFijos.map(g => {
          if (g.id === itemFijo.id) return { ...g, cuotasPagadas: g.tipo === 'cuotas' ? g.cuotasPagadas + 1 : g.cuotasPagadas, ultimoPago: new Date().toLocaleDateString() };

        });
        const walletUsada = operacion.activosActualizados.find(w => w.id === parseInt(pagoActivo.walletId))?.nombre;
        const log = generarLog('Efectuó Pago (Fijo/Cuota)', `Pagó "${itemFijo.concepto}" (${itemFijo.monto} ${itemFijo.moneda}) desde la billetera ${walletUsada}.`, itemFijo);
        guardarEnNube({ ...db, activos: operacion.activosActualizados, gastosFijos: gastosFijosActualizados, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setPagoActivo({ idGasto: null, walletId: '' }); 
      };

      const agregarDeuda = (e) => {
        e.preventDefault();
        const montoNuevo = parseFloat(nuevaDeuda.monto) || 0;
        let deudasActualizadas = [...(db.deudas || [])];
        const idxExistente = deudasActualizadas.findIndex(d => d.acreedor.trim().toLowerCase() === nuevaDeuda.acreedor.trim().toLowerCase() && d.moneda === nuevaDeuda.moneda);

        let log;
        if (idxExistente !== -1) {
          deudasActualizadas[idxExistente].monto = (parseFloat(deudasActualizadas[idxExistente].monto) + montoNuevo).toFixed(2);
          deudasActualizadas[idxExistente].motivo = nuevaDeuda.motivo.trim(); 
          log = generarLog('Aumentó Deuda Existente', `Le sumó ${montoNuevo} ${nuevaDeuda.moneda} a la deuda con "${deudasActualizadas[idxExistente].acreedor}". Motivo: ${nuevaDeuda.motivo}`, deudasActualizadas[idxExistente]);
        } else {
          const item = { id: Date.now(), acreedor: nuevaDeuda.acreedor.trim(), motivo: nuevaDeuda.motivo.trim(), monto: montoNuevo.toFixed(2), moneda: nuevaDeuda.moneda, fecha: new Date().toLocaleDateString() };
          deudasActualizadas.unshift(item);
          log = generarLog('Creó Nueva Deuda', `Registró deuda con "${item.acreedor}" por ${item.monto} ${item.moneda}. Motivo: ${item.motivo}`, item);
        }
        guardarEnNube({ ...db, deudas: deudasActualizadas, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevaDeuda({ acreedor: '', motivo: '', monto: '', moneda: 'USD' });
      };

      const procesarPagoDeuda = (itemDeuda) => {
        if (!pagoDeudaActivo.walletId || !pagoDeudaActivo.montoAbono) return alert('Completá los datos.');
        const abono = parseFloat(pagoDeudaActivo.montoAbono);
        if (abono > parseFloat(itemDeuda.monto)) return alert('No podés abonar más dinero del que debés.');

        const operacion = procesarDescuentoSeguro(pagoDeudaActivo.walletId, abono, itemDeuda.moneda, db.activos);
        if (!operacion.success) return alert(operacion.msg); 

        const nuevoMontoDeuda = parseFloat(itemDeuda.monto) - abono;
        let deudasActualizadas = [];
        if (nuevoMontoDeuda <= 0.05) deudasActualizadas = (db.deudas || []).filter(d => d.id !== itemDeuda.id);
        else deudasActualizadas = (db.deudas || []).map(d => d.id === itemDeuda.id ? { ...d, monto: nuevoMontoDeuda.toFixed(2) } : d);

        const walletUsada = operacion.activosActualizados.find(w => w.id === parseInt(pagoDeudaActivo.walletId))?.nombre;
        const log = generarLog('Abonó a Deuda', `Abonó ${abono} ${itemDeuda.moneda} a la deuda de "${itemDeuda.acreedor}" desde la billetera ${walletUsada}.`, { deudaOriginal: itemDeuda, abono, walletUsada });

        guardarEnNube({ ...db, activos: operacion.activosActualizados, deudas: deudasActualizadas, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setPagoDeudaActivo({ idDeuda: null, walletId: '', montoAbono: '' });
      };

      const agregarDeudaCobrar = (e) => {
        e.preventDefault();
        if (!nuevaDeudaCobrar.walletId) return alert('Tenés que seleccionar de qué billetera le prestaste la plata para descontarla.');
        
        const montoPrestado = parseFloat(nuevaDeudaCobrar.monto) || 0;
        const operacion = procesarDescuentoSeguro(nuevaDeudaCobrar.walletId, montoPrestado, nuevaDeudaCobrar.moneda, db.activos);
        if (!operacion.success) return alert(operacion.msg);

        let deudasCobrarActualizadas = [...(db.deudasCobrar || [])];
        const idxExistente = deudasCobrarActualizadas.findIndex(d => d.deudor.trim().toLowerCase() === nuevaDeudaCobrar.deudor.trim().toLowerCase() && d.moneda === nuevaDeudaCobrar.moneda);

        let log;
        if (idxExistente !== -1) {
          deudasCobrarActualizadas[idxExistente].monto = (parseFloat(deudasCobrarActualizadas[idxExistente].monto) + montoPrestado).toFixed(2);
          deudasCobrarActualizadas[idxExistente].motivo = nuevaDeudaCobrar.motivo.trim(); 
          log = generarLog('Aumentó Deuda a Favor', `Prestó ${montoPrestado} ${nuevaDeudaCobrar.moneda} extra a "${deudasCobrarActualizadas[idxExistente].deudor}". Motivo: ${nuevaDeudaCobrar.motivo}`, deudasCobrarActualizadas[idxExistente]);
        } else {
          const item = { id: Date.now(), deudor: nuevaDeudaCobrar.deudor.trim(), motivo: nuevaDeudaCobrar.motivo.trim(), monto: montoPrestado.toFixed(2), moneda: nuevaDeudaCobrar.moneda, fecha: new Date().toLocaleDateString() };
          deudasCobrarActualizadas.unshift(item);
          log = generarLog('Creó Cuenta a Cobrar', `Prestó ${item.monto} ${item.moneda} a "${item.deudor}". Motivo: ${item.motivo}`, item);
        }

        guardarEnNube({ ...db, activos: operacion.activosActualizados, deudasCobrar: deudasCobrarActualizadas, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevaDeudaCobrar({ deudor: '', motivo: '', monto: '', moneda: 'USD', walletId: '' });
      };

      const procesarCobroDeuda = (itemDeuda) => {
        if (!cobroDeudaActivo.walletId || !cobroDeudaActivo.montoCobro) return alert('Completá los datos.');
        const cobro = parseFloat(cobroDeudaActivo.montoCobro);
        if (cobro > parseFloat(itemDeuda.monto)) return alert('No podés cobrar más dinero del que te deben.');

        const activosConCobro = procesarReembolsoWallet(cobroDeudaActivo.walletId, cobro, itemDeuda.moneda, db.activos);
        const nuevoMontoDeuda = parseFloat(itemDeuda.monto) - cobro;
        let deudasCobrarActualizadas = [];
        
        if (nuevoMontoDeuda <= 0.05) deudasCobrarActualizadas = (db.deudasCobrar || []).filter(d => d.id !== itemDeuda.id);
        else deudasCobrarActualizadas = (db.deudasCobrar || []).map(d => d.id === itemDeuda.id ? { ...d, monto: nuevoMontoDeuda.toFixed(2) } : d);

        const walletUsada = activosConCobro.find(w => w.id === parseInt(cobroDeudaActivo.walletId))?.nombre;
        const log = generarLog('Registró Cobro', `Recibió ${cobro} ${itemDeuda.moneda} de "${itemDeuda.deudor}". Dinero ingresado a billetera ${walletUsada}.`, { deudaOriginal: itemDeuda, cobro, walletUsada });

        guardarEnNube({ ...db, activos: activosConCobro, deudasCobrar: deudasCobrarActualizadas, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setCobroDeudaActivo({ idDeuda: null, walletId: '', montoCobro: '' });
      };

      const eliminarDeudaCobrar = (itemDeuda) => {
        if(window.confirm(`¿Estás seguro de eliminar la deuda de ${itemDeuda.deudor} sin recuperar la plata a ninguna billetera? (Se asume incobrable)`)){
            const log = generarLog('Eliminó Cuenta a Cobrar', `Borró la deuda de "${itemDeuda.deudor}" por ${itemDeuda.monto} ${itemDeuda.moneda} sin ingresarlo a billeteras (Incobrable).`, itemDeuda);
            guardarEnNube({ ...db, deudasCobrar: (db.deudasCobrar || []).filter(x => x.id !== itemDeuda.id), actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        }
      };

      const agregarStock = (e) => {
        e.preventDefault();
        const conceptoTrim = nuevoStock.concepto.trim();
        let stockActualizado = [...(db.stock || [])];
        const idx = stockActualizado.findIndex(s => s.concepto.toLowerCase().trim() === conceptoTrim.toLowerCase());
        
        let log;
        if (idx !== -1) {
          stockActualizado[idx].cantidad = parseInt(stockActualizado[idx].cantidad) + parseInt(nuevoStock.cantidad);
          stockActualizado[idx].monto = parseFloat(nuevoStock.monto) || 0;
          stockActualizado[idx].moneda = nuevoStock.moneda;
          log = generarLog('Aumentó Repuesto Existente', `Sumó ${nuevoStock.cantidad} unid. de "${stockActualizado[idx].concepto}".`, stockActualizado[idx]);
        } else {
          const item = { id: Date.now(), concepto: conceptoTrim, cantidad: parseInt(nuevoStock.cantidad) || 1, monto: parseFloat(nuevoStock.monto) || 0, moneda: nuevoStock.moneda };
          stockActualizado.unshift(item);
          log = generarLog('Creó Nuevo Repuesto', `Ingresó ${item.cantidad} unid. de "${item.concepto}" a ${item.monto} ${item.moneda} c/u.`, item);
        }
        
        const nuevaHistoriaStock = [...new Set([conceptoTrim, ...(db.historiaStock || [])])];
        guardarEnNube({ ...db, stock: stockActualizado, historiaStock: nuevaHistoriaStock, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevoStock({ concepto: '', cantidad: '1', monto: '', moneda: 'USD' });
        setMostrarInputStockLibre(false);
      };

      const modificarCantidadStock = (id, delta) => {
        const itemAfectado = db.stock.find(s => s.id === id);
        const nuevaCant = Math.max(0, parseInt(itemAfectado.cantidad) + delta);
        const stockActualizado = db.stock.map(s => s.id === id ? { ...s, cantidad: nuevaCant } : s);
        const accionTexto = delta > 0 ? 'Sumó +1 unidad' : 'Restó -1 unidad';
        const log = generarLog('Modificó Cantidad Stock', `${accionTexto} de "${itemAfectado.concepto}". Quedan ${nuevaCant}.`, { itemAfectado, delta });
        guardarEnNube({ ...db, stock: stockActualizado, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
      };

      const registrarVenta = (e) => {
          e.preventDefault();
          const cantidad = parseInt(nuevaVenta.cantidad) || 1;
          const comisionUnitaria = parseFloat(nuevaVenta.comisionPorUnidad) || 0;
          const totalComision = cantidad * comisionUnitaria;
          if (totalComision <= 0) return alert('La comisión total debe ser mayor a cero.');

          const registroVenta = { id: Date.now(), fecha: new Date().toLocaleDateString(), cantidad, comisionUnitaria, totalComision, moneda: nuevaVenta.moneda };
          const ventasActualizadas = [registroVenta, ...(db.ventas || [])];

          let deudasCobrarActualizadas = [...(db.deudasCobrar || [])];
          const acreedorComisiones = "Comisiones de Venta de Equipos";
          const idxExistente = deudasCobrarActualizadas.findIndex(d => d.deudor === acreedorComisiones && d.moneda === nuevaVenta.moneda);

          if (idxExistente !== -1) {
              deudasCobrarActualizadas[idxExistente].monto = (parseFloat(deudasCobrarActualizadas[idxExistente].monto) + totalComision).toFixed(2);
          } else {
              const itemCobrar = {
                  id: Date.now() + 1, deudor: acreedorComisiones, motivo: "Acumulado de ventas",
                  monto: totalComision.toFixed(2), moneda: nuevaVenta.moneda, fecha: new Date().toLocaleDateString()
              };
              deudasCobrarActualizadas.unshift(itemCobrar);
          }
          const log = generarLog('Registró Venta de Teléfonos', `Vendió ${cantidad} equipos. Comisión acumulada en Cuentas por Cobrar: ${totalComision.toFixed(2)} ${nuevaVenta.moneda}.`, registroVenta);

          guardarEnNube({ ...db, ventas: ventasActualizadas, deudasCobrar: deudasCobrarActualizadas, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
          setNuevaVenta({ cantidad: '1', comisionPorUnidad: '20000', moneda: 'ARS' });
      };

      const eliminarRegistroVenta = (itemVenta) => {
          if (window.confirm("¿Seguro querés eliminar este registro de venta? OJO: Esto NO restará la plata de tus Cuentas por Cobrar, solo borrará el historial de esta venta.")) {
              const log = generarLog('Eliminó Registro de Venta', `Borró el historial de venta del ${itemVenta.fecha} por ${itemVenta.totalComision} ${itemVenta.moneda}.`);
              guardarEnNube({ ...db, ventas: db.ventas.filter(v => v.id !== itemVenta.id), actividad: [log, ...(db.actividad || [])].slice(0, 500) });
          }
      };

      // ==========================================
      // MÓDULO TALLER Y REPARACIONES
      // ==========================================
      const agregarReparacion = (e) => {
          e.preventDefault();
          if (nuevaReparacion.imei.length !== 15) return alert('Error: El IMEI debe tener exactamente 15 números.');
          if (!nuevaReparacion.modelo || !nuevaReparacion.estadoVisual || !nuevaReparacion.falla) return alert('Completá los campos obligatorios del equipo (Modelo, Estado Visual y Falla).');

          if (nuevaReparacion.origen === 'cliente') {
              if (nuevaReparacion.clienteTelefono.length !== 10) return alert('Error: El número de teléfono debe tener exactamente 10 números (Cód área sin 0 + número sin 15).');
              if (!nuevaReparacion.clienteNombre) return alert('Al ser un cliente particular, tenés que ingresar el Nombre de contacto.');
          } else {
              if (!nuevaReparacion.gremio) return alert('Elegí o ingresá el Gremio/Mayorista.');
          }

          const tsNow = Date.now();
          const gremioFinal = nuevaReparacion.origen === 'gremio' ? nuevaReparacion.gremio.trim() : '';

          const itemTaller = {
              id: tsNow, fechaTimestamp: tsNow, origen: nuevaReparacion.origen, gremio: gremioFinal, modelo: nuevaReparacion.modelo.trim(), imei: nuevaReparacion.imei.trim(),
              clienteNombre: nuevaReparacion.origen === 'cliente' ? nuevaReparacion.clienteNombre.trim() : '',
              clienteTelefono: nuevaReparacion.origen === 'cliente' ? nuevaReparacion.clienteTelefono.trim() : '',
              estadoVisual: nuevaReparacion.estadoVisual.trim(), falla: nuevaReparacion.falla.trim(),
              presupuesto: nuevaReparacion.origen === 'cliente' ? (parseFloat(nuevaReparacion.presupuesto) || null) : null,
              presupuestoMoneda: nuevaReparacion.origen === 'cliente' ? nuevaReparacion.presupuestoMoneda : 'ARS'
          };

          let nuevosGremios = db.historiaGremios || ['iConnecture'];
          if (nuevaReparacion.origen === 'gremio' && gremioFinal) nuevosGremios = [...new Set([gremioFinal, ...nuevosGremios])];

          const propietarioLog = nuevaReparacion.origen === 'cliente' ? itemTaller.clienteNombre : itemTaller.gremio;
          const log = generarLog('Ingresó Equipo a Taller', `Ingresó un ${itemTaller.modelo} (${itemTaller.origen}: ${propietarioLog}). Falla: ${itemTaller.falla}`, itemTaller);

          guardarEnNube({ ...db, taller: [itemTaller, ...(db.taller || [])], historiaGremios: nuevosGremios, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
          setNuevaReparacion({ origen: nuevaReparacion.origen, gremio: '', modelo: '', imei: '', clienteNombre: '', clienteTelefono: '', estadoVisual: '', falla: '', presupuesto: '', presupuestoMoneda: 'ARS' });
          setMostrarInputGremioLibre(false);
      };

      const eliminarEquipoTaller = (itemEquipo) => {
          if (window.confirm(`¿Estás seguro de ELIMINAR el registro de este ${itemEquipo.modelo} sin cobrar nada?`)) {
              const log = generarLog('Eliminó Equipo de Taller', `Se eliminó el ${itemEquipo.modelo} (IMEI: ${itemEquipo.imei}) sin finalizar ni cobrar.`, itemEquipo);
              guardarEnNube({ ...db, taller: (db.taller || []).filter(e => e.id !== itemEquipo.id), actividad: [log, ...(db.actividad || [])].slice(0, 500) });
          }
      };

      // NUEVO: FINALIZAR REPARACIÓN Y COBRAR
      const procesarFinalizacionReparacion = (e) => {
          e.preventDefault();
          if (!nuevaReparacionFinalizada.idEquipoTaller || !nuevaReparacionFinalizada.walletId) return alert('Elegí el equipo y la billetera donde ingresará el cobro.');
          
          const montoCobro = parseFloat(nuevaReparacionFinalizada.montoCobro) || 0;
          const equipo = db.taller.find(t => t.id === parseInt(nuevaReparacionFinalizada.idEquipoTaller));
          
          if (!equipo) return alert('Error: Equipo no encontrado en el taller.');

          // 1. Ingresar plata a billetera
          const activosConCobro = procesarReembolsoWallet(nuevaReparacionFinalizada.walletId, montoCobro, nuevaReparacionFinalizada.monedaCobro, db.activos);
          
          // 2. Registrar en historial de reparaciones finalizadas
          const registroFin = {
              id: Date.now(),
              fecha: new Date().toLocaleDateString(),
              equipoOriginal: equipo,
              montoCobrado: montoCobro,
              monedaCobro: nuevaReparacionFinalizada.monedaCobro
          };
          
          const reparacionesFinActualizadas = [registroFin, ...(db.reparacionesFin || [])];
          
          // 3. Eliminar del taller activo
          const tallerActualizado = (db.taller || []).filter(e => e.id !== equipo.id);

          const nombreWallet = activosConCobro.find(w => w.id === parseInt(nuevaReparacionFinalizada.walletId))?.nombre;
          const log = generarLog('Finalizó Reparación y Cobró', `Entregó ${equipo.modelo} y cobró ${montoCobro} ${nuevaReparacionFinalizada.monedaCobro}. Ingreso a billetera ${nombreWallet}.`, registroFin);

          guardarEnNube({ ...db, activos: activosConCobro, taller: tallerActualizado, reparacionesFin: reparacionesFinActualizadas, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
          
          setNuevaReparacionFinalizada({ idEquipoTaller: '', montoCobrado: '', monedaCobro: 'ARS', walletId: '' });
      };

      // --- CÁLCULOS TOTALES DASHBOARD ---
      const totalBilleterasUSD = (db.activos || []).filter(a => a.tipo === 'billetera' || !a.tipo).reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      const totalActivosFisicosUSD = (db.activos || []).filter(a => a.tipo === 'activo').reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      const totalStockUSD = (db.stock || []).reduce((acc, item) => acc + ((item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar) * parseInt(item.cantidad)), 0);
      const totalDeudasPendientesUSD = (db.deudas || []).reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      const totalDeudasCobrarUSD = (db.deudasCobrar || []).reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      
      const totalGastosFijosUSD = (db.gastosFijos || []).reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      const totalGastosPuntualesUSD = (db.gastosPuntuales || []).reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      
      const totalVentasHistoricasUSD = (db.ventas || []).reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.totalComision):parseFloat(item.totalComision)/db.cotizacionDolar), 0);
      const totalEquiposVendidos = (db.ventas || []).reduce((acc, item) => acc + parseInt(item.cantidad), 0);

                    <div>
                        <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1"><i className="fa-solid fa-cart-shopping mr-2"></i>Sueltos (Histórico)</p>
                        <h2 className="text-4xl font-black text-indigo-400">{formatDinero(convertirParaMostrar(totalGastosPuntualesUSD, 'USD'))}</h2>
                    </div>
                    <i className="fa-solid fa-basket-shopping text-4xl text-indigo-500/20"></i>
                  </div>
                </div>
                {/* Barras y Listados de Gastos OMITIDOS EN ESTE SNIPPET VISUAL POR BREVEDAD, SE MANTIENEN IGUAL QUE ANTES */}
                 <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-xl">
                  <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-6"><i className="fa-solid fa-chart-pie mr-2 text-indigo-400"></i>Distribución de Gastos Sueltos</h3>
                  <div className="space-y-5">
                    {gastosPorCategoria.length === 0 ? (
                        <p className="text-xs text-slate-500 text-center py-4">No hay gastos suficientes para analizar.</p>
                    ) : (
                        gastosPorCategoria.map((cat, i) => (
                            <div key={cat.categoria} className="group">
                                <div className="flex justify-between items-end mb-2">
                                    <span className="font-bold text-white text-sm">{cat.categoria}</span>
                                    <div className="text-right">
                                        <span className="font-mono text-xs text-slate-300 mr-2">{formatDinero(cat.montoGrafico)}</span>
                                        {!modoPrivado && <span className="font-black text-white bg-slate-800 px-2 py-1 rounded text-[10px]">{cat.porcentaje.toFixed(1)}%</span>}
                                    </div>
                                </div>
                                <div className="w-full bg-slate-950 rounded-full h-3 border border-slate-800 overflow-hidden">
                                    <div className={`h-full rounded-full ${COLORES_GRAFICO[i % COLORES_GRAFICO.length]} transition-all duration-1000 ease-out`} style={{width: modoPrivado ? '0%' : `${cat.porcentaje}%`}}></div>
                                </div>
                            </div>
                        ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* VISTA 8: REPARACIONES FINALIZADAS (NUEVO) */}
            {vista === 'reparacionesFin' && (
              <div className="max-w-4xl mx-auto space-y-8 pb-20 fade-in">
                
                <div className="bg-gradient-to-br from-cyan-900/40 to-slate-900 border border-cyan-500/30 rounded-3xl p-8 shadow-xl text-center">
                  <p className="text-sm font-bold text-cyan-400 uppercase tracking-widest mb-3"><i className="fa-solid fa-clipboard-check mr-2"></i>Histórico Ganancias de Taller</p>
                  <h2 className="text-5xl font-black text-white">{formatDinero(convertirParaMostrar(totalGananciaReparacionesUSD, 'USD'))}</h2>
                  <p className="text-slate-400 text-xs font-mono mt-3">Suma de todas las reparaciones entregadas y cobradas.</p>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6 shadow-xl">
                  <div className="border-b border-slate-800 pb-3">
                    <h3 className="text-lg font-bold text-white">Finalizar y Entregar Equipo</h3>
                    <p className="text-xs text-slate-400 mt-1">Seleccioná un equipo que esté en el taller para darlo de baja y sumar el pago a tu caja.</p>
                  </div>
                  
                  <form onSubmit={procesarFinalizacionReparacion} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-4 shadow-inner">
                    <div>
                        <label className="text-xs text-slate-400 font-bold block mb-2">Equipo Listo para Entregar</label>
                        <select required value={nuevaReparacionFinalizada.idEquipoTaller} onChange={e => setNuevaReparacionFinalizada({...nuevaReparacionFinalizada, idEquipoTaller: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm font-bold focus:outline-none focus:border-cyan-500">
                            <option value="">-- Seleccionar Equipo del Taller --</option>
                            {(db.taller || []).map(t => <option key={t.id} value={t.id}>{t.modelo} - {t.origen === 'cliente' ? t.clienteNombre : t.gremio} (Falla: {t.falla})</option>)}
                        </select>
                    </div>

                    <div className="flex gap-4">
                        <div className="flex-1">
                            <label className="text-xs text-slate-400 font-bold block mb-1">Monto Cobrado (Ganancia)</label>
                            <div className="flex">
                                <input type="number" step="any" required placeholder="0.00" value={nuevaReparacionFinalizada.montoCobrado} onChange={e => setNuevaReparacionFinalizada({...nuevaReparacionFinalizada, montoCobrado: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-l-xl px-4 py-3 text-white font-mono focus:outline-none focus:border-cyan-500" />
                                <select value={nuevaReparacionFinalizada.monedaCobro} onChange={e => setNuevaReparacionFinalizada({...nuevaReparacionFinalizada, monedaCobro: e.target.value})} className="bg-slate-900 border border-slate-700 rounded-r-xl px-3 py-3 text-white font-bold focus:outline-none focus:border-cyan-500 border-l-0"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                            </div>
                        </div>
                        <div className="flex-1">
                            <label className="text-xs text-slate-400 font-bold block mb-1">Entró a Billetera</label>
                            <select required value={nuevaReparacionFinalizada.walletId} onChange={e => setNuevaReparacionFinalizada({...nuevaReparacionFinalizada, walletId: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white text-xs font-bold focus:outline-none focus:border-cyan-500">
                              <option value="">¿Dónde ingresó la plata?</option>
                              {billeterasDisponibles.map(a => <option key={a.id} value={a.id}>💳 {a.nombre}</option>)}
                            </select>
                        </div>
                    </div>
                    <button type="submit" className="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 rounded-xl transition text-base shadow-lg">Entregar Equipo y Cobrar</button>
                  </form>

                  <div className="space-y-4 pt-4">
                    <h4 className="text-sm font-bold text-slate-400 uppercase tracking-widest border-b border-slate-800 pb-2 mb-4">Historial de Reparaciones Finalizadas</h4>
                    {(db.reparacionesFin || []).length === 0 ? <p className="text-center text-slate-500 py-6 text-sm font-bold border-2 border-dashed border-slate-800 rounded-xl">Todavía no entregaste ninguna reparación.</p> : (db.reparacionesFin || []).map(item => (
                      <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-5 flex flex-col md:flex-row justify-between items-center gap-4 hover:border-slate-700 transition">
                        <div>
                          <div className="flex items-center gap-3">
                              <h4 className="font-black text-white text-lg">{item.equipoOriginal.modelo}</h4>
                              <span className="bg-slate-800 text-slate-400 px-2 py-0.5 rounded text-[10px] font-mono">IMEI: {item.equipoOriginal.imei}</span>
                          </div>
                          <p className="text-xs text-slate-400 mt-1">Reparación: <strong className="text-slate-300">{item.equipoOriginal.falla}</strong></p>
                          <p className="text-xs text-slate-500 mt-1">Cliente: {item.equipoOriginal.origen === 'cliente' ? item.equipoOriginal.clienteNombre : item.equipoOriginal.gremio} • Fecha Fin: {item.fecha}</p>
                        </div>
                        <div className="flex items-center gap-4">
                          <div className="text-right">
                            <p className="text-[10px] text-slate-500 font-bold uppercase mb-1">Monto Cobrado</p>
                            <span className="font-mono font-black text-emerald-400 text-2xl">+{formatDinero(convertirParaMostrar(item.montoCobrado, item.monedaCobro))}</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
