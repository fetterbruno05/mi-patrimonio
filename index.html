<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen overflow-hidden text-sm selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, Component, useRef } = React;

    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { hasError: false, errorInfo: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, errorInfo: error.message }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex h-screen items-center justify-center p-4">
              <div className="bg-rose-950 border border-rose-500 p-5 rounded-xl text-center max-w-sm w-full">
                <h1 className="text-white font-bold mb-2">Error Visual</h1>
                <p className="text-rose-300 text-xs mb-4">{this.state.errorInfo}</p>
                <button onClick={() => window.location.reload()} className="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-lg font-bold w-full">Recargar App</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const SUPABASE_URL = "https://nbluvlbsuvmkcaflmjei.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IuVcRy48mLa5P02gRC7B_Q_tI3C6Wuk";
    
    let supaClient = null;
    try {
      if (window.supabase) supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (err) { console.error("Error iniciando Supabase:", err); }

    const DB_TEMPLATE = { 
        cotizacionDolar: 1500, fechaUltimaCotizacion: '',
        activos: [], gastosFijos: [], gastosPuntuales: [], 
        deudas: [], deudasCobrar: [], 
        stock: [], ventas: [], taller: [], reparacionesFin: [],
        historiaConceptos: [], historiaStock: [], historiaGremios: ['iConnecture'], historiaMetodosPago: ['Efectivo', 'Transferencia'],
        actividad: [] 
    };

    const COLORES_GRAFICO = ['bg-rose-500', 'bg-blue-500', 'bg-amber-500', 'bg-emerald-500', 'bg-purple-500', 'bg-cyan-500', 'bg-pink-500', 'bg-indigo-500'];

    const TITULOS_VISTAS = {
      patrimonio: 'Patrimonio Real',
      gastos: 'Gastos y Análisis',
      ventas: 'Ventas de Equipos',
      taller: 'Taller Ingresos',
      reparacionesFin: 'Reparaciones Histórico',
      cobrar: 'Cuentas a Cobrar',
      deudas: 'Deudas a Otros',
      stock: 'Stock Repuestos',
      actividad: 'Auditoría (Logs)'
    };

    function App() {
      const [isLoaded, setIsLoaded] = useState(false);
      const [sesion, setSesion] = useState(false);
      const [passInput, setPassInput] = useState('');
      const [errorLogin, setErrorLogin] = useState('');

      const [db, setDb] = useState(DB_TEMPLATE);
      const [vista, setVista] = useState('patrimonio'); 
      const [menuAbierto, setMenuAbierto] = useState(false);

      const [bloqueoCotizacion, setBloqueoCotizacion] = useState(false);
      const [cotizacionDiariaInput, setCotizacionDiariaInput] = useState('');
      const [monedaVisual, setMonedaVisual] = useState('USD'); 
      const [modoPrivado, setModoPrivado] = useState(false); 

      const [nuevoActivo, setNuevoActivo] = useState({ nombre: '', monto: '', moneda: 'USD', tipo: 'billetera' });
      const [nuevaTransferencia, setNuevaTransferencia] = useState({ origenId: '', destinoId: '', monto: '', moneda: 'ARS' });
      const [nuevoGastoPuntual, setNuevoGastoPuntual] = useState({ concepto: '', monto: '', moneda: 'ARS', walletId: '' });
      const [mostrarInputConceptoLibre, setMostrarInputConceptoLibre] = useState(false);
      const [nuevoGastoFijo, setNuevoGastoFijo] = useState({ concepto: '', monto: '', moneda: 'ARS', tipo: 'fijo', cuotasTotales: '3', diaVencimiento: '1' });
      const [nuevaDeuda, setNuevaDeuda] = useState({ acreedor: '', motivo: '', monto: '', moneda: 'USD' });
      const [nuevaDeudaCobrar, setNuevaDeudaCobrar] = useState({ deudor: '', motivo: '', monto: '', moneda: 'USD', walletId: '' }); 
      const [nuevoStock, setNuevoStock] = useState({ concepto: '', cantidad: '1', monto: '', moneda: 'USD' });
      const [mostrarInputStockLibre, setMostrarInputStockLibre] = useState(false);
      const [nuevaVenta, setNuevaVenta] = useState({ cantidad: '1', comisionPorUnidad: '20000', moneda: 'ARS' });

      const [nuevaReparacion, setNuevaReparacion] = useState({ origen: 'cliente', gremio: '', modelo: '', imei: '', clienteNombre: '', clienteTelefono: '', estadoVisual: '', falla: '', presupuesto: '', presupuestoMoneda: 'ARS' });
      const [mostrarInputGremioLibre, setMostrarInputGremioLibre] = useState(false);
      const [nuevaReparacionFinalizada, setNuevaReparacionFinalizada] = useState({ idEquipoTaller: '', montoCobrado: '', monedaCobro: 'ARS', repuestoId: '' });
      const [panelCobroReparacion, setPanelCobroReparacion] = useState({ idReparacion: null, walletId: '', montoCobro: '', monedaPago: 'ARS', metodoPago: '' });
      const [mostrarInputMetodoLibre, setMostrarInputMetodoLibre] = useState(false);

      const [filtroRep, setFiltroRep] = useState({ cliente: '', telefono: '', modelo: '', imei: '', origen: '', estadoCobro: '', metodoPago: '', desde: '', hasta: '' });

      const [editandoDolar, setEditandoDolar] = useState(false);
      const [dolarInput, setDolarInput] = useState('');
      const [pagoActivo, setPagoActivo] = useState({ idGasto: null, walletId: '' });
      const [pagoDeudaActivo, setPagoDeudaActivo] = useState({ idDeuda: null, walletId: '', montoAbono: '', monedaAbono: 'ARS' });
      const [cobroDeudaActivo, setCobroDeudaActivo] = useState({ idDeuda: null, walletId: '', montoCobro: '', monedaCobro: 'ARS' }); 
      
      const [editandoActivo, setEditandoActivo] = useState(null);
      const [editandoFijo, setEditandoFijo] = useState(null);
      const [editandoDeuda, setEditandoDeuda] = useState(null);
      const [editandoDeudaCobrar, setEditandoDeudaCobrar] = useState(null); 
      const [editandoStock, setEditandoStock] = useState(null);
      const [editandoGastoPuntual, setEditandoGastoPuntual] = useState(null); 
      const [modalRegistroActividad, setModalRegistroActividad] = useState(null);

      const [filtroUsuario, setFiltroUsuario] = useState('');
      const [filtroDesde, setFiltroDesde] = useState('');
      const [filtroHasta, setFiltroHasta] = useState('');
      const [consultaAsistente, setConsultaAsistente] = useState('');
      const [chatAsistente, setChatAsistente] = useState([{ emisor: 'bot', texto: '¡Hola! Soy tu asistente de auditoría. Preguntame por ej: "qué gastos agregué ayer", o "movimientos de stock".' }]);
      const chatEndRef = useRef(null);

      const generarLog = (accion, detalle, datosExtra = null) => ({ id: Date.now() + Math.floor(Math.random() * 1000), fecha: new Date().toISOString(), usuario: 'Bruno', accion, detalle, datosExtra });

      const opcionesConcepto = useMemo(() => [...new Set(db.historiaConceptos || [])], [db.historiaConceptos]);
      const opcionesStock = useMemo(() => [...new Set(db.historiaStock || [])], [db.historiaStock]);
      const opcionesGremios = useMemo(() => [...new Set(db.historiaGremios || ['iConnecture'])], [db.historiaGremios]);
      const billeterasDisponibles = useMemo(() => (db.activos || []).filter(a => a.tipo !== 'activo'), [db.activos]);

      useEffect(() => {
        async function fetchNube() {
          if (!supaClient) { setIsLoaded(true); return; }
          try {
            const { data, error } = await supaClient.from('iconnecture_data').select('payload').eq('id', 1).single();
            if (error) throw error;
            if (data && data.payload) {
              const baseCargada = {
                cotizacionDolar: data.payload.cotizacionDolar || 1500,
                fechaUltimaCotizacion: data.payload.fechaUltimaCotizacion || '',
                activos: Array.isArray(data.payload.activos) ? data.payload.activos.filter(Boolean) : [],
                gastosFijos: Array.isArray(data.payload.gastosFijos) ? data.payload.gastosFijos.filter(Boolean) : [],
                gastosPuntuales: Array.isArray(data.payload.gastosPuntuales) ? data.payload.gastosPuntuales.filter(Boolean) : [],
                deudas: Array.isArray(data.payload.deudas) ? data.payload.deudas.filter(Boolean) : [],
                deudasCobrar: Array.isArray(data.payload.deudasCobrar) ? data.payload.deudasCobrar.filter(Boolean).map(d => {
                    if(d.moneda !== 'USD'){ return { ...d, monto: (parseFloat(d.monto) / (data.payload.cotizacionDolar || 1500)).toFixed(4), moneda: 'USD' }; }
                    return d;
                }) : [],
                stock: Array.isArray(data.payload.stock) ? data.payload.stock.filter(Boolean) : [],
                ventas: Array.isArray(data.payload.ventas) ? data.payload.ventas.filter(Boolean) : [],
                taller: Array.isArray(data.payload.taller) ? data.payload.taller.filter(Boolean) : [],
                reparacionesFin: Array.isArray(data.payload.reparacionesFin) ? data.payload.reparacionesFin.filter(Boolean) : [], 
                historiaConceptos: Array.isArray(data.payload.historiaConceptos) ? data.payload.historiaConceptos : [],
                historiaStock: Array.isArray(data.payload.historiaStock) ? data.payload.historiaStock : [],
                historiaGremios: Array.isArray(data.payload.historiaGremios) ? data.payload.historiaGremios : ['iConnecture'],
                historiaMetodosPago: Array.isArray(data.payload.historiaMetodosPago) ? data.payload.historiaMetodosPago : ['Efectivo', 'Transferencia'],
                actividad: Array.isArray(data.payload.actividad) ? data.payload.actividad.filter(Boolean) : []
              };
              setDb(baseCargada);
              const hoyStr = new Date().toLocaleDateString();
              if (baseCargada.fechaUltimaCotizacion !== hoyStr) {
                  setCotizacionDiariaInput(baseCargada.cotizacionDolar);
                  setBloqueoCotizacion(true);
              }
            }
          } catch (err) { console.error("Iniciando de cero."); }
          setIsLoaded(true);
        }
        fetchNube();
      }, []);

      const guardarEnNube = async (nuevoEstadoDb) => {
        setDb(nuevoEstadoDb);
        if (supaClient) {
          const { error } = await supaClient.from('iconnecture_data').update({ payload: nuevoEstadoDb }).eq('id', 1);
          if (error) alert("Atención: No se pudo guardar en la nube. Revisá tu conexión.");
        }
      };

      const login = (e) => {
        e.preventDefault();
        if (passInput === 'bruno123') { setSesion(true); setErrorLogin(''); }
        else { setErrorLogin('Clave incorrecta'); setPassInput(''); }
      };

      const procesarBloqueoCotizacion = (e) => {
          e.preventDefault();
          const val = parseFloat(cotizacionDiariaInput) || 1500;
          const hoyStr = new Date().toLocaleDateString();
          const log = generarLog('Actualizó Cotización Diaria', `Confirmó cotización a $${val}`);
          guardarEnNube({...db, cotizacionDolar: val, fechaUltimaCotizacion: hoyStr, actividad: [log, ...(db.actividad || [])].slice(0, 500)});
          setBloqueoCotizacion(false);
      };

      const redondear = (num) => Math.round((num + Number.EPSILON) * 100) / 100;
      const aUSDBase = (monto, moneda, coti) => moneda === 'USD' ? (parseFloat(monto) || 0) : ((parseFloat(monto) || 0) / coti);
      
      const convertirParaMostrar = (montoBase, monedaBase, forzarMonedaVisual = null) => {
          const val = parseFloat(montoBase) || 0;
          const monedaObjetivo = forzarMonedaVisual || monedaVisual;
          if (monedaObjetivo === 'USD') return monedaBase === 'USD' ? redondear(val) : redondear(val / db.cotizacionDolar);
          else return monedaBase === 'ARS' ? Math.round(val) : Math.round(val * db.cotizacionDolar);
      };

      const formatDinero = (monto, overrideMoneda = null) => {
          if (modoPrivado) return `**** ${overrideMoneda || monedaVisual}`;
          const val = parseFloat(monto || 0);
          const monedaFinal = overrideMoneda || monedaVisual;
          if (monedaFinal === 'USD') return `U$D ${val.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD`;
          else return `$ ${Math.round(val).toLocaleString('es-AR')} ARS`;
      };

      const calcularDiasPasados = (timestamp) => {
          if (!timestamp || isNaN(timestamp)) return 0;
          return Math.floor((Date.now() - timestamp) / (1000 * 60 * 60 * 24)); 
      };

      const limpiarHistoriaConceptos = () => {
        if(window.confirm("¿Estás seguro de vaciar el historial de nombres de gastos?")) {
          const log = generarLog('Limpió Historial', 'Vació la memoria de conceptos de gastos.');
          guardarEnNube({...db, historiaConceptos: [], actividad: [log, ...(db.actividad || [])].slice(0, 500)});
        }
      };

      const limpiarHistoriaStock = () => {
        if(window.confirm("¿Estás seguro de vaciar el historial de nombres de repuestos?")) {
          const log = generarLog('Limpió Historial', 'Vació la memoria de conceptos de stock.');
          guardarEnNube({...db, historiaStock: [], actividad: [log, ...(db.actividad || [])].slice(0, 500)});
        }
      };

      useEffect(() => { if(chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: 'smooth' }); }, [chatAsistente, vista]);

      const procesarConsultaAsistente = (e) => {
        e.preventDefault();
        const textoUser = consultaAsistente.trim();
        if(!textoUser) return;
        setChatAsistente(prev => [...prev, { emisor: 'user', texto: textoUser }]);
        setConsultaAsistente('');

        const lower = textoUser.toLowerCase();
        let logsMatch = [...(db.actividad || [])];
        const hoy = new Date();
        const ayer = new Date(); ayer.setDate(hoy.getDate() - 1);

        if (lower.includes('hoy')) logsMatch = logsMatch.filter(l => new Date(l.fecha).toLocaleDateString() === hoy.toLocaleDateString());
        else if (lower.includes('ayer')) logsMatch = logsMatch.filter(l => new Date(l.fecha).toLocaleDateString() === ayer.toLocaleDateString());

        if (lower.includes('gasto') || lower.includes('gastos')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('gasto'));
        else if (lower.includes('deuda') || lower.includes('deudas')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('deuda'));
        else if (lower.includes('stock') || lower.includes('repuesto')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('stock') || l.accion.toLowerCase().includes('repuesto'));
        else if (lower.includes('activo') || lower.includes('billetera') || lower.includes('transferencia')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('billetera') || l.accion.toLowerCase().includes('activo') || l.accion.toLowerCase().includes('movimiento'));
        else if (lower.includes('venta') || lower.includes('comision')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('venta') || l.accion.toLowerCase().includes('comisi'));
        else if (lower.includes('taller') || lower.includes('reparacion')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('taller') || l.accion.toLowerCase().includes('equipo'));

        if (lower.includes('bruno')) logsMatch = logsMatch.filter(l => l.usuario.toLowerCase() === 'bruno');

        setTimeout(() => {
            let respuesta = '';
            if (logsMatch.length === 0) respuesta = "Revisé los registros y no encontré ningún movimiento que coincida con lo que me pedís.";
            else {
                let limite = 5;
                const ultimos = logsMatch.slice(0, limite);
                respuesta = `Encontré ${logsMatch.length} movimientos relacionados a eso. Acá tenés los más recientes:\n\n` + ultimos.map(l => `• ${l.detalle}`).join('\n\n');
                if(logsMatch.length > limite) respuesta += `\n\n*(Y ${logsMatch.length - limite} movimientos más que podés ver abajo en la tabla)*`;
            }
            setChatAsistente(prev => [...prev, { emisor: 'bot', texto: respuesta }]);
        }, 500); 
      };

      const procesarDescuentoSeguro = (walletId, montoGasto, monedaGasto, activosActuales) => {
        const activosClon = [...activosActuales];
        const idx = activosClon.findIndex(w => w.id === parseInt(walletId));
        if (idx === -1) return { success: false, msg: 'Billetera no encontrada' };
        
        const wallet = activosClon[idx];
        let montoARestar = parseFloat(montoGasto);
        if (monedaGasto === 'ARS' && wallet.moneda === 'USD') montoARestar = montoARestar / db.cotizacionDolar;
        if (monedaGasto === 'USD' && wallet.moneda === 'ARS') montoARestar = montoARestar * db.cotizacionDolar;
        
        if (parseFloat(wallet.monto) < redondear(montoARestar)) return { success: false, msg: `Saldo insuficiente.` };
        activosClon[idx].monto = (parseFloat(wallet.monto) - montoARestar).toFixed(2);
        return { success: true, activosActualizados: activosClon };
      };

      const procesarReembolsoWallet = (walletId, montoAReembolsar, monedaReembolso, activosActuales) => {
        const activosClon = [...activosActuales];
        const idx = activosClon.findIndex(w => w.id === parseInt(walletId));
        if (idx === -1) return activosClon; 
        
        const wallet = activosClon[idx];
        let montoASumar = parseFloat(montoAReembolsar);
        if (monedaReembolso === 'ARS' && wallet.moneda === 'USD') montoASumar = montoASumar / db.cotizacionDolar;
        if (monedaReembolso === 'USD' && wallet.moneda === 'ARS') montoASumar = montoASumar * db.cotizacionDolar;
        
        activosClon[idx].monto = (parseFloat(wallet.monto) + montoASumar).toFixed(2);
        return activosClon;
      };

      const agregarActivo = (e) => {
        e.preventDefault();
        const item = { id: Date.now(), nombre: nuevoActivo.nombre.trim(), monto: parseFloat(nuevoActivo.monto) || 0, moneda: nuevoActivo.moneda, tipo: nuevoActivo.tipo };
        const log = generarLog('Creó Billetera/Activo', `Creó ${item.tipo}: "${item.nombre}" con saldo inicial de ${item.monto} ${item.moneda}`, item);
        guardarEnNube({ ...db, activos: [item, ...db.activos], actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevoActivo({ nombre: '', monto: '', moneda: 'USD', tipo: 'billetera' });
      };

      const procesarTransferenciaInterna = (e) => {
          e.preventDefault();
          if (nuevaTransferencia.origenId === nuevaTransferencia.destinoId) return alert('La billetera origen debe ser distinta al destino.');
          const mTransferir = parseFloat(nuevaTransferencia.monto);
          if (mTransferir <= 0) return alert('Monto inválido.');
          const op = procesarDescuentoSeguro(nuevaTransferencia.origenId, mTransferir, nuevaTransferencia.moneda, db.activos);
          if (!op.success) return alert(op.msg);
          const activosPost = procesarReembolsoWallet(nuevaTransferencia.destinoId, mTransferir, nuevaTransferencia.moneda, op.activosActualizados);
          const nOrigen = db.activos.find(a => a.id === parseInt(nuevaTransferencia.origenId))?.nombre;
          const nDestino = db.activos.find(a => a.id === parseInt(nuevaTransferencia.destinoId))?.nombre;
          const log = generarLog('Movimiento Interno', `Transfirió ${mTransferir} ${nuevaTransferencia.moneda} de "${nOrigen}" hacia "${nDestino}".`);
          guardarEnNube({ ...db, activos: activosPost, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
          setNuevaTransferencia({ origenId: '', destinoId: '', monto: '', moneda: 'ARS' });
      };

      const agregarGastoPuntual = (e) => {
        e.preventDefault();
        if (!nuevoGastoPuntual.walletId || !nuevoGastoPuntual.concepto) return alert('Completá los datos.');
        const op = procesarDescuentoSeguro(nuevoGastoPuntual.walletId, nuevoGastoPuntual.monto, nuevoGastoPuntual.moneda, db.activos);
        if (!op.success) return alert(op.msg); 
        const walletUsada = db.activos.find(w => w.id === parseInt(nuevoGastoPuntual.walletId));
        const conceptoTrim = nuevoGastoPuntual.concepto.trim();
        const item = { id: Date.now(), concepto: conceptoTrim, monto: parseFloat(nuevoGastoPuntual.monto) || 0, moneda: nuevoGastoPuntual.moneda, fecha: new Date().toLocaleDateString(), pagadoCon: walletUsada?.nombre || 'Desconocido', walletIdOriginal: walletUsada?.id };
        const nuevasCats = [...new Set([conceptoTrim, ...(db.historiaConceptos || [])])];
        const log = generarLog('Creó Gasto Suelto', `Registró gasto en "${item.concepto}" por ${item.monto} ${item.moneda}. Pagado con ${item.pagadoCon}.`, item);
        guardarEnNube({ ...db, activos: op.activosActualizados, gastosPuntuales: [item, ...(db.gastosPuntuales || [])], historiaConceptos: nuevasCats, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevoGastoPuntual({ concepto: '', monto: '', moneda: 'ARS', walletId: nuevoGastoPuntual.walletId });
        setMostrarInputConceptoLibre(false);
      };

      const eliminarGastoPuntual = (itemGasto) => {
        if(window.confirm(`¿Eliminar gasto de ${itemGasto.concepto}? El dinero será reembolsado a ${itemGasto.pagadoCon}.`)){
            const activosReembolsados = procesarReembolsoWallet(itemGasto.walletIdOriginal, itemGasto.monto, itemGasto.moneda, db.activos);
            const log = generarLog('Eliminó Gasto Suelto', `Eliminó gasto de "${itemGasto.concepto}" por ${itemGasto.monto} ${itemGasto.moneda}. Dinero reembolsado a ${itemGasto.pagadoCon}.`, itemGasto);

          const adeud = item.montoAdeudadoRestante !== undefined ? parseFloat(item.montoAdeudadoRestante) : parseFloat(item.montoCobrado);
          const nvoRestante = adeud - aUSD;
          if (redondear(nvoRestante) < -0.05) return alert('Cobrando de más.');
          
          const costoU = parseFloat(item.costoRepuestoUSD) || 0;
          const totU = parseFloat(item.montoCobrado);
          const ganNeta = Math.max(0, totU - costoU);
          const prop = totU > 0 ? ((costoU + (ganNeta/2)) / totU) : 0;
          const miParteAbonoUSD = aUSD * prop;

          let dCobrar = [...(db.deudasCobrar || [])];
          const deud = "Local / Negocio (Taller)"; const mot = "Comisiones de Reparación 50%";
          const idx = dCobrar.findIndex(d => d.deudor === deud && d.motivo === mot);
          if (idx !== -1) dCobrar[idx].monto = (parseFloat(dCobrar[idx].monto) + miParteAbonoUSD).toFixed(4);
          else dCobrar.unshift({ id: Date.now()+1, fechaTimestamp: Date.now(), deudor: deud, motivo: mot, monto: miParteAbonoUSD.toFixed(4), moneda: 'USD', fecha: new Date().toLocaleDateString() });

          const estadoF = redondear(nvoRestante) <= 0 ? 'cobrado' : 'pendiente';
          const repsF = (db.reparacionesFin || []).map(r => {
              if (r.id === item.id) {
                  let m = r.metodosPago || [];
                  const nMet = panelCobroReparacion.metodoPago.trim();
                  if (nMet && !m.includes(nMet)) m = [...m, nMet];
                  return { ...r, montoAdeudadoRestante: nvoRestante, estadoCobro: estadoF, metodosPago: m };
              }
              return r;
          });
          let hMet = db.historiaMetodosPago || ['Efectivo', 'Transferencia'];
          const mt = panelCobroReparacion.metodoPago.trim();
          if (mt) hMet = [...new Set([mt, ...hMet])];

          const log = generarLog('Cobró Rep. Local', `[${item.equipoOriginal.modelo}]: Se anotó el 50% de ${mFisico} ${panelCobroReparacion.monedaPago} vía ${mt} a tu favor.`);
          guardarEnNube({ ...db, deudasCobrar: dCobrar, reparacionesFin: repsF, historiaMetodosPago: hMet, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
          setPanelCobroReparacion({ idReparacion: null, metodoPago: '', montoCobro: '', monedaPago: 'ARS' });
          setMostrarInputMetodoLibre(false);
      };

      const eliminarReparacionHistorial = (itemRep) => {
          if (window.confirm("¿Seguro querés eliminar este registro histórico?")) {
              const log = generarLog('Eliminó Historial de Reparación', `Borró el historial del ${itemRep.equipoOriginal.modelo}.`);
              guardarEnNube({ ...db, reparacionesFin: db.reparacionesFin.filter(v => v.id !== itemRep.id), actividad: [log, ...(db.actividad || [])].slice(0, 500) });
          }
      };

      const reparacionesFiltradas = useMemo(() => {
          return (db.reparacionesFin || []).filter(item => {
              let ok = true; const eq = item.equipoOriginal;
              if (filtroRep.imei && !eq.imei.includes(filtroRep.imei)) ok = false;
              if (filtroRep.modelo && !eq.modelo.toLowerCase().includes(filtroRep.modelo.toLowerCase())) ok = false;
              if (filtroRep.cliente) {
                  const nStr = eq.origen === 'cliente' ? eq.clienteNombre : eq.gremio;
                  if (!nStr.toLowerCase().includes(filtroRep.cliente.toLowerCase())) ok = false;
              }
              if (filtroRep.telefono && eq.origen === 'cliente' && !eq.clienteTelefono.includes(filtroRep.telefono)) ok = false;
              if (filtroRep.origen && eq.origen !== filtroRep.origen) ok = false;
              if (filtroRep.estadoCobro && item.estadoCobro !== filtroRep.estadoCobro) ok = false;
              if (filtroRep.metodoPago && (!item.metodosPago || !item.metodosPago.includes(filtroRep.metodoPago))) ok = false;
              if (filtroRep.desde && item.fechaTimestamp < new Date(filtroRep.desde + 'T00:00:00').getTime()) ok = false;
              if (filtroRep.hasta && item.fechaTimestamp > new Date(filtroRep.hasta + 'T23:59:59').getTime()) ok = false;
              return ok;
          });
      }, [db.reparacionesFin, filtroRep]);

      // CÁLCULOS GLOBALES
      const tBillUSD = (db.activos || []).filter(a => a.tipo === 'billetera' || !a.tipo).reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      const tActFisUSD = (db.activos || []).filter(a => a.tipo === 'activo').reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      const tStkUSD = (db.stock || []).reduce((acc, item) => acc + ((item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar) * parseInt(item.cantidad)), 0);
      const tDeudPenUSD = (db.deudas || []).reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      const tDeudCobUSD = (db.deudasCobrar || []).reduce((acc, item) => acc + parseFloat(item.monto), 0); 
      
      const tGastFijUSD = (db.gastosFijos || []).reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      const tGastPuntUSD = (db.gastosPuntuales || []).reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      
      const now = new Date();
      const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
      const dayOfWeek = now.getDay() || 7;
      const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek + 1).getTime();

      let tVtasHistUSD = 0; let tVtasMesUSD = 0; let tVtasSemUSD = 0; let tEqVend = 0;
      (db.ventas || []).forEach(item => {
          const usd = item.moneda === 'USD' ? parseFloat(item.totalComision) : parseFloat(item.totalComision) / db.cotizacionDolar;
          tVtasHistUSD += usd; tEqVend += parseInt(item.cantidad);
          let ts = item.fechaTimestamp;
          if (!ts && item.fecha) { const p = item.fecha.split('/'); if(p.length===3) ts = new Date(p[2], p[1]-1, p[0]).getTime(); }
          if (ts >= startOfMonth) tVtasMesUSD += usd;
          if (ts >= startOfWeek) tVtasSemUSD += usd;
      });
      
      const tGanNetRepUSD = (db.reparacionesFin || []).reduce((acc, item) => {
          const adeudado = item.montoAdeudadoRestante !== undefined ? parseFloat(item.montoAdeudadoRestante) : 0;
          const cobradoTotalUSD = parseFloat(item.montoCobrado) - adeudado; 
          const costoRepUSD = parseFloat(item.costoRepuestoUSD) || 0;
          if (item.equipoOriginal.origen === 'gremio') return acc + (cobradoTotalUSD > 0 ? cobradoTotalUSD - costoRepUSD : 0);
          else {
              const ganNetaUSD = Math.max(0, parseFloat(item.montoCobrado) - costoRepUSD);
              const miParteTotUSD = costoRepUSD + (ganNetaUSD / 2);
              const prop = parseFloat(item.montoCobrado) > 0 ? (miParteTotUSD / parseFloat(item.montoCobrado)) : 0;
              const miParteReal = cobradoTotalUSD * prop;
              return acc + (miParteReal > 0 ? miParteReal : 0);
          }
      }, 0);

      const tCobPendTallUSD = (db.reparacionesFin || []).reduce((acc, item) => item.estadoCobro === 'pendiente' ? acc + (parseFloat(item.montoAdeudadoRestante) || 0) : acc, 0);
      const patrimonioNetoRealUSD = tBillUSD + tActFisUSD + tStkUSD + tDeudCobUSD + tCobPendTallUSD - tDeudPenUSD;

      const gastosPorCat = useMemo(() => {
        const sumas = {};
        (db.gastosPuntuales || []).forEach(g => {
            const val = convertirParaMostrar(g.monto, g.moneda);
            const cat = g.concepto || 'Otros';
            sumas[cat] = (sumas[cat] || 0) + val;
        });
        const total = Object.values(sumas).reduce((a,b) => a+b, 0);
        return Object.entries(sumas).map(([cat, val]) => ({ categoria: cat, montoGrafico: val, porcentaje: total ? (val/total)*100 : 0 })).sort((a,b) => b.montoGrafico - a.montoGrafico);
      }, [db.gastosPuntuales, db.cotizacionDolar, monedaVisual]);

      const logsFiltrados = (db.actividad || []).filter(l => {
          if (filtroUsuario && !l.usuario.toLowerCase().includes(filtroUsuario.toLowerCase())) return false;
          if (filtroDesde && new Date(l.fecha) < new Date(filtroDesde + 'T00:00:00')) return false;
          if (filtroHasta && new Date(l.fecha) > new Date(filtroHasta + 'T23:59:59')) return false;
          return true;
      });

      // ==========================================
      // UI RENDER 
      // ==========================================
      if (!isLoaded) return <div className="flex h-screen items-center justify-center font-bold text-blue-400 animate-pulse text-lg">Conectando a tu Nube...</div>;
      
      if (!sesion) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 p-4 w-full">
            <form onSubmit={login} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-xs w-full space-y-5 shadow-2xl fade-in">
              <div className="text-center space-y-1.5">
                <i className="fa-solid fa-fingerprint text-4xl text-blue-500 mb-2"></i>
                <h1 className="text-2xl font-black text-white">Patrimonio</h1>
                <p className="text-slate-400 text-xs font-bold tracking-widest uppercase">Acceso Privado</p>
              </div>
              <input type="password" required placeholder="Tu clave..." value={passInput} onChange={e => {setPassInput(e.target.value); setErrorLogin('');}} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-center text-xl font-mono text-white tracking-widest focus:outline-none focus:border-blue-500" />
              {errorLogin && <p className="text-rose-400 text-xs font-bold text-center mt-2">{errorLogin}</p>}
              <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition text-sm">Desbloquear</button>
            </form>
          </div>

      if (bloqueoCotizacion) {
          return (

              <form onSubmit={procesarBloqueoCotizacion} className="bg-slate-900 border border-indigo-500/50 rounded-2xl p-6 max-w-xs w-full space-y-5 shadow-2xl fade-in text-center">
                <div className="space-y-1.5">
                  <i className="fa-solid fa-calendar-day text-4xl text-emerald-400 mb-1"></i>

                  <p className="text-slate-400 text-xs">Verificá o actualizá la cotización de hoy.</p>
                </div>
                <div>
                  <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1.5">Cotización Dólar ARS de Hoy</label>
                  <input type="number" step="any" required autoFocus value={cotizacionDiariaInput} onChange={e => setCotizacionDiariaInput(e.target.value)} className="w-full bg-slate-950 border border-emerald-500 rounded-xl px-4 py-3 text-center text-2xl font-black text-emerald-400 focus:outline-none focus:border-emerald-400" />
                </div>
                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition text-sm">Confirmar y Entrar</button>
              </form>
            </div>
          );
      }

      return (
        <div className="flex h-screen bg-slate-950 text-slate-100 overflow-hidden font-sans text-sm w-full">
          
          {menuAbierto && <div className="md:hidden fixed inset-0 bg-slate-950/80 z-40 backdrop-blur-xs" onClick={() => setMenuAbierto(false)}></div>}

          {/* BARRA LATERAL COMPACTA Y AUTO-AJUSTABLE */}
          <aside className={`fixed md:static inset-y-0 left-0 z-50 w-56 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 transform transition-transform duration-200 ease-in-out ${menuAbierto ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0`}>
            <div className="p-4 border-b border-slate-800 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white text-sm shadow-md"><i className="fa-solid fa-bolt"></i></div>
                <div>
                  <h1 className="font-black text-sm text-white leading-tight">Bruno</h1>
                  <p className="text-[9px] text-blue-400 font-bold uppercase tracking-widest">Nube Activa</p>
                </div>
              </div>
              <button onClick={() => setMenuAbierto(false)} className="md:hidden text-slate-400 hover:text-white text-xl px-1"><i className="fa-solid fa-xmark"></i></button>
            </div>
            
            <nav className="flex-1 p-3 space-y-1 overflow-y-auto hide-scrollbar">
              <button onClick={() => {setVista('patrimonio'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'patrimonio' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-scale-balanced w-4 text-center"></i> Patrimonio Real</button>
              <button onClick={() => {setVista('gastos'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'gastos' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-chart-pie w-4 text-center"></i> Gastos y Análisis</button>
              
              <div className="pt-2 mt-2 border-t border-slate-800/60 space-y-1">
                <button onClick={() => {setVista('ventas'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'ventas' ? 'bg-emerald-500 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-cash-register w-4 text-center"></i> Ventas de Equipos</button>
                <button onClick={() => {setVista('taller'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'taller' ? 'bg-cyan-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-microchip w-4 text-center"></i> Taller Ingresos</button>
                <button onClick={() => {setVista('reparacionesFin'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'reparacionesFin' ? 'bg-cyan-700 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-clipboard-check w-4 text-center"></i> Reparaciones Histórico</button>
              </div>

              <div className="pt-2 mt-2 border-t border-slate-800/60 space-y-1">
                <button onClick={() => {setVista('cobrar'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'cobrar' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-hand-holding-dollar w-4 text-center"></i> Cuentas a Cobrar</button>
                <button onClick={() => {setVista('deudas'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'deudas' ? 'bg-rose-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-handshake w-4 text-center"></i> Deudas a Otros</button>

                <button onClick={() => {setVista('stock'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'stock' ? 'bg-amber-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-boxes-stacked w-4 text-center"></i> Stock Repuestos</button>
                <button onClick={() => {setVista('actividad'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all border border-indigo-500/30 ${vista === 'actividad' ? 'bg-slate-800 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-shield-halved w-4 text-center text-indigo-400"></i> Auditoría (Logs)</button>

                <p className="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-0.5">Cotización Dólar</p>
                {!editandoDolar ? (
                  <div className="flex items-center justify-center gap-2">
                    <span className="text-base font-black text-emerald-400">${db.cotizacionDolar}</span>
                    <button onClick={() => { setDolarInput(db.cotizacionDolar); setEditandoDolar(true); }} className="text-slate-500 hover:text-white"><i className="fa-solid fa-pen text-[10px]"></i></button>

                    <button onClick={() => {

                      guardarEnNube({...db, cotizacionDolar: val, actividad: [log, ...(db.actividad || [])].slice(0, 500)});

          </aside>

          {/* CONTENEDOR PRINCIPAL */}
          <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            {/* BARRA SUPERIOR INTEGRADA (Móvil y Escritorio) */}
            <header className="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-2.5 flex justify-between items-center z-30 shrink-0">
               <div className="flex items-center gap-3 min-w-0">
                 <button onClick={() => setMenuAbierto(true)} className="md:hidden text-slate-300 hover:text-white text-lg focus:outline-none p-1">
                   <i className="fa-solid fa-bars"></i>

               <div className="flex items-center gap-2 shrink-0">
                 <button onClick={() => setModoPrivado(!modoPrivado)} className={`flex items-center justify-center w-8 h-8 rounded-full transition-all text-xs ${modoPrivado ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-white border border-slate-700'}`} title="Ocultar Números">
                     <i className={`fa-solid ${modoPrivado ? 'fa-eye-slash' : 'fa-eye'}`}></i>

              {/* VISTA 1: PATRIMONIO */}

                      <p className="text-slate-500 text-[9px] uppercase font-bold mt-1">Billeteras / Cash</p>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
                      <p className="text-[10px] font-bold text-amber-500 uppercase tracking-wider mb-1"><i className="fa-solid fa-boxes-stacked mr-1.5"></i>En Stock</p>

                      <h2 className="text-lg sm:text-xl font-black text-slate-300 truncate">{formatDinero(convertirParaMostrar(tActFisUSD, 'USD'))}</h2>

                    <div className="flex gap-2">
                      <input type="number" step="any" required value={editandoDeuda.monto} onChange={e => setEditandoDeuda({...editandoDeuda, monto: e.target.value})} className="flex-1 min-w-0 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono" />
                      <select value={editandoDeuda.moneda} onChange={e => setEditandoDeuda({...editandoDeuda, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-2.5 text-white font-bold"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                    </div>
                  </div>
                </div>
                <div className="flex gap-2 pt-1">
                  <button type="submit" className="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-2.5 rounded-xl transition text-xs">Guardar</button>
                  <button type="button" onClick={() => setEditandoDeuda(null)} className="bg-slate-800 text-white font-bold px-4 py-2.5 rounded-xl transition text-xs">Cancelar</button>
                </div>
              </form>
            </div>
          )}

          {editandoDeudaCobrar && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-xs flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => {
                e.preventDefault();
                const actualizadas = db.deudasCobrar.map(d => d.id === editandoDeudaCobrar.id ? { ...d, deudor: editandoDeudaCobrar.deudor, motivo: editandoDeudaCobrar.motivo, monto: parseFloat(editandoDeudaCobrar.monto) || 0, moneda: editandoDeudaCobrar.moneda } : d);
                const log = generarLog('Editó Cuenta por Cobrar', `Editó deuda de "${editandoDeudaCobrar.deudor}". Nuevo monto: ${editandoDeudaCobrar.monto} ${editandoDeudaCobrar.moneda}`, editandoDeudaCobrar);
                guardarEnNube({ ...db, deudasCobrar: actualizadas, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
                setEditandoDeudaCobrar(null);
              }} className="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-xs w-full space-y-4 shadow-2xl">
                <h3 className="font-black text-white text-base border-b border-slate-800 pb-2.5">Editar Cuenta a Cobrar</h3>
                <div className="space-y-3 text-xs">
                  <div><label className="text-slate-400 font-bold mb-1 block">Deudor</label><input type="text" required value={editandoDeudaCobrar.deudor} onChange={e => setEditandoDeudaCobrar({...editandoDeudaCobrar, deudor: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white" /></div>
                  <div><label className="text-slate-400 font-bold mb-1 block">Motivo</label><input type="text" required value={editandoDeudaCobrar.motivo} onChange={e => setEditandoDeudaCobrar({...editandoDeudaCobrar, motivo: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white" /></div>
                  <div>
                    <label className="text-slate-400 font-bold mb-1 block">Monto a Cobrar (En USD Base)</label>
                    <div className="flex gap-2">
                      <input type="number" step="any" required value={editandoDeudaCobrar.monto} onChange={e => setEditandoDeudaCobrar({...editandoDeudaCobrar, monto: e.target.value})} className="flex-1 min-w-0 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono" />
                      <select value={editandoDeudaCobrar.moneda} onChange={e => setEditandoDeudaCobrar({...editandoDeudaCobrar, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-2.5 text-white font-bold"><option value="USD">USD</option><option value="ARS">ARS</option></select>
                    </div>
                  </div>
                </div>
                <div className="flex gap-2 pt-1">
                  <button type="submit" className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition text-xs">Guardar</button>
                  <button type="button" onClick={() => setEditandoDeudaCobrar(null)} className="bg-slate-800 text-white font-bold px-4 py-2.5 rounded-xl transition text-xs">Cancelar</button>
                </div>
              </form>
            </div>
          )}

          {editandoStock && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-xs flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => {
                e.preventDefault();
                const actualizado = db.stock.map(s => s.id === editandoStock.id ? { ...s, concepto: editandoStock.concepto, monto: parseFloat(editandoStock.monto) || 0, moneda: editandoStock.moneda } : s);
                const log = generarLog('Editó Repuesto de Stock', `Modificó "${editandoStock.concepto}". Precio: ${editandoStock.monto} ${editandoStock.moneda}`, editandoStock);
                guardarEnNube({ ...db, stock: actualizado, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
                setEditandoStock(null);
              }} className="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-xs w-full space-y-4 shadow-2xl">
                <h3 className="font-black text-white text-base border-b border-slate-800 pb-2.5">Editar Repuesto</h3>
                <div className="space-y-3 text-xs">
                  <div><label className="text-slate-400 font-bold mb-1 block">Concepto</label><input type="text" required value={editandoStock.concepto} onChange={e => setEditandoStock({...editandoStock, concepto: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white" /></div>
                  <div>
                    <label className="text-slate-400 font-bold mb-1 block">Costo Unitario</label>
                    <div className="flex gap-2">
                      <input type="number" step="any" required value={editandoStock.monto} onChange={e => setEditandoStock({...editandoStock, monto: e.target.value})} className="flex-1 min-w-0 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono" />
                      <select value={editandoStock.moneda} onChange={e => setEditandoStock({...editandoStock, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-2.5 text-white font-bold"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                    </div>
                  </div>
                </div>
                <div className="flex gap-2 pt-1">
                  <button type="submit" className="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 rounded-xl transition text-xs">Guardar</button>
                  <button type="button" onClick={() => setEditandoStock(null)} className="bg-slate-800 text-white font-bold px-4 py-2.5 rounded-xl transition text-xs">Cancelar</button>
                </div>
              </form>
            </div>
          )}

          {editandoGastoPuntual && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-xs flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={procesarEdicionGastoPuntual} className="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-xs w-full space-y-4 shadow-2xl">
                <h3 className="font-black text-white text-base border-b border-slate-800 pb-2.5">Editar Gasto</h3>
                <div className="space-y-3 text-xs">
                  <div><label className="text-slate-400 font-bold mb-1 block">Concepto</label><input type="text" required value={editandoGastoPuntual.concepto} onChange={e => setEditandoGastoPuntual({...editandoGastoPuntual, concepto: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white" /></div>
                  <div>
                    <label className="text-slate-400 font-bold mb-1 block">Monto Correcto</label>
                    <div className="flex gap-2">
                      <input type="number" step="any" required value={editandoGastoPuntual.monto} onChange={e => setEditandoGastoPuntual({...editandoGastoPuntual, monto: e.target.value})} className="flex-1 min-w-0 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono" />
                      <select value={editandoGastoPuntual.moneda} onChange={e => setEditandoGastoPuntual({...editandoGastoPuntual, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-2.5 text-white font-bold"><option value="USD">USD</option><option value="ARS">ARS</option></select>
                    </div>
                  </div>
                  <div>
                    <label className="text-slate-400 font-bold mb-1 block">Billetera de donde salió</label>
                    <select required value={editandoGastoPuntual.walletIdOriginal} onChange={e => setEditandoGastoPuntual({...editandoGastoPuntual, walletIdOriginal: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold">
                      <option value="">Seleccionar billetera...</option>
                      {billeterasDisponibles.map(a => <option key={a.id} value={a.id}>{a.nombre} (Disp: {a.monto})</option>)}
                    </select>
                  </div>
                </div>
                <div className="flex gap-2 pt-1">
                  <button type="submit" className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl transition text-xs">Actualizar</button>
                  <button type="button" onClick={() => setEditandoGastoPuntual(null)} className="bg-slate-800 text-white font-bold px-4 py-2.5 rounded-xl transition text-xs">Cancelar</button>
                </div>
              </form>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
