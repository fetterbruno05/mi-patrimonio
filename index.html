          if (!timestamp || isNaN(timestamp)) return 0;

      };

      const esTextoBateria = (texto) => {
          if (!texto) return false;
          const t = texto.toLowerCase();
          return t.includes('bateria') || t.includes('batería') || t.includes('bat ');
      };

      const limpiarHistoriaConceptos = () => {
        if(window.confirm("¿Estás seguro de vaciar el historial de nombres de gastos?")) {
          const log = generarLog('Limpió Historial', 'Vació la memoria de conceptos de gastos.');
          guardarEnNube({...db, historiaConceptos: [], actividad: [log, ...(db.actividad || [])].slice(0, 500)});
        }
      };

      const limpiarHistoriaStock = () => {
        if(window.confirm("¿Estás seguro de vaciar el historial de nombres de repuestos?")) {
          const log = generarLog('Limpió Historial', 'Vació la memoria de conceptos de stock.');
          guardarEnNube({...db, historiaStock: [], actividad: [log, ...(db.actividad || [])].slice(0, 500)});
        }
      };

      useEffect(() => { if(chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: 'smooth' }); }, [chatAsistente, vista]);

      const procesarConsultaAsistente = (e) => {
        e.preventDefault();
        const textoUser = consultaAsistente.trim();
        if(!textoUser) return;
        setChatAsistente(prev => [...prev, { emisor: 'user', texto: textoUser }]);
        setConsultaAsistente('');

        const lower = textoUser.toLowerCase();
        let logsMatch = [...(db.actividad || [])];
        const hoy = new Date();
        const ayer = new Date(); ayer.setDate(hoy.getDate() - 1);

        if (lower.includes('hoy')) logsMatch = logsMatch.filter(l => new Date(l.fecha).toLocaleDateString() === hoy.toLocaleDateString());
        else if (lower.includes('ayer')) logsMatch = logsMatch.filter(l => new Date(l.fecha).toLocaleDateString() === ayer.toLocaleDateString());

        if (lower.includes('gasto') || lower.includes('gastos')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('gasto'));
        else if (lower.includes('deuda') || lower.includes('deudas')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('deuda'));
        else if (lower.includes('stock') || lower.includes('repuesto')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('stock') || l.accion.toLowerCase().includes('repuesto'));
        else if (lower.includes('activo') || lower.includes('billetera') || lower.includes('transferencia')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('billetera') || l.accion.toLowerCase().includes('activo') || l.accion.toLowerCase().includes('movimiento'));
        else if (lower.includes('venta') || lower.includes('comision')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('venta') || l.accion.toLowerCase().includes('comisi'));
        else if (lower.includes('taller') || lower.includes('reparacion') || lower.includes('garantia') || lower.includes('garantía')) logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('taller') || l.accion.toLowerCase().includes('equipo') || l.accion.toLowerCase().includes('garant'));

        if (lower.includes('bruno')) logsMatch = logsMatch.filter(l => l.usuario.toLowerCase() === 'bruno');

        setTimeout(() => {
            let respuesta = '';
            if (logsMatch.length === 0) respuesta = "Revisé los registros y no encontré ningún movimiento que coincida con lo que me pedís.";
            else {
                let limite = 5;
                const ultimos = logsMatch.slice(0, limite);
                respuesta = `Encontré ${logsMatch.length} movimientos relacionados a eso. Acá tenés los más recientes:\n\n` + ultimos.map(l => `• ${l.detalle}`).join('\n\n');
                if(logsMatch.length > limite) respuesta += `\n\n*(Y ${logsMatch.length - limite} movimientos más que podés ver abajo en la tabla)*`;
            }
            setChatAsistente(prev => [...prev, { emisor: 'bot', texto: respuesta }]);
        }, 500); 
      };

      const procesarDescuentoSeguro = (walletId, montoGasto, monedaGasto, activosActuales) => {
        const activosClon = [...activosActuales];
        const idx = activosClon.findIndex(w => w.id === parseInt(walletId));
        if (idx === -1) return { success: false, msg: 'Billetera no encontrada' };
        
        const wallet = activosClon[idx];
        let montoARestar = parseFloat(montoGasto);
        if (monedaGasto === 'ARS' && wallet.moneda === 'USD') montoARestar = montoARestar / db.cotizacionDolar;
        if (monedaGasto === 'USD' && wallet.moneda === 'ARS') montoARestar = montoARestar * db.cotizacionDolar;
        
        if (parseFloat(wallet.monto) < redondear(montoARestar)) return { success: false, msg: `Saldo insuficiente.` };
        activosClon[idx].monto = (parseFloat(wallet.monto) - montoARestar).toFixed(2);
        return { success: true, activosActualizados: activosClon };
      };

      const procesarReembolsoWallet = (walletId, montoAReembolsar, monedaReembolso, activosActuales) => {
        const activosClon = [...activosActuales];
        const idx = activosClon.findIndex(w => w.id === parseInt(walletId));
        if (idx === -1) return activosClon; 
        
        const wallet = activosClon[idx];
        let montoASumar = parseFloat(montoAReembolsar);
        if (monedaReembolso === 'ARS' && wallet.moneda === 'USD') montoASumar = montoASumar / db.cotizacionDolar;
        if (monedaReembolso === 'USD' && wallet.moneda === 'ARS') montoASumar = montoASumar * db.cotizacionDolar;
        
        activosClon[idx].monto = (parseFloat(wallet.monto) + montoASumar).toFixed(2);
        return activosClon;
      };

      const fechaHoyLocalISO = () => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      };

      const agregarActivo = (e) => {
        e.preventDefault();
        const tnaNum = nuevoActivo.tipo === 'billetera' ? (parseFloat(nuevoActivo.tna) || 0) : 0;
        const item = {
          id: Date.now(),
          nombre: nuevoActivo.nombre.trim(),
          monto: parseFloat(nuevoActivo.monto) || 0,
          moneda: nuevoActivo.moneda,
          tipo: nuevoActivo.tipo,
          tna: tnaNum,
          ultimoDiaInteres: tnaNum > 0 ? fechaHoyLocalISO() : null,
          tsUltimaRevisionTna: tnaNum > 0 ? Date.now() : null
        };
        const log = generarLog('Creó Billetera/Activo', `Creó ${item.tipo}: "${item.nombre}" con saldo inicial de ${item.monto} ${item.moneda}${tnaNum > 0 ? ` (TNA ${tnaNum}%)` : ''}`, item);
        guardarEnNube({ ...db, activos: [item, ...db.activos], actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevoActivo({ nombre: '', monto: '', moneda: 'USD', tipo: 'billetera', tna: '' });
      };

      const confirmarRevisionTnaSemanal = (e, huboCambio) => {
        if (e) e.preventDefault();
        const walletActual = revisionTnaCola[0];
        if (!walletActual) return;

        const hoyISO = fechaHoyLocalISO();
        let nuevaTna = parseFloat(walletActual.tna) || 0;
        let nuevoSaldo = parseFloat(walletActual.monto) || 0;
        let detalleLog = `Confirmó que "${walletActual.nombre}" mantiene su tasa en ${nuevaTna}% TNA.`;

        if (huboCambio) {
          nuevaTna = parseFloat(revisionTnaForm.nuevaTna);
          if (isNaN(nuevaTna) || nuevaTna < 0) return alert('Ingresá un porcentaje anual (TNA) válido.');
          const saldoIngresado = parseFloat(revisionTnaForm.saldoReal);
          if (isNaN(saldoIngresado) || saldoIngresado < 0) return alert('Ingresá el saldo real actual que tenés en esta billetera.');
          nuevoSaldo = saldoIngresado;
          detalleLog = `Actualizó "${walletActual.nombre}" a ${nuevaTna}% TNA y ajustó saldo real a ${nuevoSaldo} ${walletActual.moneda}.`;
        }

        const activosAc = (db.activos || []).map(a => a.id === walletActual.id ? {
          ...a,
          tna: nuevaTna,
          monto: nuevoSaldo.toFixed(2),
          ultimoDiaInteres: nuevaTna > 0 ? hoyISO : null,
          tsUltimaRevisionTna: Date.now()
        } : a);

        const log = generarLog('Control Semanal TNA', detalleLog);
        guardarEnNube({ ...db, activos: activosAc, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setRevisionTnaCola(prev => prev.slice(1));
        setRevisionTnaForm({ cambio: false, nuevaTna: '', saldoReal: '' });
      };

      const procesarTransferenciaInterna = (e) => {
          e.preventDefault();
          if (nuevaTransferencia.origenId === nuevaTransferencia.destinoId) return alert('La billetera origen debe ser distinta al destino.');
          const mTransferir = parseFloat(nuevaTransferencia.monto);
          if (mTransferir <= 0) return alert('Monto inválido.');
          const op = procesarDescuentoSeguro(nuevaTransferencia.origenId, mTransferir, nuevaTransferencia.moneda, db.activos);
          if (!op.success) return alert(op.msg);
          const activosPost = procesarReembolsoWallet(nuevaTransferencia.destinoId, mTransferir, nuevaTransferencia.moneda, op.activosActualizados);
          const nOrigen = db.activos.find(a => a.id === parseInt(nuevaTransferencia.origenId))?.nombre;
          const nDestino = db.activos.find(a => a.id === parseInt(nuevaTransferencia.destinoId))?.nombre;
          const log = generarLog('Movimiento Interno', `Transfirió ${mTransferir} ${nuevaTransferencia.moneda} de "${nOrigen}" hacia "${nDestino}".`);
          guardarEnNube({ ...db, activos: activosPost, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
          setNuevaTransferencia({ origenId: '', destinoId: '', monto: '', moneda: 'ARS' });
      };

      const agregarGastoPuntual = (e) => {
        e.preventDefault();
        if (!nuevoGastoPuntual.walletId || !nuevoGastoPuntual.concepto) return alert('Completá los datos.');
        const op = procesarDescuentoSeguro(nuevoGastoPuntual.walletId, nuevoGastoPuntual.monto, nuevoGastoPuntual.moneda, db.activos);
        if (!op.success) return alert(op.msg); 
        const walletUsada = db.activos.find(w => w.id === parseInt(nuevoGastoPuntual.walletId));
        const conceptoTrim = nuevoGastoPuntual.concepto.trim();
        const detalleTrim = (nuevoGastoPuntual.detalle || '').trim();
        const item = { id: Date.now(), concepto: conceptoTrim, detalle: detalleTrim, monto: parseFloat(nuevoGastoPuntual.monto) || 0, moneda: nuevoGastoPuntual.moneda, fecha: new Date().toLocaleDateString(), pagadoCon: walletUsada?.nombre || 'Desconocido', walletIdOriginal: walletUsada?.id };
        const nuevasCats = [...new Set([conceptoTrim, ...(db.historiaConceptos || [])])];
        const log = generarLog('Creó Gasto Suelto', `Registró gasto en "${item.concepto}"${detalleTrim ? ` (${detalleTrim})` : ''} por ${item.monto} ${item.moneda}. Pagado con ${item.pagadoCon}.`, item);
        guardarEnNube({ ...db, activos: op.activosActualizados, gastosPuntuales: [item, ...(db.gastosPuntuales || [])], historiaConceptos: nuevasCats, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevoGastoPuntual({ concepto: '', detalle: '', monto: '', moneda: 'ARS', walletId: nuevoGastoPuntual.walletId });
        setMostrarInputConceptoLibre(false);
      };

      const eliminarGastoPuntual = (itemGasto) => {
        if(window.confirm(`¿Eliminar gasto de ${itemGasto.concepto}? El dinero será reembolsado a ${itemGasto.pagadoCon}.`)){
            const activosReembolsados = procesarReembolsoWallet(itemGasto.walletIdOriginal, itemGasto.monto, itemGasto.moneda, db.activos);
            const log = generarLog('Eliminó Gasto Suelto', `Eliminó gasto de "${itemGasto.concepto}" por ${itemGasto.monto} ${itemGasto.moneda}. Dinero reembolsado a ${itemGasto.pagadoCon}.`, itemGasto);
            guardarEnNube({ ...db, activos: activosReembolsados, gastosPuntuales: db.gastosPuntuales.filter(x => x.id !== itemGasto.id), actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        }
      };

      const procesarEdicionGastoPuntual = (e) => {
        e.preventDefault();
        if (!window.confirm(`¿Confirmás guardar los cambios en el gasto "${editandoGastoPuntual.concepto}"?`)) return;
        const gastoOrig = db.gastosPuntuales.find(g => g.id === editandoGastoPuntual.id);
        const activosReemb = procesarReembolsoWallet(gastoOrig.walletIdOriginal, gastoOrig.monto, gastoOrig.moneda, db.activos);
        const opNuevo = procesarDescuentoSeguro(editandoGastoPuntual.walletIdOriginal, editandoGastoPuntual.monto, editandoGastoPuntual.moneda, activosReemb);
        if (!opNuevo.success) return alert(opNuevo.msg + " (El gasto original no se modificó).");
        const nombreWalletNueva = opNuevo.activosActualizados.find(w => w.id === parseInt(editandoGastoPuntual.walletIdOriginal))?.nombre;
        const detalleTrim = (editandoGastoPuntual.detalle || '').trim();
        const gastosAc = db.gastosPuntuales.map(g => {
            if (g.id === editandoGastoPuntual.id) return { ...g, concepto: editandoGastoPuntual.concepto, detalle: detalleTrim, monto: parseFloat(editandoGastoPuntual.monto), moneda: editandoGastoPuntual.moneda, walletIdOriginal: parseInt(editandoGastoPuntual.walletIdOriginal), pagadoCon: nombreWalletNueva };
            return g;
        });
        const log = generarLog('Editó Gasto Suelto', `Editó gasto a "${editandoGastoPuntual.concepto}"${detalleTrim ? ` (${detalleTrim})` : ''}. Modificó monto a ${editandoGastoPuntual.monto}.`, { original: gastoOrig, nuevo: editandoGastoPuntual });
        guardarEnNube({ ...db, activos: opNuevo.activosActualizados, gastosPuntuales: gastosAc, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setEditandoGastoPuntual(null);
      };

      const agregarGastoFijo = (e) => {
        e.preventDefault();
        const item = { 
          id: Date.now(), concepto: nuevoGastoFijo.concepto.trim(), monto: parseFloat(nuevoGastoFijo.monto) || 0, moneda: nuevoGastoFijo.moneda, tipo: nuevoGastoFijo.tipo, diaVencimiento: nuevoGastoFijo.diaVencimiento,
          cuotasTotales: nuevoGastoFijo.tipo === 'cuotas' ? parseInt(nuevoGastoFijo.cuotasTotales) || 1 : null, cuotasPagadas: nuevoGastoFijo.tipo === 'cuotas' ? 0 : null, ultimoPago: null
        };
        const log = generarLog('Creó Gasto Fijo', `Registró "${item.concepto}" por ${item.monto} ${item.moneda}.`, item);
        guardarEnNube({ ...db, gastosFijos: [item, ...(db.gastosFijos || [])], actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevoGastoFijo({ concepto: '', monto: '', moneda: 'ARS', tipo: 'fijo', cuotasTotales: '3', diaVencimiento: '1' });
      };

      const estaPagadoEsteMes = (itemFijo) => {
        const hoy = new Date();
        const mesActual = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}`;
        if (itemFijo.ultimoPagoMes) return itemFijo.ultimoPagoMes === mesActual;
        if (itemFijo.ultimoPagoTs) {
          const d = new Date(itemFijo.ultimoPagoTs);
          return d.getFullYear() === hoy.getFullYear() && d.getMonth() === hoy.getMonth();
        }
        if (itemFijo.ultimoPago) {
          const partes = String(itemFijo.ultimoPago).split('/').map(Number);
          if (partes.length === 3) {
            const anio = partes[2] < 100 ? 2000 + partes[2] : partes[2];
            const mesIdx = partes[1] > 12 ? (partes[0] - 1) : (partes[1] - 1);
            if (anio === hoy.getFullYear() && mesIdx === hoy.getMonth()) return true;
          }
        }
        return false;
      };

      const obtenerEstadoGastoFijo = (itemFijo) => {
        if (itemFijo.tipo === 'cuotas' && itemFijo.cuotasTotales && itemFijo.cuotasPagadas >= itemFijo.cuotasTotales) {
          return { codigo: 'completado', texto: 'COMPLETADO', color: 'verde' };
        }
        if (estaPagadoEsteMes(itemFijo)) {
          return { codigo: 'pagado', texto: `PAGADO (${itemFijo.ultimoPago || 'Este mes'})`, color: 'verde' };
        }
        const hoyDia = new Date().getDate();
        const diaVenc = parseInt(itemFijo.diaVencimiento) || 1;
        const diff = diaVenc - hoyDia;
        if (diff === 0) return { codigo: 'vence_hoy', texto: 'VENCE HOY', color: 'rojo' };
        if (diff < 0) return { codigo: 'vencido', texto: `VENCIDO (Día ${diaVenc})`, color: 'rojo' };
        if (diff <= 5) return { codigo: 'por_vencer', texto: `Vence en ${diff} ${diff === 1 ? 'día' : 'días'}`, color: 'amarillo' };
        return { codigo: 'pendiente', texto: `Día ${diaVenc} (Faltan ${diff}d)`, color: 'neutro' };
      };

      const procesarPagoFijo = (itemFijo) => {
        if (!pagoActivo.walletId) return alert('Elegí una billetera.');
        const op = procesarDescuentoSeguro(pagoActivo.walletId, itemFijo.monto, itemFijo.moneda, db.activos);
        if (!op.success) return alert(op.msg);
        const hoy = new Date();
        const fechaHoy = hoy.toLocaleDateString('es-AR');
        const mesActual = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}`;
        const walletUsada = op.activosActualizados.find(w => w.id === parseInt(pagoActivo.walletId))?.nombre || 'Billetera';
        const nuevoRegPago = { id: Date.now(), fecha: fechaHoy, monto: itemFijo.monto, moneda: itemFijo.moneda, pagadoCon: walletUsada };
        const gastosFijosAc = db.gastosFijos.map(g => {
          if (g.id === itemFijo.id) {
            return {
              ...g,
              cuotasPagadas: g.tipo === 'cuotas' ? g.cuotasPagadas + 1 : g.cuotasPagadas,
              ultimoPago: fechaHoy,
              ultimoPagoMes: mesActual,
              ultimoPagoTs: Date.now(),
              ultimoPagoWallet: walletUsada,
              historialPagos: [nuevoRegPago, ...(g.historialPagos || [])]
            };
          }
          return g;
        });
        const log = generarLog('Efectuó Pago', `Pagó "${itemFijo.concepto}" (${itemFijo.monto} ${itemFijo.moneda}) desde ${walletUsada}.`, itemFijo);
        guardarEnNube({ ...db, activos: op.activosActualizados, gastosFijos: gastosFijosAc, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setPagoActivo({ idGasto: null, walletId: '' });
      };

      const agregarDeuda = (e) => {
        e.preventDefault();
        const montoNuevo = parseFloat(nuevaDeuda.monto) || 0;
        const motivoTrim = nuevaDeuda.motivo.trim();
        const fechaHoy = new Date().toLocaleDateString();
        let deudasAc = [...(db.deudas || [])];
        const idx = deudasAc.findIndex(d => d.acreedor.trim().toLowerCase() === nuevaDeuda.acreedor.trim().toLowerCase() && d.moneda === nuevaDeuda.moneda);
        const nvoMov = { id: Date.now(), fecha: fechaHoy, motivo: motivoTrim, monto: montoNuevo, moneda: nuevaDeuda.moneda, tipo: 'cargo' };

        let log;
        if (idx !== -1) {
          const movsPrevios = Array.isArray(deudasAc[idx].movimientos) && deudasAc[idx].movimientos.length > 0
            ? deudasAc[idx].movimientos
            : [{ id: deudasAc[idx].id, fecha: deudasAc[idx].fecha || fechaHoy, motivo: deudasAc[idx].motivo || 'Saldo inicial', monto: parseFloat(deudasAc[idx].monto), moneda: deudasAc[idx].moneda, tipo: 'cargo' }];
          deudasAc[idx].monto = (parseFloat(deudasAc[idx].monto) + montoNuevo).toFixed(2);
          deudasAc[idx].motivo = `${movsPrevios.filter(m => m.tipo === 'cargo').length + 1} préstamos acumulados (Últ: ${motivoTrim})`;
          deudasAc[idx].movimientos = [nvoMov, ...movsPrevios];
          log = generarLog('Aumentó Deuda', `Le sumó ${montoNuevo} ${nuevaDeuda.moneda} a la deuda con "${deudasAc[idx].acreedor}" (${motivoTrim}).`, deudasAc[idx]);
        } else {
          const item = { id: Date.now(), acreedor: nuevaDeuda.acreedor.trim(), motivo: motivoTrim, monto: montoNuevo.toFixed(2), moneda: nuevaDeuda.moneda, fecha: fechaHoy, movimientos: [nvoMov] };
          deudasAc.unshift(item);
          log = generarLog('Creó Deuda', `Deuda con "${item.acreedor}" por ${item.monto} ${item.moneda} (${motivoTrim}).`, item);
        }
        guardarEnNube({ ...db, deudas: deudasAc, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevaDeuda({ acreedor: '', motivo: '', monto: '', moneda: 'USD' });
      };

      const procesarPagoDeudaLibre = (itemDeuda) => {
        if (!pagoDeudaActivo.walletId || !pagoDeudaActivo.montoAbono) return alert('Completá los datos.');
        const abonoFisico = parseFloat(pagoDeudaActivo.montoAbono);
        if (abonoFisico <= 0) return alert('Monto inválido.');
        let abonoConvertido = abonoFisico;
        if (pagoDeudaActivo.monedaAbono === 'ARS' && itemDeuda.moneda === 'USD') abonoConvertido = abonoFisico / db.cotizacionDolar;
        if (pagoDeudaActivo.monedaAbono === 'USD' && itemDeuda.moneda === 'ARS') abonoConvertido = abonoFisico * db.cotizacionDolar;

        if (redondear(abonoConvertido) > parseFloat(itemDeuda.monto) + 0.05) return alert(`Intento de sobrepago.`);
        const op = procesarDescuentoSeguro(pagoDeudaActivo.walletId, abonoFisico, pagoDeudaActivo.monedaAbono, db.activos);
        if (!op.success) return alert(op.msg); 

        const wUsada = op.activosActualizados.find(w => w.id === parseInt(pagoDeudaActivo.walletId))?.nombre;
        const nvoMonto = parseFloat(itemDeuda.monto) - abonoConvertido;
        const movAbono = { id: Date.now(), fecha: new Date().toLocaleDateString(), motivo: `Abono desde ${wUsada} (${abonoFisico} ${pagoDeudaActivo.monedaAbono})`, monto: abonoConvertido, moneda: itemDeuda.moneda, tipo: 'abono' };

        let deudasAc = [];
        if (nvoMonto <= 0.05) {
          deudasAc = (db.deudas || []).filter(d => d.id !== itemDeuda.id);
        } else {
          deudasAc = (db.deudas || []).map(d => {
            if (d.id === itemDeuda.id) {
              const movsBase = Array.isArray(d.movimientos) && d.movimientos.length > 0
                ? d.movimientos
                : [{ id: d.id, fecha: d.fecha || new Date().toLocaleDateString(), motivo: d.motivo || 'Saldo inicial', monto: parseFloat(d.monto), moneda: d.moneda, tipo: 'cargo' }];
              return { ...d, monto: nvoMonto.toFixed(4), movimientos: [movAbono, ...movsBase] };
            }

                      monto: mFisico,
                      moneda: panelCobroReparacion.monedaPago,
                      montoUSD: aUSD,
                      fecha: new Date().toLocaleDateString()
                  };
                  const detPagos = [...(r.detallePagos || []), nuevoPago];
                  return { ...r, montoAdeudadoRestante: nvoRestante, estadoCobro: estadoF, metodosPago: m, detallePagos: detPagos };
              }
              return r;
          });
          let hMet = db.historiaMetodosPago || ['Efectivo', 'Transferencia'];
          const mt = panelCobroReparacion.metodoPago.trim();
          if (mt) hMet = [...new Set([mt, ...hMet])];

          const log = generarLog('Cobró Rep. Local', `[${item.equipoOriginal.modelo}]: Se anotó el 50% de ${mFisico} ${panelCobroReparacion.monedaPago} vía ${mt} a tu favor.`);
          guardarEnNube({ ...db, deudasCobrar: dCobrar, reparacionesFin: repsF, historiaMetodosPago: hMet, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
          setPanelCobroReparacion({ idReparacion: null, metodoPago: '', montoCobro: '', monedaPago: 'ARS' });
          setMostrarInputMetodoLibre(false);
      };

      const eliminarReparacionHistorial = (itemRep) => {
          if (window.confirm("¿Seguro querés eliminar este registro histórico?")) {
              const log = generarLog('Eliminó Historial de Reparación', `Borró el historial del ${itemRep.equipoOriginal.modelo}.`);
              guardarEnNube({ ...db, reparacionesFin: db.reparacionesFin.filter(v => v.id !== itemRep.id), actividad: [log, ...(db.actividad || [])].slice(0, 500) });
          }
      };

      // --- HANDLERS DE GARANTÍAS Y RMA ---
      const procesarReclamoGarantia = (e, itemRep) => {
          e.preventDefault();
          if (!panelReclamoGarantia.motivoFalla.trim()) return alert('Ingresá el motivo de la falla o reclamo.');

          let stockAc = [...(db.stock || [])];
          let rmaAc = [...(db.rmaProveedores || [])];
          let detalleSolucion = 'Ajuste en taller (Sin cambio de pieza)';

          if (panelReclamoGarantia.tipoSolucion === 'cambio_rma') {
              if (!panelReclamoGarantia.repuestoReemplazoId) return alert('Seleccioná qué repuesto nuevo vas a descontar del stock para hacer el cambio.');
              const repNuevo = stockAc.find(s => s.id === parseInt(panelReclamoGarantia.repuestoReemplazoId));
              if (!repNuevo || repNuevo.cantidad < 1) return alert('No hay stock disponible del repuesto seleccionado.');

              // 1. Descontamos 1 unidad del repuesto nuevo que usamos hoy
              stockAc = stockAc.map(s => s.id === repNuevo.id ? { ...s, cantidad: s.cantidad - 1 } : s);

              // 2. Mandamos el repuesto fallado a la lista de RMA para reclamar al proveedor
              const nombreFallado = itemRep.repuestoUsado || repNuevo.concepto;
              const proveedorFallado = itemRep.repuestoProveedor || repNuevo.proveedor || 'No especificado';

              const nuevoItemRMA = {
                  id: Date.now(),
                  fecha: new Date().toLocaleDateString(),
                  fechaTimestamp: Date.now(),
                  repuesto: nombreFallado,
                  proveedor: proveedorFallado,
                  modeloEquipo: itemRep.equipoOriginal.modelo,
                  imeiEquipo: itemRep.equipoOriginal.imei,
                  cliente: itemRep.equipoOriginal.origen === 'cliente' ? itemRep.equipoOriginal.clienteNombre : itemRep.equipoOriginal.gremio,
                  motivoFalla: panelReclamoGarantia.motivoFalla.trim(),
                  repuestoStockIdReferencia: repNuevo.id
              };
              rmaAc.unshift(nuevoItemRMA);
              detalleSolucion = `Cambio de pieza (${repNuevo.concepto}) -> Enviado a RMA Proveedor (${proveedorFallado})`;
          }

          const nuevoEventoGarantia = {
              id: Date.now() + 1,
              fecha: new Date().toLocaleDateString(),
              motivo: panelReclamoGarantia.motivoFalla.trim(),
              solucion: detalleSolucion
          };

          const repsActualizadas = (db.reparacionesFin || []).map(r => {
              if (r.id === itemRep.id) {
                  return { ...r, historialGarantia: [nuevoEventoGarantia, ...(r.historialGarantia || [])] };
              }
              return r;
          });

          const log = generarLog('Registró Garantía / RMA', `Equipo ${itemRep.equipoOriginal.modelo} (IMEI: ${itemRep.equipoOriginal.imei}). Motivo: ${panelReclamoGarantia.motivoFalla}. Solución: ${detalleSolucion}`);
          guardarEnNube({ ...db, stock: stockAc, rmaProveedores: rmaAc, reparacionesFin: repsActualizadas, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
          setPanelReclamoGarantia({ idReparacion: null, motivoFalla: '', tipoSolucion: 'cambio_rma', repuestoReemplazoId: '' });
      };

      const resolverRMAProveedor = (itemRMA, reponerAlStock) => {
          let stockAc = [...(db.stock || [])];
          let msgLog = '';

          if (reponerAlStock) {
              const idx = stockAc.findIndex(s => s.id === itemRMA.repuestoStockIdReferencia || (s.concepto.toLowerCase() === itemRMA.repuesto.toLowerCase() && (s.proveedor || '').toLowerCase() === itemRMA.proveedor.toLowerCase()));
              if (idx !== -1) {
                  stockAc[idx].cantidad = parseInt(stockAc[idx].cantidad) + 1;
                  msgLog = `El proveedor "${itemRMA.proveedor}" repuso "${itemRMA.repuesto}". Se sumó +1 unidad al Stock.`;
              } else {
                  const nuevoItem = { id: Date.now(), concepto: itemRMA.repuesto, cantidad: 1, monto: 0, moneda: 'USD', proveedor: itemRMA.proveedor };
                  stockAc.unshift(nuevoItem);
                  msgLog = `El proveedor "${itemRMA.proveedor}" repuso "${itemRMA.repuesto}". Se creó en Stock con 1 unidad.`;
              }
          } else {
              if (!window.confirm(`¿Cerrar reclamo de "${itemRMA.repuesto}" con el proveedor "${itemRMA.proveedor}" sin sumar stock?`)) return;
              msgLog = `Se cerró el reclamo de RMA por "${itemRMA.repuesto}" (Proveedor: ${itemRMA.proveedor}) sin reposición física.`;
          }

          const rmaRestantes = (db.rmaProveedores || []).filter(r => r.id !== itemRMA.id);
          const log = generarLog('Resolvió RMA Proveedor', msgLog, itemRMA);
          guardarEnNube({ ...db, stock: stockAc, rmaProveedores: rmaRestantes, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
      };

      const reparacionesFiltradas = useMemo(() => {
          return (db.reparacionesFin || []).filter(item => {
              let ok = true; const eq = item.equipoOriginal;
              if (filtroRep.imei && !eq.imei.includes(filtroRep.imei)) ok = false;
              if (filtroRep.modelo && !eq.modelo.toLowerCase().includes(filtroRep.modelo.toLowerCase())) ok = false;
              if (filtroRep.cliente) {
                  const nStr = eq.origen === 'cliente' ? eq.clienteNombre : eq.gremio;
                  if (!nStr.toLowerCase().includes(filtroRep.cliente.toLowerCase())) ok = false;
              }
              if (filtroRep.telefono && eq.origen === 'cliente' && !eq.clienteTelefono.includes(filtroRep.telefono)) ok = false;
              if (filtroRep.origen && eq.origen !== filtroRep.origen) ok = false;
              if (filtroRep.estadoCobro && item.estadoCobro !== filtroRep.estadoCobro) ok = false;
              if (filtroRep.metodoPago && (!item.metodosPago || !item.metodosPago.includes(filtroRep.metodoPago))) ok = false;
              if (filtroRep.fechaExacta) {
                  const ini = new Date(filtroRep.fechaExacta + 'T00:00:00').getTime();
                  const fin = new Date(filtroRep.fechaExacta + 'T23:59:59').getTime();
                  if (item.fechaTimestamp < ini || item.fechaTimestamp > fin) ok = false;
              }
              if (filtroRep.desde && item.fechaTimestamp < new Date(filtroRep.desde + 'T00:00:00').getTime()) ok = false;
              if (filtroRep.hasta && item.fechaTimestamp > new Date(filtroRep.hasta + 'T23:59:59').getTime()) ok = false;
              return ok;
          });
      }, [db.reparacionesFin, filtroRep]);

      // CÁLCULO DE GARANTÍAS, SEMÁFORO Y ORDENAMIENTO POR TIEMPO
      const garantiasProcesadas = useMemo(() => {
          const procesadas = (db.reparacionesFin || []).map(item => {
              const diasPasados = calcularDiasPasados(item.fechaTimestamp);
              const esBat = esTextoBateria(item.equipoOriginal?.falla) || esTextoBateria(item.repuestoUsado);
              const diasTotales = item.diasGarantia !== undefined ? parseInt(item.diasGarantia) : (esBat ? 180 : 90);
              const diasRestantes = diasTotales - diasPasados;

              let estadoSemaforo = 'vigente'; // verde (> 15 días)
              if (diasTotales === 0 || diasRestantes <= 0) {
                  estadoSemaforo = 'vencida'; // gris
              } else if (diasRestantes <= 15) {
                  estadoSemaforo = 'por_vencer'; // rojo (<= 15 días)
              }

              return {
                  ...item,
                  diasPasados,
                  diasTotales,
                  diasRestantes,
                  esBateria: diasTotales === 180 || esBat,
                  estadoSemaforo
              };
          }).filter(item => {
              if (filtroGarantia.estado !== 'todas' && item.estadoSemaforo !== filtroGarantia.estado) return false;
              if (filtroGarantia.busqueda.trim()) {
                  const q = filtroGarantia.busqueda.toLowerCase().trim();
                  const eq = item.equipoOriginal;
                  const propietario = eq.origen === 'cliente' ? eq.clienteNombre : eq.gremio;
                  const match = eq.imei.toLowerCase().includes(q) ||
                                eq.modelo.toLowerCase().includes(q) ||
                                propietario.toLowerCase().includes(q) ||
                                (eq.clienteTelefono && eq.clienteTelefono.includes(q)) ||
                                (item.repuestoUsado && item.repuestoUsado.toLowerCase().includes(q));
                  if (!match) return false;
              }
              return true;
          });

          return [...procesadas].sort((a, b) => {
              if (filtroGarantia.orden === 'recientes') return b.fechaTimestamp - a.fechaTimestamp;
              if (filtroGarantia.orden === 'antiguas') return a.fechaTimestamp - b.fechaTimestamp;
              
              const aActiva = a.diasTotales > 0 && a.diasRestantes > 0;
              const bActiva = b.diasTotales > 0 && b.diasRestantes > 0;

              if (filtroGarantia.orden === 'menos_tiempo') {
                  if (aActiva && !bActiva) return -1;
                  if (!aActiva && bActiva) return 1;
                  if (aActiva && bActiva) return a.diasRestantes - b.diasRestantes;
                  return b.diasRestantes - a.diasRestantes;
              }
              if (filtroGarantia.orden === 'mas_tiempo') {
                  if (aActiva && !bActiva) return -1;
                  if (!aActiva && bActiva) return 1;
                  return b.diasRestantes - a.diasRestantes;
              }
              return 0;
          });
      }, [db.reparacionesFin, filtroGarantia]);

      const stockAgrupado = useMemo(() => {
          const grupos = {};
          (db.stock || []).forEach(item => {
              const nombreLimpio = (item.concepto || 'Sin nombre').trim();
              const key = nombreLimpio.toLowerCase();
              const cant = parseInt(item.cantidad) || 0;
              const costoUSD = aUSDBase(item.monto, item.moneda, db.cotizacionDolar);
              const fechaLote = item.fecha || new Date(item.id).toLocaleDateString();

              if (!grupos[key]) {
                  grupos[key] = {
                      key,
                      concepto: nombreLimpio,
                      cantidadTotal: 0,
                      capitalTotalUSD: 0,
                      lotes: [],
                      proveedores: new Set(),
                      tsMasAntiguo: item.id,
                      tsMasReciente: item.id
                  };
              }
              grupos[key].cantidadTotal += cant;
              grupos[key].capitalTotalUSD += (costoUSD * cant);
              grupos[key].lotes.push({ ...item, fechaLote });
              if (item.proveedor) grupos[key].proveedores.add(item.proveedor);
              if (item.id < grupos[key].tsMasAntiguo) grupos[key].tsMasAntiguo = item.id;
              if (item.id > grupos[key].tsMasReciente) grupos[key].tsMasReciente = item.id;
          });

          return Object.values(grupos).map(g => ({
              ...g,
              proveedoresList: Array.from(g.proveedores),
              lotes: g.lotes.sort((a, b) => a.id - b.id) // Ordenados del más antiguo al más nuevo
          }));
      }, [db.stock, db.cotizacionDolar]);

      const stockCriticoCount = useMemo(() => stockAgrupado.filter(g => g.cantidadTotal <= 3).length, [stockAgrupado]);

      const stockFiltrado = useMemo(() => {
          const filtrados = stockAgrupado.filter(grupo => {
              if (filtroStock.soloCritico && grupo.cantidadTotal > 3) return false;
              if (filtroStock.busqueda.trim()) {
                  const q = filtroStock.busqueda.toLowerCase().trim();
                  const matchConcepto = grupo.concepto.toLowerCase().includes(q);
                  const matchProv = grupo.proveedoresList.some(p => p.toLowerCase().includes(q));
                  const matchFecha = grupo.lotes.some(l => (l.fechaLote || '').toLowerCase().includes(q));
                  if (!matchConcepto && !matchProv && !matchFecha) return false;
              }
              return true;
          });

          return [...filtrados].sort((a, b) => {
              if (filtroStock.orden === 'antiguos') return a.tsMasAntiguo - b.tsMasAntiguo;
              if (filtroStock.orden === 'recientes') return b.tsMasReciente - a.tsMasReciente;
              if (filtroStock.orden === 'menor_stock') return a.cantidadTotal - b.cantidadTotal;
              if (filtroStock.orden === 'mayor_stock') return b.cantidadTotal - a.cantidadTotal;
              return a.concepto.localeCompare(b.concepto, 'es', { numeric: true });
          });
      }, [stockAgrupado, filtroStock]);

      const [filtroStats, setFiltroStats] = useState({ tipo: 'baterias', dias: 'todos', simuladorCompra: '20' });

      const estadisticasConsumo = useMemo(() => {
          const mapa = {};
          let totalUnidades = 0;
          let totalCliente = 0;
          let totalGremio = 0;
          const ahora = Date.now();
          const limiteTs = filtroStats.dias === 'todos' ? 0 : ahora - (parseInt(filtroStats.dias) * 24 * 60 * 60 * 1000);

          (db.reparacionesFin || []).forEach(rep => {
              if (limiteTs > 0 && rep.fechaTimestamp < limiteTs) return;
              const eq = rep.equipoOriginal || {};
              const piezasUsadas = Array.isArray(rep.repuestosDetalle) && rep.repuestosDetalle.length > 0
                  ? rep.repuestosDetalle.map(d => d.concepto)
                  : (rep.repuestoUsado ? rep.repuestoUsado.split(' + ') : (esTextoBateria(eq.falla) ? [`Bateria ${eq.modelo || 'Sin modelo'}`] : []));

              piezasUsadas.forEach(piezaRaw => {
                  const nombreLimpio = (piezaRaw || '').trim();
                  if (!nombreLimpio) return;

                  // Es batería si lo dice el repuesto O si el motivo de la reparación fue "bateria"
                  const esBat = esTextoBateria(nombreLimpio) || esTextoBateria(eq.falla);
                  if (filtroStats.tipo === 'baterias' && !esBat) return;

                  // Si es una reparación histórica donde el repuesto decía solo "15 Pro" y la falla era "bateria", lo busca como "Bateria 15 Pro"
                  const lowSinTilde = nombreLimpio.toLowerCase().replace(/batería/g, 'bateria').replace(/^iphone\s+/i, '').trim();
                  const grupoStock = stockAgrupado.find(g => {
                      const gKey = g.key.replace(/batería/g, 'bateria');
                      if (gKey === lowSinTilde) return true;
                      if (esBat && !lowSinTilde.includes('bateria')) {
                          if (gKey === `bateria ${lowSinTilde}`) return true;
                          if (gKey === `bateria ${lowSinTilde} base`) return true;
                      }
                      return false;
                  });

                  const key = grupoStock ? grupoStock.key : (esBat && !lowSinTilde.includes('bateria') ? `bateria ${lowSinTilde}` : lowSinTilde);
                  const nombreMostrar = grupoStock ? grupoStock.concepto : (esBat && !esTextoBateria(nombreLimpio) ? `Bateria ${nombreLimpio}` : nombreLimpio);

                  if (!mapa[key]) {
                      mapa[key] = {
                          nombre: nombreMostrar,
                          key,
                          total: 0,
                          cliente: 0,
                          gremio: 0,
                          stockActual: grupoStock ? grupoStock.cantidadTotal : 0
                      };
                  }
                  mapa[key].total += 1;
                  totalUnidades += 1;

                  if (eq.origen === 'gremio') {
                      mapa[key].gremio += 1;
                      totalGremio += 1;
                  } else {
                      mapa[key].cliente += 1;
                      totalCliente += 1;
                  }
              });
          });

          const listaBase = Object.values(mapa).sort((a, b) => b.total - a.total);
          const totalStockAnalizado = listaBase.reduce((acc, it) => acc + it.stockActual, 0);
          const lote = Math.max(0, parseInt(filtroStats.simuladorCompra) || 0);
          const stockFuturoTotal = totalStockAnalizado + lote;

          // Calculamos el stock ideal (Stock Actual + Pedido) según el % de rotación y restamos lo que ya hay en stock
          const preCalculo = listaBase.map(it => {
              const porcentaje = totalUnidades > 0 ? (it.total / totalUnidades) * 100 : 0;
              const stockIdeal = (porcentaje / 100) * stockFuturoTotal;
              const faltanteBruto = Math.max(0, stockIdeal - it.stockActual);
              return { ...it, porcentaje, stockIdeal, faltanteBruto };
          });

          const sumaFaltantes = preCalculo.reduce((acc, it) => acc + it.faltanteBruto, 0);

          const items = preCalculo.map(it => {
              const sugerenciaCompra = sumaFaltantes > 0 ? Math.round((it.faltanteBruto / sumaFaltantes) * lote) : 0;
              return { ...it, sugerenciaCompra };
          });

          return {
              items,
              totalUnidades,
              totalCliente,
              totalGremio,
              totalStockAnalizado,
              porcentajeCliente: totalUnidades > 0 ? (totalCliente / totalUnidades) * 100 : 0,
              porcentajeGremio: totalUnidades > 0 ? (totalGremio / totalUnidades) * 100 : 0
          };
      }, [db.reparacionesFin, filtroStats, stockAgrupado]);

      const [tabStats, setTabStats] = useState('balance');
      const [periodoBalance, setPeriodoBalance] = useState('mes_actual');

      const balanceFinanciero = useMemo(() => {
          const ahora = new Date();
          let desdeTs = 0;
          let hastaTs = Infinity;

          if (periodoBalance === 'mes_actual') {
              desdeTs = new Date(ahora.getFullYear(), ahora.getMonth(), 1).getTime();
          } else if (periodoBalance === 'mes_anterior') {
              desdeTs = new Date(ahora.getFullYear(), ahora.getMonth() - 1, 1).getTime();
              hastaTs = new Date(ahora.getFullYear(), ahora.getMonth(), 0, 23, 59, 59, 999).getTime();
          } else if (periodoBalance === 'ultimos_30') {
              desdeTs = Date.now() - (30 * 24 * 60 * 60 * 1000);
          }

          const obtenerTs = (item) => {
              if (item.fechaTimestamp) return item.fechaTimestamp;
              if (typeof item.id === 'number' && item.id > 1000000000000) return item.id;
              if (item.fecha) {
                  const p = item.fecha.split('/');
                  if (p.length === 3) return new Date(p[2], p[1] - 1, p[0]).getTime();
              }
              return 0;
          };

          // 1. Comisiones por Ventas de Equipos
          let ganVentasUSD = 0;
          let cantEquiposVendidos = 0;
          (db.ventas || []).forEach(v => {
              const ts = obtenerTs(v);
              if (ts >= desdeTs && ts <= hastaTs) {
                  ganVentasUSD += aUSDBase(v.totalComision, v.moneda, db.cotizacionDolar);
                  cantEquiposVendidos += (parseInt(v.cantidad) || 0);
              }
          });

          // 2. Ganancia Limpia de Taller (Particular 50% vs Gremio 100% + Recupero de Repuestos + Medios de Pago)
          let ganTallerClienteUSD = 0;
          let ganTallerGremioUSD = 0;
          let recuperoRepuestosUSD = 0;
          let cantRepCliente = 0;
          let cantRepGremio = 0;
          const mapaMetodos = {};

          (db.reparacionesFin || []).forEach(r => {
              const ts = obtenerTs(r);
              if (ts >= desdeTs && ts <= hastaTs) {
                  const totUSD = parseFloat(r.montoCobrado) || 0;
                  const costoRepUSD = parseFloat(r.costoRepuestoUSD) || 0;
                  const netaOrdenUSD = Math.max(0, totUSD - costoRepUSD);

                  if (r.equipoOriginal?.origen === 'gremio') {
                      ganTallerGremioUSD += netaOrdenUSD;
                      recuperoRepuestosUSD += costoRepUSD;
                      cantRepGremio += 1;
                  } else {
                      ganTallerClienteUSD += (netaOrdenUSD / 2);
                      recuperoRepuestosUSD += costoRepUSD;
                      cantRepCliente += 1;
                  }

                  if (Array.isArray(r.detallePagos) && r.detallePagos.length > 0) {
                      r.detallePagos.forEach(p => {
                          const met = p.metodo || 'Otro';
                          const valUSD = p.montoUSD !== undefined ? parseFloat(p.montoUSD) : aUSDBase(p.monto, p.moneda, db.cotizacionDolar);
                          mapaMetodos[met] = (mapaMetodos[met] || 0) + valUSD;
                      });
                  }
              }
          });

          // 3. Gastos Sueltos y Carga Fija
          let gastosSueltosUSD = 0;
          (db.gastosPuntuales || []).forEach(g => {
              const ts = obtenerTs(g);
              if (ts >= desdeTs && ts <= hastaTs) {
                  gastosSueltosUSD += aUSDBase(g.monto, g.moneda, db.cotizacionDolar);
              }
          });

          const gastosFijosMesUSD = (db.gastosFijos || []).reduce((acc, g) => acc + aUSDBase(g.monto, g.moneda, db.cotizacionDolar), 0);

          const totalIngresosLimpiosUSD = ganVentasUSD + ganTallerClienteUSD + ganTallerGremioUSD;
          const totalGastosUSD = gastosSueltosUSD + gastosFijosMesUSD;
          const resultadoNetoUSD = totalIngresosLimpiosUSD - totalGastosUSD;
          const margenAhorro = totalIngresosLimpiosUSD > 0 ? (resultadoNetoUSD / totalIngresosLimpiosUSD) * 100 : 0;

          // 4. Cobertura de Gastos Fijos en Tiempo Real
          const porcCoberturaFijos = gastosFijosMesUSD > 0 ? Math.min(100, (totalIngresosLimpiosUSD / gastosFijosMesUSD) * 100) : 100;
          const faltanteFijosUSD = Math.max(0, gastosFijosMesUSD - totalIngresosLimpiosUSD);
          const excedenteSobreFijosUSD = Math.max(0, totalIngresosLimpiosUSD - gastosFijosMesUSD);

          // 5. Ratio Ganancia / Gasto (X a 1) y Blindaje Patrimonial (Regla 60 a 1)
          const ratioGananciaGasto = totalGastosUSD > 0 ? (totalIngresosLimpiosUSD / totalGastosUSD) : (totalIngresosLimpiosUSD > 0 ? totalIngresosLimpiosUSD : 0);
          const porcRatio60 = Math.min(100, (ratioGananciaGasto / 60) * 100);

          const billUSD = (db.activos || []).reduce((acc, a) => acc + aUSDBase(a.monto, a.moneda, db.cotizacionDolar), 0);
          const stockUSD = (db.stock || []).reduce((acc, s) => acc + (aUSDBase(s.monto, s.moneda, db.cotizacionDolar) * (parseInt(s.cantidad) || 0)), 0);
          const cobrarUSD = (db.deudasCobrar || []).reduce((acc, d) => acc + aUSDBase(d.monto, d.moneda || 'USD', db.cotizacionDolar), 0);
          const deudasUSD = (db.deudas || []).reduce((acc, d) => acc + aUSDBase(d.monto, d.moneda, db.cotizacionDolar), 0);
          const patrimonioNetoUSD = Math.max(0, billUSD + stockUSD + cobrarUSD - deudasUSD);

          const gastoBaseMensualUSD = totalGastosUSD > 0 ? totalGastosUSD : gastosFijosMesUSD;
          const mesesBlindaje = gastoBaseMensualUSD > 0 ? (patrimonioNetoUSD / gastoBaseMensualUSD) : 0;
          const metaBlindaje60USD = gastoBaseMensualUSD * 60;
          const porcBlindaje60 = metaBlindaje60USD > 0 ? Math.min(100, (patrimonioNetoUSD / metaBlindaje60USD) * 100) : 0;

          const desgloseMetodos = Object.entries(mapaMetodos)
              .map(([metodo, montoUSD]) => ({ metodo, montoUSD }))
              .sort((a, b) => b.montoUSD - a.montoUSD);

          return {
              ganVentasUSD,
              cantEquiposVendidos,
              ganTallerClienteUSD,
              ganTallerGremioUSD,
              recuperoRepuestosUSD,
              cantRepCliente,
              cantRepGremio,
              gastosSueltosUSD,
              gastosFijosMesUSD,
              totalIngresosLimpiosUSD,
              totalGastosUSD,
              resultadoNetoUSD,
              margenAhorro,
              porcCoberturaFijos,
              faltanteFijosUSD,
              excedenteSobreFijosUSD,
              ratioGananciaGasto,
              porcRatio60,
              patrimonioNetoUSD,
              mesesBlindaje,
              metaBlindaje60USD,
              porcBlindaje60,
              desgloseMetodos
          };
      }, [db.ventas, db.reparacionesFin, db.gastosPuntuales, db.gastosFijos, db.activos, db.stock, db.deudasCobrar, db.deudas, db.cotizacionDolar, periodoBalance]);

      // CÁLCULOS GLOBALES
      const tBillUSD = (db.activos || []).filter(a => a.tipo === 'billetera' || !a.tipo).reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      const tActFisUSD = (db.activos || []).filter(a => a.tipo === 'activo').reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      const tStkUSD = (db.stock || []).reduce((acc, item) => acc + ((item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar) * parseInt(item.cantidad)), 0);
      const tDeudPenUSD = (db.deudas || []).reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      const tDeudCobUSD = (db.deudasCobrar || []).reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0); 
      
      const tGastFijUSD = (db.gastosFijos || []).reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      const tGastPuntUSD = (db.gastosPuntuales || []).reduce((acc, item) => acc + (item.moneda==='USD'?parseFloat(item.monto):parseFloat(item.monto)/db.cotizacionDolar), 0);
      
      const now = new Date();
      const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
      const dayOfWeek = now.getDay() || 7;
      const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek + 1).getTime();

      let tVtasHistUSD = 0; let tVtasMesUSD = 0; let tVtasSemUSD = 0; let tEqVend = 0;
      (db.ventas || []).forEach(item => {
          const usd = item.moneda === 'USD' ? parseFloat(item.totalComision) : parseFloat(item.totalComision) / db.cotizacionDolar;
          tVtasHistUSD += usd; tEqVend += parseInt(item.cantidad);
          let ts = item.fechaTimestamp;
          if (!ts && item.fecha) { const p = item.fecha.split('/'); if(p.length===3) ts = new Date(p[2], p[1]-1, p[0]).getTime(); }
          if (ts >= startOfMonth) tVtasMesUSD += usd;
          if (ts >= startOfWeek) tVtasSemUSD += usd;
      });
      
      const tGanNetRepUSD = (db.reparacionesFin || []).reduce((acc, item) => {
          const adeudado = item.montoAdeudadoRestante !== undefined ? parseFloat(item.montoAdeudadoRestante) : 0;
          const cobradoTotalUSD = parseFloat(item.montoCobrado) - adeudado; 
          const costoRepUSD = parseFloat(item.costoRepuestoUSD) || 0;
          if (item.equipoOriginal.origen === 'gremio') return acc + (cobradoTotalUSD > 0 ? cobradoTotalUSD - costoRepUSD : 0);
          else {
              const ganNetaUSD = Math.max(0, parseFloat(item.montoCobrado) - costoRepUSD);
              const miParteTotUSD = costoRepUSD + (ganNetaUSD / 2);
              const prop = parseFloat(item.montoCobrado) > 0 ? (miParteTotUSD / parseFloat(item.montoCobrado)) : 0;
              const miParteReal = cobradoTotalUSD * prop;
              return acc + (miParteReal > 0 ? miParteReal : 0);
          }
      }, 0);

      const tCobPendTallUSD = (db.reparacionesFin || []).reduce((acc, item) => item.estadoCobro === 'pendiente' ? acc + (parseFloat(item.montoAdeudadoRestante) || 0) : acc, 0);
      const patrimonioNetoRealUSD = tBillUSD + tActFisUSD + tStkUSD + tDeudCobUSD + tCobPendTallUSD - tDeudPenUSD;

      const gastosPorCat = useMemo(() => {
        const mapa = {};
        if (filtroGraficoGastos === 'todos' || filtroGraficoGastos === 'sueltos') {
          (db.gastosPuntuales || []).forEach(g => {
            const val = convertirParaMostrar(g.monto, g.moneda);
            const cat = (g.concepto || 'Otros').trim();
            if (!mapa[cat]) mapa[cat] = { categoria: cat, montoGrafico: 0, tieneFijo: false, tieneSuelto: false, estadoFijo: null, items: [] };
            mapa[cat].montoGrafico += val;
            mapa[cat].tieneSuelto = true;
            mapa[cat].items.push({ ...g, esFijo: false });
          });
        }
        if (filtroGraficoGastos === 'todos' || filtroGraficoGastos === 'fijos') {
          (db.gastosFijos || []).forEach(f => {
            const val = convertirParaMostrar(f.monto, f.moneda);
            const cat = (f.concepto || 'Gasto Fijo').trim();
            const est = obtenerEstadoGastoFijo(f);
            if (!mapa[cat]) mapa[cat] = { categoria: cat, montoGrafico: 0, tieneFijo: false, tieneSuelto: false, estadoFijo: null, items: [] };
            mapa[cat].montoGrafico += val;
            mapa[cat].tieneFijo = true;
            mapa[cat].estadoFijo = est;
            mapa[cat].items.push({
              id: `fijo_${f.id}`,
              esFijo: true,
              estadoFijo: est,
              detalle: est.color === 'verde' ? `Gasto Fijo • ${est.texto}` : `Gasto Fijo • Pendiente (${est.texto})`,
              fecha: f.ultimoPago ? `Últ. pago: ${f.ultimoPago}` : `Vence día ${f.diaVencimiento || 1}`,
              pagadoCon: f.ultimoPagoWallet || (est.color === 'verde' ? 'Pagado' : 'Sin pagar este mes'),
              monto: f.monto,
              moneda: f.moneda
            });
          });
        }
        const total = Object.values(mapa).reduce((a, b) => a + b.montoGrafico, 0);
        return Object.values(mapa)
          .map(c => ({ ...c, porcentaje: total ? (c.montoGrafico / total) * 100 : 0 }))
          .sort((a, b) => b.montoGrafico - a.montoGrafico);
      }, [db.gastosPuntuales, db.gastosFijos, filtroGraficoGastos, db.cotizacionDolar, monedaVisual]);

      const logsFiltrados = (db.actividad || []).filter(l => {
          if (filtroUsuario && !l.usuario.toLowerCase().includes(filtroUsuario.toLowerCase())) return false;
          if (filtroFechaExacta) {
              const dLog = new Date(l.fecha);
              if (dLog < new Date(filtroFechaExacta + 'T00:00:00') || dLog > new Date(filtroFechaExacta + 'T23:59:59')) return false;
          }
          if (filtroDesde && new Date(l.fecha) < new Date(filtroDesde + 'T00:00:00')) return false;
          if (filtroHasta && new Date(l.fecha) > new Date(filtroHasta + 'T23:59:59')) return false;
          return true;
      });

      // ==========================================
      // UI RENDER 
      // ==========================================
      if (!isLoaded) return <div className="flex altura-dinamica items-center justify-center font-bold text-blue-400 animate-pulse text-lg">Conectando a tu Nube...</div>;
      
      if (!sesion) {
        return (
          <div className="flex items-center justify-center altura-dinamica bg-slate-950 p-4 w-full">
            <form onSubmit={login} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-xs w-full space-y-5 shadow-2xl fade-in">
              <div className="text-center space-y-1.5">
                <i className="fa-solid fa-fingerprint text-4xl text-blue-500 mb-2"></i>
                <h1 className="text-2xl font-black text-white">Patrimonio</h1>
                <p className="text-slate-400 text-xs font-bold tracking-widest uppercase">Acceso Privado</p>
              </div>
              <input type="password" required placeholder="Tu clave..." value={passInput} onChange={e => {setPassInput(e.target.value); setErrorLogin('');}} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-center text-xl font-mono text-white tracking-widest focus:outline-none focus:border-blue-500" />
              {errorLogin && <p className="text-rose-400 text-xs font-bold text-center mt-2">{errorLogin}</p>}
              <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition text-sm">Desbloquear</button>
            </form>
          </div>
        );
      }

      if (bloqueoCotizacion) {
          return (
            <div className="flex items-center justify-center altura-dinamica bg-slate-950 p-4 w-full">
              <form onSubmit={procesarBloqueoCotizacion} className="bg-slate-900 border border-indigo-500/50 rounded-2xl p-6 max-w-xs w-full space-y-5 shadow-2xl fade-in text-center">
                <div className="space-y-1.5">
                  <i className="fa-solid fa-clock-rotate-left text-4xl text-emerald-400 mb-1"></i>
                  <h1 className="text-xl font-black text-white">Control de Dólar (6 hs)</h1>
                  <p className="text-slate-400 text-xs">Pasaron más de 6 horas. Confirmá o actualizá la cotización actual.</p>
                </div>
                <div>
                  <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1.5">Cotización Dólar ARS Actual</label>
                  <input type="number" step="any" required autoFocus value={cotizacionDiariaInput} onChange={e => setCotizacionDiariaInput(e.target.value)} className="w-full bg-slate-950 border border-emerald-500 rounded-xl px-4 py-3 text-center text-2xl font-black text-emerald-400 focus:outline-none focus:border-emerald-400" />
                </div>
                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition text-sm">Confirmar por 6 horas</button>
              </form>
            </div>
          );
      }

      if (bloqueoBackup) {
          const diasSinBackup = db.tsUltimoBackup ? calcularDiasPasados(db.tsUltimoBackup) : 'más de 7';
          return (
            <div className="flex items-center justify-center altura-dinamica bg-slate-950 p-4 w-full">
              <div className="bg-slate-900 border border-amber-500/50 rounded-2xl p-6 max-w-xs w-full space-y-5 shadow-2xl fade-in text-center">
                <div className="space-y-1.5">
                  <i className="fa-solid fa-cloud-arrow-down text-4xl text-amber-400 mb-1"></i>
                  <h1 className="text-xl font-black text-white">Backup Semanal Obligatorio</h1>
                  <p className="text-slate-400 text-xs">Llevás <strong>{diasSinBackup} días</strong> sin descargar una copia local de tu base de datos.</p>
                </div>
                <button onClick={ejecutarDescargaBackup} className="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl transition text-sm shadow-lg">
                  <i className="fa-solid fa-download mr-2"></i>Descargar Backup y Entrar
                </button>
              </div>
            </div>
          );
      }

      if (revisionTnaCola.length > 0) {
          const wRev = revisionTnaCola[0];
          const tnaActual = parseFloat(wRev.tna) || 0;
          const ganDiariaEst = ((parseFloat(wRev.monto) || 0) * ((tnaActual / 100) / 365));
          return (
            <div className="flex items-center justify-center altura-dinamica bg-slate-950 p-4 w-full">
              <div className="bg-slate-900 border border-emerald-500/50 rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl fade-in">
                <div className="text-center space-y-1.5">
                  <i className="fa-solid fa-percent text-3xl text-emerald-400 mb-1"></i>
                  <h1 className="text-lg font-black text-white">Control Semanal de Intereses</h1>
                  <p className="text-slate-400 text-xs">Pasó 1 semana desde tu último chequeo de <strong className="text-white">{wRev.nombre}</strong>.</p>
                </div>

                <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 flex justify-between items-center text-xs">
                  <div>
                    <span className="text-[10px] text-slate-500 uppercase font-bold block">Saldo estimado hoy</span>
                    <span className="font-mono font-black text-white text-sm">{parseFloat(wRev.monto).toLocaleString('es-AR')} {wRev.moneda}</span>
                  </div>
                  <div className="text-right">
                    <span className="text-[10px] text-emerald-400 uppercase font-bold block">TNA Actual</span>
                    <span className="font-mono font-black text-emerald-400 text-sm">{tnaActual}% anual</span>
                    <span className="text-[9px] text-slate-500 font-mono block">(~+{ganDiariaEst.toFixed(0)} {wRev.moneda}/día)</span>
                  </div>
                </div>

                {!revisionTnaForm.cambio ? (
                  <div className="space-y-2.5 pt-1">
                    <p className="text-xs text-center text-slate-300 font-bold">¿Cambió el porcentaje de interés anual de {wRev.nombre}?</p>
                    <button type="button" onClick={() => confirmarRevisionTnaSemanal(null, false)} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition text-xs">
                      <i className="fa-solid fa-check mr-1.5"></i>No cambió (Sigue en {tnaActual}%)
                    </button>
                    <button type="button" onClick={() => setRevisionTnaForm({ cambio: true, nuevaTna: String(tnaActual), saldoReal: String(wRev.monto) })} className="w-full bg-slate-800 hover:bg-amber-600 text-amber-300 hover:text-white border border-amber-500/40 font-bold py-2.5 rounded-xl transition text-xs">
                      <i className="fa-solid fa-pen mr-1.5"></i>Sí, cambió la tasa (y actualizar saldo)
                    </button>
                  </div>
                ) : (
                  <form onSubmit={(e) => confirmarRevisionTnaSemanal(e, true)} className="space-y-3 pt-1 fade-in">
                    <div>
                      <label className="text-[10px] font-bold text-amber-400 uppercase block mb-1">1. Nueva Tasa Anual (% TNA)</label>
                      <input type="number" step="any" min="0" required autoFocus placeholder="Ej: 34.5 (0 para desactivar)" value={revisionTnaForm.nuevaTna} onChange={e => setRevisionTnaForm({...revisionTnaForm, nuevaTna: e.target.value})} className="w-full bg-slate-950 border border-amber-500 rounded-xl px-3 py-2 text-white font-mono text-sm focus:outline-none" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-emerald-400 uppercase block mb-1">2. ¿Cuánto tenés hoy realmente en {wRev.nombre} ({wRev.moneda})?</label>
                      <input type="number" step="any" min="0" required placeholder="Saldo exacto en la app" value={revisionTnaForm.saldoReal} onChange={e => setRevisionTnaForm({...revisionTnaForm, saldoReal: e.target.value})} className="w-full bg-slate-950 border border-emerald-500 rounded-xl px-3 py-2 text-emerald-400 font-mono font-black text-sm focus:outline-none" />
                    </div>
                    <div className="flex gap-2 pt-1">
                      <button type="submit" className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition text-xs">Guardar Tasa y Saldo</button>
                      <button type="button" onClick={() => setRevisionTnaForm({ cambio: false, nuevaTna: '', saldoReal: '' })} className="bg-slate-800 text-white font-bold px-3 py-2.5 rounded-xl text-xs">Volver</button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          );
      }
      return (
        <div className="flex altura-dinamica bg-slate-950 text-slate-100 overflow-hidden font-sans text-sm w-full">
          
          {menuAbierto && <div className="md:hidden fixed inset-0 bg-slate-950/80 z-40 backdrop-blur-xs" onClick={() => setMenuAbierto(false)}></div>}

          {/* BARRA LATERAL COMPACTA Y AUTO-AJUSTABLE */}
          <aside className={`fixed md:static inset-y-0 left-0 z-50 w-56 altura-dinamica bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 transform transition-transform duration-200 ease-in-out ${menuAbierto ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0`}>
            <div className="p-4 border-b border-slate-800 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white text-sm shadow-md"><i className="fa-solid fa-bolt"></i></div>
                <div>
                  <h1 className="font-black text-sm text-white leading-tight">Bruno</h1>

                </div>

              <button onClick={() => setMenuAbierto(false)} className="md:hidden text-slate-400 hover:text-white text-xl px-1"><i className="fa-solid fa-xmark"></i></button>
            </div>
            
            <nav className="flex-1 p-3 space-y-1 overflow-y-auto hide-scrollbar">
              <button onClick={() => {setVista('patrimonio'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'patrimonio' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-scale-balanced w-4 text-center"></i> Patrimonio Real</button>
              <button onClick={() => {setVista('gastos'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'gastos' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-chart-pie w-4 text-center"></i> Gastos y Análisis</button>
              
              <div className="pt-2 mt-2 border-t border-slate-800/60 space-y-1">
                <button onClick={() => {setVista('ventas'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'ventas' ? 'bg-emerald-500 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-cash-register w-4 text-center"></i> Ventas de Equipos</button>
                <button onClick={() => {setVista('taller'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'taller' ? 'bg-cyan-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-microchip w-4 text-center"></i> Taller Ingresos</button>
                <button onClick={() => {setVista('reparacionesFin'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'reparacionesFin' ? 'bg-cyan-700 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-clipboard-check w-4 text-center"></i> Reparaciones Histórico</button>
                <button onClick={() => {setVista('garantias'); setMenuAbierto(false);}} className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'garantias' ? 'bg-teal-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                  <span className="flex items-center gap-2.5"><i className="fa-solid fa-shield-virus w-4 text-center"></i> Garantías y RMA</span>
                  {(db.rmaProveedores || []).length > 0 && <span className="bg-amber-500 text-slate-950 font-black px-1.5 py-0.2 rounded-full text-[10px]">{(db.rmaProveedores || []).length}</span>}
                </button>

              <div className="pt-2 mt-2 border-t border-slate-800/60 space-y-1">
                <button onClick={() => {setVista('cobrar'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'cobrar' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-hand-holding-dollar w-4 text-center"></i> Cuentas a Cobrar</button>
                <button onClick={() => {setVista('deudas'); setMenuAbierto(false);}} className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'deudas' ? 'bg-rose-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}><i className="fa-solid fa-handshake w-4 text-center"></i> Deudas a Otros</button>
              </div>

              <div className="pt-2 mt-2 border-t border-slate-800/60 space-y-1">
                <button onClick={() => {setVista('stock'); setMenuAbierto(false);}} className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${vista === 'stock' ? 'bg-amber-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                  <span className="flex items-center gap-2.5"><i className="fa-solid fa-boxes-stacked w-4 text-center"></i> Stock Repuestos</span>
                  {stockCriticoCount > 0 && <span className="bg-rose-600 text-white font-black px-1.5 py-0.2 rounded-full text-[10px]">{stockCriticoCount}</span>}
                </button>
