<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrimonio Cloud - Bruno</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen text-sm selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, Component } = React;

    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { hasError: false, errorInfo: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, errorInfo: error.message }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex h-screen items-center justify-center p-4">
              <div className="bg-rose-950 border border-rose-500 p-6 rounded-xl text-center max-w-sm">
                <h1 className="text-white font-bold mb-2">Error Visual</h1>
                <p className="text-rose-300 text-xs mb-4">{this.state.errorInfo}</p>
                <button onClick={() => window.location.reload()} className="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-lg font-bold">Recargar App</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ==========================================
    // 1. CONEXIÓN A BASE DE DATOS
    // ==========================================
    const SUPABASE_URL = "https://nbluvlbsuvmkcaflmjei.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IuVcRy48mLa5P02gRC7B_Q_tI3C6Wuk";
    
    let supaClient = null;
    try {
      if (window.supabase) supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (err) { console.error("Error iniciando Supabase:", err); }

    const DB_TEMPLATE = { cotizacionDolar: 1500, activos: [], gastosFijos: [], gastosPuntuales: [], deudas: [], stock: [] };

    function App() {
      const [isLoaded, setIsLoaded] = useState(false);
      const [sesion, setSesion] = useState(false);
      const [passInput, setPassInput] = useState('');
      const [errorLogin, setErrorLogin] = useState('');

      const [db, setDb] = useState(DB_TEMPLATE);
      const [vista, setVista] = useState('patrimonio');

      // ESTADOS DE FORMULARIOS
      const [nuevoActivo, setNuevoActivo] = useState({ nombre: '', monto: '', moneda: 'USD', tipo: 'billetera' });
      const [nuevoGastoPuntual, setNuevoGastoPuntual] = useState({ concepto: '', monto: '', moneda: 'ARS', walletId: '' });
      const [mostrarInputConceptoLibre, setMostrarInputConceptoLibre] = useState(false);
      const [nuevoGastoFijo, setNuevoGastoFijo] = useState({ concepto: '', monto: '', moneda: 'ARS', tipo: 'fijo', cuotasTotales: '3', diaVencimiento: '1' });
      const [nuevaDeuda, setNuevaDeuda] = useState({ acreedor: '', monto: '', moneda: 'USD' });
      
      // ESTADOS DEL NUEVO STOCK
      const [nuevoStock, setNuevoStock] = useState({ concepto: '', cantidad: '1', monto: '', moneda: 'USD' });
      const [mostrarInputStockLibre, setMostrarInputStockLibre] = useState(false);

      // ESTADOS UI
      const [editandoDolar, setEditandoDolar] = useState(false);
      const [dolarInput, setDolarInput] = useState('');
      const [pagoActivo, setPagoActivo] = useState({ idGasto: null, walletId: '' });
      const [pagoDeudaActivo, setPagoDeudaActivo] = useState({ idDeuda: null, walletId: '', montoAbono: '' });
      
      const [editandoActivo, setEditandoActivo] = useState(null);
      const [editandoFijo, setEditandoFijo] = useState(null);
      const [editandoDeuda, setEditandoDeuda] = useState(null);
      const [editandoStock, setEditandoStock] = useState(null);

      // MEMORIAS DE CONCEPTOS (AUTOCOMPLETADO)
      const opcionesConcepto = useMemo(() => {
        const defaults = ['Kiosco', 'Uber / Taxi', 'Comida / Delivery', 'Fútbol / Deportes', 'Supermercado', 'Combustible'];
        const historicos = (db.gastosPuntuales || []).map(g => g.concepto);
        return [...new Set([...defaults, ...historicos])];
      }, [db.gastosPuntuales]);

      const opcionesStock = useMemo(() => {
        const defaults = ['Batería iPhone 11', 'Batería iPhone 12', 'Batería iPhone 13', 'Módulo iPhone 11', 'Templado'];
        const historicos = (db.stock || []).map(s => s.concepto);
        return [...new Set([...defaults, ...historicos])];
      }, [db.stock]);

      const billeterasDisponibles = useMemo(() => {
        return (db.activos || []).filter(a => a.tipo !== 'activo');
      }, [db.activos]);

      // ==========================================
      // 2. LECTURA Y ESCRITURA NUBE
      // ==========================================
      useEffect(() => {
        async function fetchNube() {
          if (!supaClient) { setIsLoaded(true); return; }
          try {
            const { data, error } = await supaClient.from('iconnecture_data').select('payload').eq('id', 1).single();
            if (error) throw error;
            if (data && data.payload) {
              setDb({
                cotizacionDolar: data.payload.cotizacionDolar || 1500,
                activos: Array.isArray(data.payload.activos) ? data.payload.activos.filter(Boolean) : [],
                gastosFijos: Array.isArray(data.payload.gastosFijos) ? data.payload.gastosFijos.filter(Boolean) : [],
                gastosPuntuales: Array.isArray(data.payload.gastosPuntuales) ? data.payload.gastosPuntuales.filter(Boolean) : [],
                deudas: Array.isArray(data.payload.deudas) ? data.payload.deudas.filter(Boolean) : [],
                stock: Array.isArray(data.payload.stock) ? data.payload.stock.filter(Boolean) : []
              });
            }
          } catch (err) { console.error("Iniciando de cero."); }
          setIsLoaded(true);
        }
        fetchNube();
      }, []);

      const guardarEnNube = async (nuevoEstadoDb) => {
        setDb(nuevoEstadoDb);
        if (supaClient) {
          const { error } = await supaClient.from('iconnecture_data').update({ payload: nuevoEstadoDb }).eq('id', 1);
          if (error) alert("Atención: No se pudo guardar en la nube. Revisá tu conexión.");
        }
      };

      const login = (e) => {
        e.preventDefault();
        if (passInput === 'bruno123') { setSesion(true); setErrorLogin(''); }
        else { setErrorLogin('Clave incorrecta'); setPassInput(''); }
      };

      const calcularUSD = (monto, moneda) => {
        const val = parseFloat(monto) || 0;
        return moneda === 'USD' ? val : val / db.cotizacionDolar;
      };

      const formatDinero = (montoUSD) => {
        return `$ ${parseFloat(montoUSD || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD`;
      };

      // ==========================================
      // LÓGICA DE NEGOCIO: DESCUENTO SEGURO
      // ==========================================
      const procesarDescuentoSeguro = (walletId, montoGasto, monedaGasto) => {
        const activosClon = [...db.activos];
        const idx = activosClon.findIndex(w => w.id === parseInt(walletId));
        if (idx === -1) return { success: false, msg: 'Billetera no encontrada' };
        
        const wallet = activosClon[idx];
        let montoARestar = parseFloat(montoGasto);
        
        if (monedaGasto === 'ARS' && wallet.moneda === 'USD') montoARestar = montoARestar / db.cotizacionDolar;
        if (monedaGasto === 'USD' && wallet.moneda === 'ARS') montoARestar = montoARestar * db.cotizacionDolar;
        
        if (parseFloat(wallet.monto) < montoARestar) {
            return { 
                success: false, 
                msg: `¡Operación rechazada! Saldo insuficiente en ${wallet.nombre}.\nTenés ${wallet.monto} ${wallet.moneda} e intentás descontar el equivalente a ${montoARestar.toFixed(2)} ${wallet.moneda}.`
            };
        }
        
        activosClon[idx].monto = (parseFloat(wallet.monto) - montoARestar).toFixed(2);
        return { success: true, activosActualizados: activosClon };
      };

      // --- HANDLERS PATRIMONIO ---
      const agregarActivo = (e) => {
        e.preventDefault();
        const item = { id: Date.now(), nombre: nuevoActivo.nombre, monto: parseFloat(nuevoActivo.monto) || 0, moneda: nuevoActivo.moneda, tipo: nuevoActivo.tipo };
        guardarEnNube({ ...db, activos: [item, ...db.activos] });
        setNuevoActivo({ nombre: '', monto: '', moneda: 'USD', tipo: 'billetera' });
      };

      const agregarGastoPuntual = (e) => {
        e.preventDefault();
        if (!nuevoGastoPuntual.walletId) return alert('Por favor, seleccioná de qué billetera salió el dinero.');
        if (!nuevoGastoPuntual.concepto) return alert('Ingresá el concepto del gasto.');
        if (billeterasDisponibles.length === 0) return alert('Primero tenés que crear una Billetera (Los activos físicos no sirven para pagar).');

        const operacion = procesarDescuentoSeguro(nuevoGastoPuntual.walletId, nuevoGastoPuntual.monto, nuevoGastoPuntual.moneda);
        if (!operacion.success) { return alert(operacion.msg); }
        
        const walletUsada = db.activos.find(w => w.id === parseInt(nuevoGastoPuntual.walletId));
        const item = { id: Date.now(), concepto: nuevoGastoPuntual.concepto, monto: parseFloat(nuevoGastoPuntual.monto) || 0, moneda: nuevoGastoPuntual.moneda, fecha: new Date().toLocaleDateString(), pagadoCon: walletUsada?.nombre || 'Desconocido' };

        guardarEnNube({ ...db, activos: operacion.activosActualizados, gastosPuntuales: [item, ...(db.gastosPuntuales || [])] });
        setNuevoGastoPuntual({ concepto: '', monto: '', moneda: 'ARS', walletId: nuevoGastoPuntual.walletId });
        setMostrarInputConceptoLibre(false);
      };

      const agregarGastoFijo = (e) => {
        e.preventDefault();
        const item = { 
          id: Date.now(), concepto: nuevoGastoFijo.concepto, monto: parseFloat(nuevoGastoFijo.monto) || 0, moneda: nuevoGastoFijo.moneda, tipo: nuevoGastoFijo.tipo, diaVencimiento: nuevoGastoFijo.diaVencimiento,
          cuotasTotales: nuevoGastoFijo.tipo === 'cuotas' ? parseInt(nuevoGastoFijo.cuotasTotales) || 1 : null, cuotasPagadas: nuevoGastoFijo.tipo === 'cuotas' ? 0 : null, ultimoPago: null
        };
        guardarEnNube({ ...db, gastosFijos: [item, ...(db.gastosFijos || [])] });
        setNuevoGastoFijo({ concepto: '', monto: '', moneda: 'ARS', tipo: 'fijo', cuotasTotales: '3', diaVencimiento: '1' });
      };

      const procesarPagoFijo = (itemFijo) => {
        if (!pagoActivo.walletId) return alert('Elegí una billetera para descontar el pago.');
        const operacion = procesarDescuentoSeguro(pagoActivo.walletId, itemFijo.monto, itemFijo.moneda);
        if (!operacion.success) { return alert(operacion.msg); }
        
        const gastosFijosActualizados = db.gastosFijos.map(g => {
          if (g.id === itemFijo.id) {
            return { ...g, cuotasPagadas: g.tipo === 'cuotas' ? g.cuotasPagadas + 1 : g.cuotasPagadas, ultimoPago: new Date().toLocaleDateString() };
          }
          return g;
        });
        guardarEnNube({ ...db, activos: operacion.activosActualizados, gastosFijos: gastosFijosActualizados });
        setPagoActivo({ idGasto: null, walletId: '' }); 
      };

      // --- HANDLERS DEUDAS ---
      const agregarDeuda = (e) => {
        e.preventDefault();
        const montoNuevo = parseFloat(nuevaDeuda.monto) || 0;
        
        // SUMATORIA AUTOMÁTICA: Si la deuda con la misma persona y moneda ya existe, la sumamos.
        let deudasActualizadas = [...(db.deudas || [])];
        const idxExistente = deudasActualizadas.findIndex(d => 
          d.acreedor.trim().toLowerCase() === nuevaDeuda.acreedor.trim().toLowerCase() && 
          d.moneda === nuevaDeuda.moneda
        );

        if (idxExistente !== -1) {
          deudasActualizadas[idxExistente].monto = (parseFloat(deudasActualizadas[idxExistente].monto) + montoNuevo).toFixed(2);
        } else {
          const item = { id: Date.now(), acreedor: nuevaDeuda.acreedor.trim(), monto: montoNuevo.toFixed(2), moneda: nuevaDeuda.moneda, fecha: new Date().toLocaleDateString() };
          deudasActualizadas.unshift(item);
        }
        
        guardarEnNube({ ...db, deudas: deudasActualizadas });
        setNuevaDeuda({ acreedor: '', monto: '', moneda: 'USD' });
      };

      const procesarPagoDeuda = (itemDeuda) => {
        if (!pagoDeudaActivo.walletId) return alert('Elegí una billetera para descontar el pago.');
        const abono = parseFloat(pagoDeudaActivo.montoAbono);
        if (!abono || abono <= 0) return alert('Ingresá un monto válido a abonar.');
        if (abono > parseFloat(itemDeuda.monto)) return alert('No podés abonar más dinero del que debés.');

        const operacion = procesarDescuentoSeguro(pagoDeudaActivo.walletId, abono, itemDeuda.moneda);
        if (!operacion.success) { return alert(operacion.msg); }

        const nuevoMontoDeuda = parseFloat(itemDeuda.monto) - abono;
        let deudasActualizadas = [];
        
        if (nuevoMontoDeuda <= 0.05) {
            deudasActualizadas = (db.deudas || []).filter(d => d.id !== itemDeuda.id);
        } else {
            deudasActualizadas = (db.deudas || []).map(d => d.id === itemDeuda.id ? { ...d, monto: nuevoMontoDeuda.toFixed(2) } : d);
        }

        guardarEnNube({ ...db, activos: operacion.activosActualizados, deudas: deudasActualizadas });
        setPagoDeudaActivo({ idDeuda: null, walletId: '', montoAbono: '' });
      };

      // --- HANDLERS STOCK ---
      const agregarStock = (e) => {
        e.preventDefault();
        if (!nuevoStock.concepto) return alert('Ingresá el concepto del repuesto.');
        
        let stockActualizado = [...(db.stock || [])];
        const idx = stockActualizado.findIndex(s => s.concepto.toLowerCase().trim() === nuevoStock.concepto.toLowerCase().trim());
        
        if (idx !== -1) {
          // Si el repuesto ya existe, solo sumamos la cantidad y actualizamos el costo
          stockActualizado[idx].cantidad = parseInt(stockActualizado[idx].cantidad) + parseInt(nuevoStock.cantidad);
          stockActualizado[idx].monto = parseFloat(nuevoStock.monto) || 0;
          stockActualizado[idx].moneda = nuevoStock.moneda;
        } else {
          // Si no existe, creamos el renglón nuevo
          const item = { id: Date.now(), concepto: nuevoStock.concepto.trim(), cantidad: parseInt(nuevoStock.cantidad) || 1, monto: parseFloat(nuevoStock.monto) || 0, moneda: nuevoStock.moneda };
          stockActualizado.unshift(item);
        }
        
        guardarEnNube({ ...db, stock: stockActualizado });
        setNuevoStock({ concepto: '', cantidad: '1', monto: '', moneda: 'USD' });
        setMostrarInputStockLibre(false);
      };

      const modificarCantidadStock = (id, delta) => {
        const stockActualizado = (db.stock || []).map(s => {
          if (s.id === id) {
            const nuevaCant = Math.max(0, parseInt(s.cantidad) + delta);
            return { ...s, cantidad: nuevaCant };
          }
          return s;
        });
        guardarEnNube({ ...db, stock: stockActualizado });
      };

      // --- CÁLCULOS TOTALES ---
      const totalBilleterasYActivosUSD = (db.activos || []).reduce((acc, item) => acc + calcularUSD(item.monto, item.moneda), 0);
      const totalGastosFijosUSD = (db.gastosFijos || []).reduce((acc, item) => acc + calcularUSD(item.monto, item.moneda), 0);
      const totalGastosPuntualesUSD = (db.gastosPuntuales || []).reduce((acc, item) => acc + calcularUSD(item.monto, item.moneda), 0);
      const totalDeudasPendientesUSD = (db.deudas || []).reduce((acc, item) => acc + calcularUSD(item.monto, item.moneda), 0);
      const totalStockUSD = (db.stock || []).reduce((acc, item) => acc + (calcularUSD(item.monto, item.moneda) * parseInt(item.cantidad)), 0);
      
      const patrimonioNetoRealUSD = totalBilleterasYActivosUSD - totalDeudasPendientesUSD;

      // ==========================================
      // 5. INTERFACES
      // ==========================================
      if (!isLoaded) return <div className="flex h-screen items-center justify-center font-bold text-blue-400 animate-pulse text-xl">Conectando a tu Nube...</div>;

      if (!sesion) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 p-4">
            <form onSubmit={login} className="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-sm w-full space-y-6 shadow-2xl fade-in">
              <div className="text-center space-y-2">
                <i className="fa-solid fa-fingerprint text-5xl text-blue-500 mb-3"></i>
                <h1 className="text-3xl font-black text-white">Patrimonio</h1>
                <p className="text-slate-400 text-sm font-bold tracking-widest uppercase">Acceso Privado</p>
              </div>
              <div>
                <input type="password" required placeholder="Tu clave..." value={passInput} onChange={e => {setPassInput(e.target.value); setErrorLogin('');}} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-4 text-center text-2xl font-mono text-white tracking-widest focus:outline-none focus:border-blue-500" />
                {errorLogin && <p className="text-rose-400 text-xs font-bold text-center mt-3">{errorLogin}</p>}
              </div>
              <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition text-base">Desbloquear</button>
            </form>
          </div>
        );
      }

      return (
        <div className="flex flex-col md:flex-row h-screen bg-slate-950 text-slate-100 overflow-hidden font-sans text-sm">
          
          {/* ============================================== */}
          {/* BARRA LATERAL (MENU) */}
          {/* ============================================== */}
          <aside className="w-full md:w-64 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 z-10">
            <div className="p-6 border-b border-slate-800 flex items-center gap-4">
              <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white text-xl shadow-lg"><i className="fa-solid fa-bolt"></i></div>
              <div>
                <h1 className="font-black text-base text-white leading-tight">Bruno</h1>
                <p className="text-[10px] text-blue-400 font-bold uppercase tracking-widest">Nube Activa</p>
              </div>
            </div>
            
            <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
              <button onClick={() => setVista('patrimonio')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${vista === 'patrimonio' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                <i className="fa-solid fa-wallet w-5 text-center"></i> Patrimonio y Gastos
              </button>
              <button onClick={() => setVista('deudas')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${vista === 'deudas' ? 'bg-rose-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                <i className="fa-solid fa-handshake w-5 text-center"></i> Deudas / Pasivos
              </button>
              <button onClick={() => setVista('stock')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${vista === 'stock' ? 'bg-amber-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                <i className="fa-solid fa-boxes-stacked w-5 text-center"></i> Stock Repuestos
              </button>
            </nav>

            <div className="p-4 border-t border-slate-800 text-center">
              <div className="bg-slate-950 border border-slate-800 rounded-xl p-3">
                <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Cotización Dólar</p>
                {!editandoDolar ? (
                  <div className="flex items-center justify-center gap-2">
                    <span className="text-lg font-black text-emerald-400">${db.cotizacionDolar}</span>
                    <button onClick={() => { setDolarInput(db.cotizacionDolar); setEditandoDolar(true); }} className="text-slate-500 hover:text-white"><i className="fa-solid fa-pen text-xs"></i></button>
                  </div>
                ) : (
                  <div className="flex items-center gap-1 mt-1 justify-center">
                    <input type="number" value={dolarInput} onChange={e => setDolarInput(e.target.value)} className="w-16 bg-slate-900 border border-emerald-500 rounded px-1.5 py-1 text-white font-mono text-sm focus:outline-none text-center" />
                    <button onClick={() => { guardarEnNube({...db, cotizacionDolar: parseFloat(dolarInput) || 1500}); setEditandoDolar(false); }} className="bg-emerald-600 text-white px-2 py-1 rounded font-bold text-xs">Ok</button>
                  </div>
                )}
              </div>
            </div>
          </aside>

          {/* ============================================== */}
          {/* CONTENIDO PRINCIPAL */}
          {/* ============================================== */}
          <main className="flex-1 overflow-y-auto p-4 md:p-8 relative fade-in hide-scrollbar">
            
            {/* ----------------------------------------------------- */}
            {/* VISTA 1: PATRIMONIO Y GASTOS                          */}
            {/* ----------------------------------------------------- */}
            {vista === 'patrimonio' && (
              <div className="max-w-6xl mx-auto space-y-8 pb-20 fade-in">
                
                {/* DASHBOARD DE TOTALES */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="bg-gradient-to-br from-blue-900/40 to-slate-900 border border-blue-500/30 rounded-3xl p-6 shadow-xl relative overflow-hidden">
                    <p className="text-xs font-bold text-blue-400 uppercase tracking-widest mb-3 relative z-10"><i className="fa-solid fa-scale-balanced mr-2"></i>Patrimonio Neto Real</p>
                    <h2 className={`text-4xl font-black relative z-10 ${patrimonioNetoRealUSD >= 0 ? 'text-white' : 'text-rose-400'}`}>
                      {patrimonioNetoRealUSD < 0 ? '-' : ''}{formatDinero(Math.abs(patrimonioNetoRealUSD))}
                    </h2>
                    <p className="text-slate-400 text-[10px] uppercase font-bold mt-2 relative z-10">Billeteras & Activos - Deudas</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">

                  <p className="text-sm font-bold text-amber-400 uppercase tracking-widest mb-3"><i className="fa-solid fa-boxes-stacked mr-2"></i>Capital Físico en Stock</p>
                  <h2 className="text-5xl font-black text-white">{formatDinero(totalStockUSD)}</h2>
                  <p className="text-slate-400 text-xs font-mono mt-3">Eq: ${(totalStockUSD * db.cotizacionDolar).toLocaleString('es-AR')} ARS</p>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6 shadow-xl">
                  <div className="border-b border-slate-800 pb-3">
                    <h3 className="text-lg font-bold text-white">Ingresar Repuestos</h3>
                    <p className="text-xs text-slate-400 mt-1">Si el repuesto ya existe en la lista, se suma la cantidad automáticamente.</p>
                  </div>
                  
                  <form onSubmit={agregarStock} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-inner">
                    <div className="flex gap-2">
                      {!mostrarInputStockLibre ? (
                        <select value={nuevoStock.concepto} onChange={e => {
                            if (e.target.value === 'OTRO') { setMostrarInputStockLibre(true); setNuevoStock({...nuevoStock, concepto: ''}); }
                            else setNuevoStock({...nuevoStock, concepto: e.target.value});
                        }} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white text-sm focus:outline-none focus:border-amber-500 appearance-none">
                          <option value="">-- Seleccionar de memoria --</option>
                          {opcionesStock.map(op => <option key={op} value={op}>{op}</option>)}
                          <option value="OTRO" className="font-bold text-amber-400">➕ Escribir concepto nuevo...</option>
                        </select>
                      ) : (
                        <div className="w-full flex gap-2 fade-in">
                          <input type="text" required autoFocus placeholder="Ej: Batería iPhone 15 Pro..." value={nuevoStock.concepto} onChange={e => setNuevoStock({...nuevoStock, concepto: e.target.value})} className="flex-1 bg-slate-900 border border-amber-500 rounded-xl px-4 py-3 text-white focus:outline-none text-sm" />
                          <button type="button" onClick={() => {setMostrarInputStockLibre(false); setNuevoStock({...nuevoStock, concepto: ''});}} className="bg-slate-800 text-white px-4 py-3 rounded-xl"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                      )}
                    </div>

                    <div className="flex gap-2">
                      <input type="number" min="1" required placeholder="Cant." value={nuevoStock.cantidad} onChange={e => setNuevoStock({...nuevoStock, cantidad: e.target.value})} className="w-24 bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white font-mono focus:outline-none focus:border-amber-500 text-center" title="Cantidad" />
                      <input type="number" step="any" required placeholder="Costo Unitario" value={nuevoStock.monto} onChange={e => setNuevoStock({...nuevoStock, monto: e.target.value})} className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono focus:outline-none focus:border-amber-500" />
                      <select value={nuevoStock.moneda} onChange={e => setNuevoStock({...nuevoStock, moneda: e.target.value})} className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white font-bold focus:outline-none focus:border-amber-500"><option value="USD">USD</option><option value="ARS">ARS</option></select>
                      <button type="submit" className="bg-amber-600 hover:bg-amber-500 text-white font-bold px-6 py-3 rounded-xl transition"><i className="fa-solid fa-plus"></i></button>
                    </div>
                  </form>

                  <div className="space-y-3 pt-4">
                    {(db.stock || []).length === 0 ? <p className="text-center text-slate-500 py-6 text-sm font-bold border-2 border-dashed border-slate-800 rounded-xl">Sin repuestos en stock.</p> : db.stock.map(item => (
                      <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex flex-col md:flex-row justify-between items-center gap-4 hover:border-slate-700 transition">
                        
                        <div className="flex-1 w-full flex justify-between items-center md:block">
                          <p className="font-bold text-white text-base">{item.concepto}</p>
                          <p className="text-[11px] text-slate-500 font-mono mt-1">Costo Unit: {item.monto} {item.moneda}</p>
                        </div>
                        
                        <div className="flex items-center bg-slate-900 border border-slate-700 rounded-xl overflow-hidden shrink-0">
                          <button onClick={() => modificarCantidadStock(item.id, -1)} className="px-4 py-2 hover:bg-slate-800 text-slate-300 font-bold transition"><i className="fa-solid fa-minus text-xs"></i></button>
                          <span className="px-4 py-2 font-mono font-black text-amber-400 border-x border-slate-700 bg-slate-950 text-base min-w-[50px] text-center">{item.cantidad}</span>
                          <button onClick={() => modificarCantidadStock(item.id, 1)} className="px-4 py-2 hover:bg-slate-800 text-slate-300 font-bold transition"><i className="fa-solid fa-plus text-xs"></i></button>
                        </div>

                        <div className="flex items-center gap-2 shrink-0">
                          <button onClick={() => setEditandoStock({...item})} className="bg-slate-800 hover:bg-slate-700 text-slate-300 w-9 h-9 rounded-lg transition-colors"><i className="fa-solid fa-pen text-xs"></i></button>
                          <button onClick={() => guardarEnNube({...db, stock: db.stock.filter(x => x.id !== item.id)})} className="bg-rose-950 hover:bg-rose-900 text-rose-400 w-9 h-9 rounded-lg transition-colors"><i className="fa-solid fa-trash text-xs"></i></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

          </main>
          
          {/* ============================================== */}
          {/* MODALES DE EDICIÓN FLOTANTES */}
          {/* ============================================== */}
          {editandoActivo && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => {
                e.preventDefault();
                const actualizados = db.activos.map(a => a.id === editandoActivo.id ? { ...a, nombre: editandoActivo.nombre, monto: parseFloat(editandoActivo.monto) || 0, moneda: editandoActivo.moneda, tipo: editandoActivo.tipo } : a);
                guardarEnNube({ ...db, activos: actualizados });
                setEditandoActivo(null);
              }} className="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-sm w-full space-y-5 shadow-2xl">
                <h3 className="font-black text-white text-xl border-b border-slate-800 pb-3">Editar Cuenta/Activo</h3>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Tipo de cuenta</label>
                    <select value={editandoActivo.tipo} onChange={e => setEditandoActivo({...editandoActivo, tipo: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-3 text-white font-bold"><option value="billetera">Dinero Líquido / Billetera</option><option value="activo">Objeto / Valor Físico</option></select>
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Nombre</label>
                    <input type="text" required value={editandoActivo.nombre} onChange={e => setEditandoActivo({...editandoActivo, nombre: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Saldo Exacto o Valor</label>
                    <div className="flex gap-2">
                      <input type="number" step="any" required value={editandoActivo.monto} onChange={e => setEditandoActivo({...editandoActivo, monto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono text-lg" />
                      <select value={editandoActivo.moneda} onChange={e => setEditandoActivo({...editandoActivo, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-3 text-white font-bold"><option value="USD">USD</option><option value="ARS">ARS</option></select>
                    </div>
                  </div>
                </div>
                <div className="flex gap-3 pt-2">
                  <button type="submit" className="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition">Guardar</button>
                  <button type="button" onClick={() => setEditandoActivo(null)} className="bg-slate-800 text-white font-bold px-5 py-3 rounded-xl transition">Cancelar</button>
                </div>
              </form>
            </div>
          )}

          {editandoFijo && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => {
                e.preventDefault();
                const actualizados = db.gastosFijos.map(g => g.id === editandoFijo.id ? { ...g, concepto: editandoFijo.concepto, monto: parseFloat(editandoFijo.monto) || 0, moneda: editandoFijo.moneda } : g);
                guardarEnNube({ ...db, gastosFijos: actualizados });
                setEditandoFijo(null);
              }} className="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-sm w-full space-y-5 shadow-2xl">
                <h3 className="font-black text-white text-xl border-b border-slate-800 pb-3">Editar Gasto Fijo</h3>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Concepto (Ej: Gimnasio)</label>
                    <input type="text" required value={editandoFijo.concepto} onChange={e => setEditandoFijo({...editandoFijo, concepto: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Nuevo Precio de la Cuota</label>
                    <div className="flex gap-2">
                      <input type="number" step="any" required value={editandoFijo.monto} onChange={e => setEditandoFijo({...editandoFijo, monto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono text-lg" />
                      <select value={editandoFijo.moneda} onChange={e => setEditandoFijo({...editandoFijo, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-3 text-white font-bold"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                    </div>
                  </div>
                </div>
                <div className="flex gap-3 pt-2">
                  <button type="submit" className="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl transition">Guardar Cambios</button>
                  <button type="button" onClick={() => setEditandoFijo(null)} className="bg-slate-800 text-white font-bold px-5 py-3 rounded-xl transition">Cancelar</button>
                </div>
              </form>
            </div>
          )}

          {editandoDeuda && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => {
                e.preventDefault();
                const actualizadas = db.deudas.map(d => d.id === editandoDeuda.id ? { ...d, acreedor: editandoDeuda.acreedor, monto: parseFloat(editandoDeuda.monto) || 0, moneda: editandoDeuda.moneda } : d);
                guardarEnNube({ ...db, deudas: actualizadas });
                setEditandoDeuda(null);
              }} className="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-sm w-full space-y-5 shadow-2xl">
                <h3 className="font-black text-white text-xl border-b border-slate-800 pb-3">Editar Deuda</h3>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Acreedor / Concepto</label>
                    <input type="text" required value={editandoDeuda.acreedor} onChange={e => setEditandoDeuda({...editandoDeuda, acreedor: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Nuevo Monto Pendiente</label>
                    <div className="flex gap-2">
                      <input type="number" step="any" required value={editandoDeuda.monto} onChange={e => setEditandoDeuda({...editandoDeuda, monto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono text-lg" />
                      <select value={editandoDeuda.moneda} onChange={e => setEditandoDeuda({...editandoDeuda, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-3 text-white font-bold"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                    </div>
                  </div>
                </div>
                <div className="flex gap-3 pt-2">
                  <button type="submit" className="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl transition">Guardar Cambios</button>
                  <button type="button" onClick={() => setEditandoDeuda(null)} className="bg-slate-800 text-white font-bold px-5 py-3 rounded-xl transition">Cancelar</button>
                </div>
              </form>
            </div>
          )}

          {editandoStock && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => {
                e.preventDefault();
                const actualizado = db.stock.map(s => s.id === editandoStock.id ? { ...s, concepto: editandoStock.concepto, monto: parseFloat(editandoStock.monto) || 0, moneda: editandoStock.moneda } : s);
                guardarEnNube({ ...db, stock: actualizado });
                setEditandoStock(null);
              }} className="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-sm w-full space-y-5 shadow-2xl">
                <h3 className="font-black text-white text-xl border-b border-slate-800 pb-3">Editar Repuesto</h3>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Concepto</label>
                    <input type="text" required value={editandoStock.concepto} onChange={e => setEditandoStock({...editandoStock, concepto: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Costo Unitario</label>
                    <div className="flex gap-2">
                      <input type="number" step="any" required value={editandoStock.monto} onChange={e => setEditandoStock({...editandoStock, monto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono text-lg" />
                      <select value={editandoStock.moneda} onChange={e => setEditandoStock({...editandoStock, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-3 text-white font-bold"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                    </div>
                  </div>
                </div>
                <div className="flex gap-3 pt-2">
                  <button type="submit" className="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl transition">Guardar Cambios</button>
                  <button type="button" onClick={() => setEditandoStock(null)} className="bg-slate-800 text-white font-bold px-5 py-3 rounded-xl transition">Cancelar</button>
                </div>
              </form>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
