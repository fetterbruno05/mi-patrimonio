<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrimonio Cloud - Bruno</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen text-sm selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, Component } = React;

    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { hasError: false, errorInfo: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, errorInfo: error.message }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex h-screen items-center justify-center p-4">
              <div className="bg-rose-950 border border-rose-500 p-6 rounded-xl text-center max-w-sm">
                <h1 className="text-white font-bold mb-2">Error Visual</h1>
                <p className="text-rose-300 text-xs mb-4">{this.state.errorInfo}</p>
                <button onClick={() => window.location.reload()} className="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-lg font-bold">Recargar App</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ==========================================
    // 1. CONEXIÓN A BASE DE DATOS
    // ==========================================
    const SUPABASE_URL = "https://nbluvlbsuvmkcaflmjei.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IuVcRy48mLa5P02gRC7B_Q_tI3C6Wuk";
    
    let supaClient = null;
    try {
      if (window.supabase) supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (err) { console.error("Error iniciando Supabase:", err); }

    const DB_TEMPLATE = { cotizacionDolar: 1500, activos: [], gastosFijos: [], gastosPuntuales: [] };

    function App() {
      const [isLoaded, setIsLoaded] = useState(false);
      const [sesion, setSesion] = useState(false);
      const [passInput, setPassInput] = useState('');
      const [errorLogin, setErrorLogin] = useState('');

      const [db, setDb] = useState(DB_TEMPLATE);

      // ESTADOS DE FORMULARIOS Y MEMORIA DE CONCEPTOS
      const [nuevoActivo, setNuevoActivo] = useState({ nombre: '', monto: '', moneda: 'USD' });
      const [nuevoGastoPuntual, setNuevoGastoPuntual] = useState({ concepto: '', monto: '', moneda: 'ARS', walletId: '' });
      const [mostrarInputConceptoLibre, setMostrarInputConceptoLibre] = useState(false); // Para mostrar el input "Otro"
      const [nuevoGastoFijo, setNuevoGastoFijo] = useState({ concepto: '', monto: '', moneda: 'ARS', tipo: 'fijo', cuotasTotales: '3', diaVencimiento: '1' });

      // ESTADOS UI
      const [editandoDolar, setEditandoDolar] = useState(false);
      const [dolarInput, setDolarInput] = useState('');
      const [pagoActivo, setPagoActivo] = useState({ idGasto: null, walletId: '' });
      
      // ESTADOS DE EDICIÓN MODALES
      const [editandoActivo, setEditandoActivo] = useState(null); // Guardará el activo que se está editando
      const [editandoFijo, setEditandoFijo] = useState(null); // Guardará el gasto fijo que se está editando

      // Autocompletado inteligente de Conceptos Historicos
      const opcionesConcepto = useMemo(() => {
        const defaults = ['Kiosco', 'Uber / Taxi', 'Comida / Delivery', 'Fútbol / Deportes', 'Supermercado', 'Combustible'];
        const historicos = db.gastosPuntuales.map(g => g.concepto);
        // Filtramos para que no haya repetidos y queden los más nuevos
        return [...new Set([...defaults, ...historicos])];
      }, [db.gastosPuntuales]);

      // ==========================================
      // 2. LECTURA Y ESCRITURA NUBE
      // ==========================================
      useEffect(() => {
        async function fetchNube() {
          if (!supaClient) { setIsLoaded(true); return; }
          try {
            const { data, error } = await supaClient.from('iconnecture_data').select('payload').eq('id', 1).single();
            if (error) throw error;
            if (data && data.payload) {
              setDb({
                cotizacionDolar: data.payload.cotizacionDolar || 1500,
                activos: Array.isArray(data.payload.activos) ? data.payload.activos.filter(Boolean) : [],
                gastosFijos: Array.isArray(data.payload.gastosFijos) ? data.payload.gastosFijos.filter(Boolean) : [],
                gastosPuntuales: Array.isArray(data.payload.gastosPuntuales) ? data.payload.gastosPuntuales.filter(Boolean) : []
              });
            }
          } catch (err) { console.error("Iniciando de cero."); }
          setIsLoaded(true);
        }
        fetchNube();
      }, []);

      const guardarEnNube = async (nuevoEstadoDb) => {
        setDb(nuevoEstadoDb);
        if (supaClient) {
          const { error } = await supaClient.from('iconnecture_data').update({ payload: nuevoEstadoDb }).eq('id', 1);
          if (error) alert("Atención: No se pudo guardar en la nube. Revisá tu conexión.");
        }
      };

      const login = (e) => {
        e.preventDefault();
        if (passInput === 'bruno123') { setSesion(true); setErrorLogin(''); }
        else { setErrorLogin('Clave incorrecta'); setPassInput(''); }
      };

      const calcularUSD = (monto, moneda) => {
        const val = parseFloat(monto) || 0;
        return moneda === 'USD' ? val : val / db.cotizacionDolar;
      };

      const formatDinero = (montoUSD) => {
        return `$ ${parseFloat(montoUSD || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD`;
      };

      // ==========================================
      // LÓGICA DE NEGOCIO: DESCUENTO CON PROTECCIÓN
      // ==========================================
      const procesarDescuentoSeguro = (walletId, montoGasto, monedaGasto) => {
        const activosClon = [...db.activos];
        const idx = activosClon.findIndex(w => w.id === parseInt(walletId));
        if (idx === -1) return { success: false, msg: 'Billetera no encontrada' };
        
        const wallet = activosClon[idx];
        let montoARestar = parseFloat(montoGasto);
        
        // Inteligencia cambiaria
        if (monedaGasto === 'ARS' && wallet.moneda === 'USD') montoARestar = montoARestar / db.cotizacionDolar;
        if (monedaGasto === 'USD' && wallet.moneda === 'ARS') montoARestar = montoARestar * db.cotizacionDolar;
        
        // PROTECCIÓN DE SALDO NEGATIVO (Validación Lógica)
        if (parseFloat(wallet.monto) < montoARestar) {
            return { 
                success: false, 
                msg: `¡Operación rechazada! Saldo insuficiente en ${wallet.nombre}.\nTenés ${wallet.monto} ${wallet.moneda} e intentás descontar el equivalente a ${montoARestar.toFixed(2)} ${wallet.moneda}.`
            };
        }
        
        activosClon[idx].monto = (parseFloat(wallet.monto) - montoARestar).toFixed(2);
        return { success: true, activosActualizados: activosClon };
      };

      // --- HANDLERS AGREGAR ---
      const agregarActivo = (e) => {
        e.preventDefault();
        const item = { id: Date.now(), nombre: nuevoActivo.nombre, monto: parseFloat(nuevoActivo.monto) || 0, moneda: nuevoActivo.moneda };
        guardarEnNube({ ...db, activos: [item, ...db.activos] });
        setNuevoActivo({ nombre: '', monto: '', moneda: 'USD' });
      };

      const agregarGastoPuntual = (e) => {
        e.preventDefault();
        if (!nuevoGastoPuntual.walletId) return alert('Por favor, seleccioná de qué billetera salió el dinero.');
        if (!nuevoGastoPuntual.concepto) return alert('Ingresá el concepto del gasto.');
        if (db.activos.length === 0) return alert('Primero tenés que crear una Billetera o Activo.');

        // 1. Intento de resta de dinero (si da error, frena la función)
        const operacion = procesarDescuentoSeguro(nuevoGastoPuntual.walletId, nuevoGastoPuntual.monto, nuevoGastoPuntual.moneda);
        if (!operacion.success) { return alert(operacion.msg); }
        
        // 2. Anotamos el gasto
        const walletUsada = db.activos.find(w => w.id === parseInt(nuevoGastoPuntual.walletId));
        const item = { 
          id: Date.now(), concepto: nuevoGastoPuntual.concepto, monto: parseFloat(nuevoGastoPuntual.monto) || 0, 
          moneda: nuevoGastoPuntual.moneda, fecha: new Date().toLocaleDateString(), pagadoCon: walletUsada?.nombre || 'Desconocido'
        };

        guardarEnNube({ ...db, activos: operacion.activosActualizados, gastosPuntuales: [item, ...db.gastosPuntuales] });
        
        // Reseteo inteligente
        setNuevoGastoPuntual({ concepto: '', monto: '', moneda: 'ARS', walletId: nuevoGastoPuntual.walletId }); // Mantiene la última billetera elegida por rapidez
        setMostrarInputConceptoLibre(false);
      };

      const agregarGastoFijo = (e) => {
        e.preventDefault();
        const item = { 
          id: Date.now(), concepto: nuevoGastoFijo.concepto, monto: parseFloat(nuevoGastoFijo.monto) || 0, 
          moneda: nuevoGastoFijo.moneda, tipo: nuevoGastoFijo.tipo, diaVencimiento: nuevoGastoFijo.diaVencimiento,
          cuotasTotales: nuevoGastoFijo.tipo === 'cuotas' ? parseInt(nuevoGastoFijo.cuotasTotales) || 1 : null,
          cuotasPagadas: nuevoGastoFijo.tipo === 'cuotas' ? 0 : null,
          ultimoPago: null
        };
        guardarEnNube({ ...db, gastosFijos: [item, ...db.gastosFijos] });
        setNuevoGastoFijo({ concepto: '', monto: '', moneda: 'ARS', tipo: 'fijo', cuotasTotales: '3', diaVencimiento: '1' });
      };

      const procesarPagoFijo = (itemFijo) => {
        if (!pagoActivo.walletId) return alert('Elegí una billetera para descontar el pago.');
        
        // 1. Intento de resta
        const operacion = procesarDescuentoSeguro(pagoActivo.walletId, itemFijo.monto, itemFijo.moneda);
        if (!operacion.success) { return alert(operacion.msg); }
        
        // 2. Guardamos el pago en la cuota
        const gastosFijosActualizados = db.gastosFijos.map(g => {
          if (g.id === itemFijo.id) {
            return { 
              ...g, 
              cuotasPagadas: g.tipo === 'cuotas' ? g.cuotasPagadas + 1 : g.cuotasPagadas,
              ultimoPago: new Date().toLocaleDateString()
            };
          }
          return g;
        });

        guardarEnNube({ ...db, activos: operacion.activosActualizados, gastosFijos: gastosFijosActualizados });
        setPagoActivo({ idGasto: null, walletId: '' }); 
      };

      // --- CÁLCULOS TOTALES ---
      const totalPatrimonioUSD = db.activos.reduce((acc, item) => acc + calcularUSD(item.monto, item.moneda), 0);
      const totalGastosFijosUSD = db.gastosFijos.reduce((acc, item) => acc + calcularUSD(item.monto, item.moneda), 0);
      const totalGastosPuntualesUSD = db.gastosPuntuales.reduce((acc, item) => acc + calcularUSD(item.monto, item.moneda), 0);

      // ==========================================
      // 5. INTERFACES
      // ==========================================
      if (!isLoaded) return <div className="flex h-screen items-center justify-center font-bold text-blue-400 animate-pulse text-xl">Conectando a tu Nube...</div>;

      if (!sesion) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 p-4">
            <form onSubmit={login} className="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-sm w-full space-y-6 shadow-2xl fade-in">
              <div className="text-center space-y-2">
                <i className="fa-solid fa-fingerprint text-5xl text-blue-500 mb-3"></i>
                <h1 className="text-3xl font-black text-white">Patrimonio</h1>
                <p className="text-slate-400 text-sm font-bold tracking-widest uppercase">Acceso Privado</p>
              </div>
              <div>
                <input type="password" required placeholder="Tu clave..." value={passInput} onChange={e => {setPassInput(e.target.value); setErrorLogin('');}} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-4 text-center text-2xl font-mono text-white tracking-widest focus:outline-none focus:border-blue-500" />
                {errorLogin && <p className="text-rose-400 text-xs font-bold text-center mt-3">{errorLogin}</p>}
              </div>
              <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition text-base">Desbloquear</button>
            </form>
          </div>
        );
      }

      return (
        <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-8 fade-in pb-20 relative">
          
          {/* HEADER Y COTIZACIÓN */}
          <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl">
            <div>
              <h1 className="text-3xl font-black text-white">Mi Patrimonio Central</h1>
              <p className="text-slate-400 text-sm mt-1"><i className="fa-solid fa-cloud text-blue-400 mr-2"></i>Sincronizado y 100% Seguro</p>
            </div>
            
            <div className="flex items-center gap-3 bg-slate-950 p-3 rounded-2xl border border-slate-700">
              <div className="px-3">
                <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Cotización USD</p>
                {!editandoDolar ? (
                  <div className="flex items-center gap-3">
                    <span className="text-xl font-black text-emerald-400">${db.cotizacionDolar}</span>
                    <button onClick={() => { setDolarInput(db.cotizacionDolar); setEditandoDolar(true); }} className="text-slate-400 hover:text-white bg-slate-800 px-2 py-1 rounded"><i className="fa-solid fa-pen text-xs"></i></button>
                  </div>
                ) : (
                  <div className="flex items-center gap-2 mt-1">
                    <input type="number" value={dolarInput} onChange={e => setDolarInput(e.target.value)} className="w-24 bg-slate-900 border border-emerald-500 rounded-lg px-3 py-1.5 text-white font-mono text-base focus:outline-none" />
                    <button onClick={() => { guardarEnNube({...db, cotizacionDolar: parseFloat(dolarInput) || 1500}); setEditandoDolar(false); }} className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-bold text-xs">Ok</button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* DASHBOARD DE TOTALES */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-gradient-to-br from-blue-900/40 to-slate-900 border border-blue-500/30 rounded-3xl p-6 shadow-xl">
              <p className="text-xs font-bold text-blue-400 uppercase tracking-widest mb-3"><i className="fa-solid fa-vault mr-2"></i>Patrimonio Disponible</p>
              <h2 className="text-4xl font-black text-white">{formatDinero(totalPatrimonioUSD)}</h2>
              <p className="text-slate-400 text-xs font-mono mt-3 bg-slate-950/50 inline-block px-3 py-1.5 rounded-lg border border-slate-800">Eq: ${(totalPatrimonioUSD * db.cotizacionDolar).toLocaleString('es-AR')} ARS</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
              <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3"><i className="fa-solid fa-calendar-days mr-2"></i>Carga Fija Mensual</p>
              <h2 className="text-3xl font-black text-amber-400">{formatDinero(totalGastosFijosUSD)}<span className="text-sm text-slate-500 ml-1">/mes</span></h2>
            </div>
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
              <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3"><i className="fa-solid fa-receipt mr-2"></i>Gastos Sueltos Históricos</p>
              <h2 className="text-3xl font-black text-rose-400">{formatDinero(totalGastosPuntualesUSD)}</h2>
            </div>
          </div>

          {/* ÁREAS DE TRABAJO (3 COLUMNAS) */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            {/* 1. ACTIVOS Y BILLETERAS */}
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6 shadow-xl">
              <div className="border-b border-slate-800 pb-3">
                <h3 className="text-lg font-bold text-white"><i className="fa-solid fa-wallet text-blue-400 mr-2"></i>Billeteras y Activos</h3>
                <p className="text-xs text-slate-400 mt-1">Cuentas, efectivo, etc. (El origen de la plata).</p>
              </div>
              
              <form onSubmit={agregarActivo} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-inner">
                <input type="text" required placeholder="Nombre (Ej: Mercadopago)" value={nuevoActivo.nombre} onChange={e => setNuevoActivo({...nuevoActivo, nombre: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500" />
                <div className="flex gap-2">
                  <input type="number" step="any" required placeholder="Saldo inicial" value={nuevoActivo.monto} onChange={e => setNuevoActivo({...nuevoActivo, monto: e.target.value})} className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono focus:outline-none focus:border-blue-500 text-lg" />
                  <select value={nuevoActivo.moneda} onChange={e => setNuevoActivo({...nuevoActivo, moneda: e.target.value})} className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white font-bold focus:outline-none focus:border-blue-500"><option value="USD">USD</option><option value="ARS">ARS</option></select>
                  <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-3 rounded-xl transition"><i className="fa-solid fa-plus"></i></button>
                </div>
              </form>

              <div className="space-y-3">
                {db.activos.length === 0 ? <p className="text-center text-slate-500 py-6 text-sm font-bold border-2 border-dashed border-slate-800 rounded-xl">Sin activos registrados.</p> : db.activos.map(item => (
                  <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex justify-between items-center hover:border-slate-700 transition">
                    <div>
                      <p className="font-bold text-white text-base">{item.nombre}</p>
                      <p className="text-[11px] text-emerald-400 font-bold font-mono mt-1">Saldo: {item.monto} {item.moneda}</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="font-mono font-black text-blue-400 text-lg mr-2">{formatDinero(calcularUSD(item.monto, item.moneda))}</span>
                      {/* BOTÓN PARA EDITAR ACTIVO */}
                      <button onClick={() => setEditandoActivo({...item})} className="bg-slate-800 hover:bg-slate-700 text-slate-300 w-8 h-8 rounded-lg transition-colors"><i className="fa-solid fa-pen text-xs"></i></button>
                      <button onClick={() => guardarEnNube({...db, activos: db.activos.filter(x => x.id !== item.id)})} className="bg-rose-950 hover:bg-rose-900 text-rose-400 w-8 h-8 rounded-lg transition-colors"><i className="fa-solid fa-trash text-xs"></i></button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* 2. GASTOS FIJOS Y CUOTAS */}
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6 shadow-xl">
              <div className="border-b border-slate-800 pb-3">
                <h3 className="text-lg font-bold text-white"><i className="fa-solid fa-calendar-check text-amber-400 mr-2"></i>Fijos y Cuotas</h3>
                <p className="text-xs text-slate-400 mt-1">Se agregan acá y se descuentan al tocarlas.</p>
              </div>

              <form onSubmit={agregarGastoFijo} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-inner">
                <div className="flex gap-2">
                  <input type="text" required placeholder="Concepto (Ej: Gimnasio)" value={nuevoGastoFijo.concepto} onChange={e => setNuevoGastoFijo({...nuevoGastoFijo, concepto: e.target.value})} className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white focus:outline-none focus:border-amber-500" />
                  <select value={nuevoGastoFijo.tipo} onChange={e => setNuevoGastoFijo({...nuevoGastoFijo, tipo: e.target.value})} className="bg-slate-900 border border-slate-700 rounded-xl px-2 py-3 text-white font-bold focus:outline-none focus:border-amber-500"><option value="fijo">Fijo</option><option value="cuotas">Cuotas</option></select>
                </div>
                <div className="flex gap-2">
                  <div className="flex-1 flex border border-slate-700 rounded-xl overflow-hidden bg-slate-900 focus-within:border-amber-500">
                    <input type="number" step="any" required placeholder="Monto" value={nuevoGastoFijo.monto} onChange={e => setNuevoGastoFijo({...nuevoGastoFijo, monto: e.target.value})} className="w-full px-3 py-3 bg-transparent text-white font-mono focus:outline-none" />
                    <select value={nuevoGastoFijo.moneda} onChange={e => setNuevoGastoFijo({...nuevoGastoFijo, moneda: e.target.value})} className="bg-slate-800 px-2 text-white font-bold focus:outline-none"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                  </div>
                  {nuevoGastoFijo.tipo === 'cuotas' ? (
                    <input type="number" required placeholder="Cuotas" value={nuevoGastoFijo.cuotasTotales} onChange={e => setNuevoGastoFijo({...nuevoGastoFijo, cuotasTotales: e.target.value})} className="w-20 bg-slate-900 border border-amber-500 rounded-xl px-3 py-3 text-white font-mono focus:outline-none" />
                  ) : (
                    <input type="number" required min="1" max="31" placeholder="Día" value={nuevoGastoFijo.diaVencimiento} onChange={e => setNuevoGastoFijo({...nuevoGastoFijo, diaVencimiento: e.target.value})} className="w-20 bg-slate-900 border border-amber-500 rounded-xl px-3 py-3 text-white font-mono focus:outline-none" title="Día de vencimiento (1-31)" />
                  )}
                  <button type="submit" className="bg-amber-600 hover:bg-amber-500 text-white font-bold px-4 py-3 rounded-xl transition"><i className="fa-solid fa-plus"></i></button>
                </div>
              </form>

              <div className="space-y-3">
                {db.gastosFijos.length === 0 ? <p className="text-center text-slate-500 py-6 text-sm font-bold border-2 border-dashed border-slate-800 rounded-xl">Sin gastos fijos.</p> : db.gastosFijos.map(item => (
                  <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex flex-col gap-3 hover:border-slate-700 transition">
                    <div className="flex justify-between items-start">
                      <div>
                        <p className="font-bold text-white text-base">
                          {item.concepto} 
                          {item.tipo === 'cuotas' ? 
                            <span className="bg-amber-950 text-amber-400 px-2 py-0.5 rounded border border-amber-800 text-[10px] ml-2">Cuota {item.cuotasPagadas}/{item.cuotasTotales}</span> 
                            : <span className="bg-slate-800 text-slate-400 px-2 py-0.5 rounded text-[9px] ml-2 uppercase">Vence día {item.diaVencimiento}</span>
                          }
                        </p>
                        <p className="text-[11px] text-slate-500 font-mono mt-1">Valor base: {item.monto} {item.moneda}</p>
                        {item.ultimoPago && <p className="text-[10px] text-emerald-500 mt-1"><i className="fa-solid fa-check mr-1"></i>Últ. pago: {item.ultimoPago}</p>}
                      </div>
                      <div className="flex flex-col items-end gap-1">
                        <span className="font-mono font-black text-amber-400 text-lg">-{formatDinero(calcularUSD(item.monto, item.moneda))}</span>
                        <div className="flex gap-1 mt-1">
                          {/* BOTON EDITAR GASTO FIJO */}
                          <button onClick={() => setEditandoFijo({...item})} className="bg-slate-800 text-slate-400 hover:text-white px-2 py-1 rounded text-[9px]"><i className="fa-solid fa-pen"></i> Editar</button>
                          <button onClick={() => guardarEnNube({...db, gastosFijos: db.gastosFijos.filter(x => x.id !== item.id)})} className="bg-rose-950 text-rose-400 hover:bg-rose-900 px-2 py-1 rounded text-[9px]"><i className="fa-solid fa-trash"></i></button>
                        </div>
                      </div>
                    </div>

                    {/* SELECTOR DE PAGO INLINE */}
                    {pagoActivo.idGasto === item.id ? (
                      <div className="bg-slate-900 p-3 rounded-xl border border-amber-500/50 flex gap-2 fade-in">
                        <select value={pagoActivo.walletId} onChange={e => setPagoActivo({...pagoActivo, walletId: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-2 text-xs text-white">
                          <option value="">¿De qué billetera pagás?</option>
                          {db.activos.map(a => <option key={a.id} value={a.id}>{a.nombre} ({a.monto} {a.moneda})</option>)}
                        </select>
                        <button onClick={() => procesarPagoFijo(item)} className="bg-emerald-600 text-white font-bold px-3 py-2 rounded-lg text-xs">Aceptar</button>
                        <button onClick={() => setPagoActivo({idGasto: null, walletId: ''})} className="bg-slate-800 text-white px-3 py-2 rounded-lg text-xs"><i className="fa-solid fa-xmark"></i></button>
                      </div>
                    ) : (
                      <div className="flex justify-end gap-2 border-t border-slate-800/50 pt-2">
                        {(!item.cuotasTotales || item.cuotasPagadas < item.cuotasTotales) && (
                          <button onClick={() => setPagoActivo({ idGasto: item.id, walletId: '' })} className="w-full bg-emerald-950 hover:bg-emerald-900 text-emerald-400 border border-emerald-800 px-3 py-2 rounded-xl text-xs font-bold transition">
                            <i className="fa-solid fa-money-bill-wave mr-1"></i> {item.tipo === 'cuotas' ? 'Descontar Cuota' : 'Descontar este Mes'}
                          </button>
                        )}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>

            {/* 3. GASTOS PUNTUALES */}
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6 shadow-xl">
              <div className="border-b border-slate-800 pb-3">
                <h3 className="text-lg font-bold text-white"><i className="fa-solid fa-cart-shopping text-rose-400 mr-2"></i>Gastos Sueltos</h3>
                <p className="text-xs text-slate-400 mt-1">Se descuentan automáticamente de tu saldo.</p>
              </div>

              <form onSubmit={agregarGastoPuntual} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-inner">
                {/* SELECTOR DE CONCEPTO CON MEMORIA */}
                <div className="flex gap-2">
                  {!mostrarInputConceptoLibre ? (
                    <select value={nuevoGastoPuntual.concepto} onChange={e => {
                        if (e.target.value === 'OTRO') { setMostrarInputConceptoLibre(true); setNuevoGastoPuntual({...nuevoGastoPuntual, concepto: ''}); }
                        else setNuevoGastoPuntual({...nuevoGastoPuntual, concepto: e.target.value});
                    }} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white text-sm focus:outline-none focus:border-rose-500 appearance-none">
                      <option value="">-- Seleccionar categoría / concepto --</option>
                      {opcionesConcepto.map(op => <option key={op} value={op}>{op}</option>)}
                      <option value="OTRO" className="font-bold text-rose-400">➕ Agregar uno nuevo...</option>
                    </select>
                  ) : (
                    <div className="w-full flex gap-2 fade-in">
                      <input type="text" required autoFocus placeholder="Escribí el nuevo concepto..." value={nuevoGastoPuntual.concepto} onChange={e => setNuevoGastoPuntual({...nuevoGastoPuntual, concepto: e.target.value})} className="flex-1 bg-slate-900 border border-rose-500 rounded-xl px-4 py-3 text-white focus:outline-none" />
                      <button type="button" onClick={() => {setMostrarInputConceptoLibre(false); setNuevoGastoPuntual({...nuevoGastoPuntual, concepto: ''});}} className="bg-slate-800 text-white px-4 py-3 rounded-xl"><i className="fa-solid fa-xmark"></i></button>
                    </div>
                  )}
                </div>

                <div className="flex gap-2">
                  <div className="flex-1 flex border border-slate-700 rounded-xl overflow-hidden bg-slate-900 focus-within:border-rose-500">
                    <input type="number" step="any" required placeholder="Monto del gasto" value={nuevoGastoPuntual.monto} onChange={e => setNuevoGastoPuntual({...nuevoGastoPuntual, monto: e.target.value})} className="w-full px-3 py-3 bg-transparent text-white font-mono focus:outline-none text-lg" />
                    <select value={nuevoGastoPuntual.moneda} onChange={e => setNuevoGastoPuntual({...nuevoGastoPuntual, moneda: e.target.value})} className="bg-slate-800 px-2 text-white font-bold focus:outline-none"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                  </div>
                </div>

                {/* SELECTOR DE BILLETERA OBLIGATORIO */}
                <div className="flex gap-2">
                  <select required value={nuevoGastoPuntual.walletId} onChange={e => setNuevoGastoPuntual({...nuevoGastoPuntual, walletId: e.target.value})} className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white text-xs font-bold focus:outline-none focus:border-rose-500">
                    <option value="">¿De qué billetera lo pagás?</option>
                    {db.activos.map(a => <option key={a.id} value={a.id}>💳 {a.nombre} (Disp: {a.monto})</option>)}
                  </select>
                  <button type="submit" className="bg-rose-600 hover:bg-rose-500 text-white font-bold px-5 py-3 rounded-xl transition"><i className="fa-solid fa-plus"></i></button>
                </div>
              </form>

              <div className="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                {db.gastosPuntuales.length === 0 ? <p className="text-center text-slate-500 py-6 text-sm font-bold border-2 border-dashed border-slate-800 rounded-xl">Sin gastos diarios.</p> : db.gastosPuntuales.map(item => (
                  <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex justify-between items-center hover:border-slate-700 transition">
                    <div>
                      <p className="font-bold text-white text-base">{item.concepto}</p>
                      <p className="text-[11px] text-slate-500 mt-1">{item.fecha} • {item.monto} {item.moneda}</p>
                      <p className="text-[9px] font-bold text-rose-500/70 uppercase mt-0.5">Dinero salió de: {item.pagadoCon}</p>
                    </div>
                    <div className="flex items-center gap-4">
                      <span className="font-mono font-black text-rose-400 text-lg">-{formatDinero(calcularUSD(item.monto, item.moneda))}</span>
                      <button onClick={() => guardarEnNube({...db, gastosPuntuales: db.gastosPuntuales.filter(x => x.id !== item.id)})} className="text-slate-600 hover:text-rose-400 transition-colors p-2"><i className="fa-solid fa-trash"></i></button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

          </div>
          
          {/* ============================================== */}
          {/* MODALES DE EDICIÓN FLOTANTES */}
          {/* ============================================== */}
          
          {/* Modal Edición Activo/Billetera */}
          {editandoActivo && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => {
                e.preventDefault();
                const actualizados = db.activos.map(a => a.id === editandoActivo.id ? { ...a, nombre: editandoActivo.nombre, monto: parseFloat(editandoActivo.monto) || 0, moneda: editandoActivo.moneda } : a);
                guardarEnNube({ ...db, activos: actualizados });
                setEditandoActivo(null);
              }} className="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-sm w-full space-y-5 shadow-2xl">
                <h3 className="font-black text-white text-xl border-b border-slate-800 pb-3">Editar Billetera</h3>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Nombre de la Billetera</label>
                    <input type="text" required value={editandoActivo.nombre} onChange={e => setEditandoActivo({...editandoActivo, nombre: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Nuevo Saldo Total</label>
                    <div className="flex gap-2">
                      <input type="number" step="any" required value={editandoActivo.monto} onChange={e => setEditandoActivo({...editandoActivo, monto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono text-lg" />
                      <select value={editandoActivo.moneda} onChange={e => setEditandoActivo({...editandoActivo, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-3 text-white font-bold"><option value="USD">USD</option><option value="ARS">ARS</option></select>
                    </div>
                  </div>
                </div>
                <div className="flex gap-3 pt-2">
                  <button type="submit" className="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition">Guardar</button>
                  <button type="button" onClick={() => setEditandoActivo(null)} className="bg-slate-800 text-white font-bold px-5 py-3 rounded-xl transition">Cancelar</button>
                </div>
              </form>
            </div>
          )}

          {/* Modal Edición Gasto Fijo */}
          {editandoFijo && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => {
                e.preventDefault();
                const actualizados = db.gastosFijos.map(g => g.id === editandoFijo.id ? { ...g, concepto: editandoFijo.concepto, monto: parseFloat(editandoFijo.monto) || 0, moneda: editandoFijo.moneda } : g);
                guardarEnNube({ ...db, gastosFijos: actualizados });
                setEditandoFijo(null);
              }} className="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-sm w-full space-y-5 shadow-2xl">
                <h3 className="font-black text-white text-xl border-b border-slate-800 pb-3">Editar Gasto Fijo</h3>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Concepto (Ej: Gimnasio)</label>
                    <input type="text" required value={editandoFijo.concepto} onChange={e => setEditandoFijo({...editandoFijo, concepto: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Nuevo Precio de la Cuota</label>
                    <div className="flex gap-2">
                      <input type="number" step="any" required value={editandoFijo.monto} onChange={e => setEditandoFijo({...editandoFijo, monto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono text-lg" />
                      <select value={editandoFijo.moneda} onChange={e => setEditandoFijo({...editandoFijo, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-3 text-white font-bold"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                    </div>
                  </div>
                </div>
                <div className="flex gap-3 pt-2">
                  <button type="submit" className="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl transition">Guardar Cambios</button>
                  <button type="button" onClick={() => setEditandoFijo(null)} className="bg-slate-800 text-white font-bold px-5 py-3 rounded-xl transition">Cancelar</button>
                </div>
              </form>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
