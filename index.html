<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrimonio Cloud - Bruno</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen text-sm selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, Component, useRef } = React;

    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { hasError: false, errorInfo: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, errorInfo: error.message }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex h-screen items-center justify-center p-4">
              <div className="bg-rose-950 border border-rose-500 p-6 rounded-xl text-center max-w-sm">
                <h1 className="text-white font-bold mb-2">Error Visual</h1>
                <p className="text-rose-300 text-xs mb-4">{this.state.errorInfo}</p>
                <button onClick={() => window.location.reload()} className="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-lg font-bold">Recargar App</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ==========================================
    // 1. CONEXIÓN A BASE DE DATOS
    // ==========================================
    const SUPABASE_URL = "https://nbluvlbsuvmkcaflmjei.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IuVcRy48mLa5P02gRC7B_Q_tI3C6Wuk";
    
    let supaClient = null;
    try {
      if (window.supabase) supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (err) { console.error("Error iniciando Supabase:", err); }

    const DB_TEMPLATE = { 
        cotizacionDolar: 1500, fechaUltimaCotizacion: '',
        activos: [], gastosFijos: [], gastosPuntuales: [], 
        deudas: [], deudasCobrar: [], // NUEVO: Cuentas por cobrar
        stock: [], historiaConceptos: [], historiaStock: [], actividad: [] 
    };

    function App() {
      const [isLoaded, setIsLoaded] = useState(false);
      const [sesion, setSesion] = useState(false);
      const [passInput, setPassInput] = useState('');
      const [errorLogin, setErrorLogin] = useState('');

      const [db, setDb] = useState(DB_TEMPLATE);
      const [vista, setVista] = useState('patrimonio');

      // ESTADO DEL BLOQUEO DIARIO DE COTIZACIÓN
      const [bloqueoCotizacion, setBloqueoCotizacion] = useState(false);
      const [cotizacionDiariaInput, setCotizacionDiariaInput] = useState('');

      // ESTADOS DE FORMULARIOS
      const [nuevoActivo, setNuevoActivo] = useState({ nombre: '', monto: '', moneda: 'USD', tipo: 'billetera' });
      const [nuevoGastoPuntual, setNuevoGastoPuntual] = useState({ concepto: '', monto: '', moneda: 'ARS', walletId: '' });
      const [mostrarInputConceptoLibre, setMostrarInputConceptoLibre] = useState(false);
      const [nuevoGastoFijo, setNuevoGastoFijo] = useState({ concepto: '', monto: '', moneda: 'ARS', tipo: 'fijo', cuotasTotales: '3', diaVencimiento: '1' });
      
      const [nuevaDeuda, setNuevaDeuda] = useState({ acreedor: '', monto: '', moneda: 'USD' });
      const [nuevaDeudaCobrar, setNuevaDeudaCobrar] = useState({ deudor: '', monto: '', moneda: 'USD', walletId: '' }); // NUEVO

      const [nuevoStock, setNuevoStock] = useState({ concepto: '', cantidad: '1', monto: '', moneda: 'USD' });
      const [mostrarInputStockLibre, setMostrarInputStockLibre] = useState(false);

      // ESTADOS UI
      const [editandoDolar, setEditandoDolar] = useState(false);
      const [dolarInput, setDolarInput] = useState('');
      
      const [pagoActivo, setPagoActivo] = useState({ idGasto: null, walletId: '' });
      const [pagoDeudaActivo, setPagoDeudaActivo] = useState({ idDeuda: null, walletId: '', montoAbono: '' });
      const [cobroDeudaActivo, setCobroDeudaActivo] = useState({ idDeuda: null, walletId: '', montoCobro: '' }); // NUEVO
      
      const [editandoActivo, setEditandoActivo] = useState(null);
      const [editandoFijo, setEditandoFijo] = useState(null);
      const [editandoDeuda, setEditandoDeuda] = useState(null);
      const [editandoDeudaCobrar, setEditandoDeudaCobrar] = useState(null); // NUEVO
      const [editandoStock, setEditandoStock] = useState(null);
      const [editandoGastoPuntual, setEditandoGastoPuntual] = useState(null); 
      
      const [modalRegistroActividad, setModalRegistroActividad] = useState(null);

      // ESTADOS DE AUDITORÍA (FILTROS Y ASISTENTE)
      const [filtroUsuario, setFiltroUsuario] = useState('');
      const [filtroDesde, setFiltroDesde] = useState('');
      const [filtroHasta, setFiltroHasta] = useState('');
      
      const [consultaAsistente, setConsultaAsistente] = useState('');
      const [chatAsistente, setChatAsistente] = useState([{ emisor: 'bot', texto: '¡Hola! Soy tu asistente de auditoría. Preguntame por ej: "qué gastos agregué ayer", o "movimientos de stock de hoy".' }]);
      const chatEndRef = useRef(null);

      // ==========================================
      // LÓGICA DE AUDITORÍA (LOGS)
      // ==========================================
      const generarLog = (accion, detalle, datosExtra = null) => {
        return { id: Date.now() + Math.floor(Math.random() * 1000), fecha: new Date().toISOString(), usuario: 'Bruno', accion, detalle, datosExtra };
      };

      const opcionesConcepto = useMemo(() => [...new Set(db.historiaConceptos || [])], [db.historiaConceptos]);
      const opcionesStock = useMemo(() => [...new Set(db.historiaStock || [])], [db.historiaStock]);
      const billeterasDisponibles = useMemo(() => (db.activos || []).filter(a => a.tipo !== 'activo'), [db.activos]);

      // LECTURA Y ESCRITURA NUBE
      useEffect(() => {
        async function fetchNube() {
          if (!supaClient) { setIsLoaded(true); return; }
          try {
            const { data, error } = await supaClient.from('iconnecture_data').select('payload').eq('id', 1).single();
            if (error) throw error;
            if (data && data.payload) {
              const baseCargada = {
                cotizacionDolar: data.payload.cotizacionDolar || 1500,
                fechaUltimaCotizacion: data.payload.fechaUltimaCotizacion || '',
                activos: Array.isArray(data.payload.activos) ? data.payload.activos.filter(Boolean) : [],
                gastosFijos: Array.isArray(data.payload.gastosFijos) ? data.payload.gastosFijos.filter(Boolean) : [],
                gastosPuntuales: Array.isArray(data.payload.gastosPuntuales) ? data.payload.gastosPuntuales.filter(Boolean) : [],
                deudas: Array.isArray(data.payload.deudas) ? data.payload.deudas.filter(Boolean) : [],
                deudasCobrar: Array.isArray(data.payload.deudasCobrar) ? data.payload.deudasCobrar.filter(Boolean) : [], // NUEVO
                stock: Array.isArray(data.payload.stock) ? data.payload.stock.filter(Boolean) : [],
                historiaConceptos: Array.isArray(data.payload.historiaConceptos) ? data.payload.historiaConceptos : [],
                historiaStock: Array.isArray(data.payload.historiaStock) ? data.payload.historiaStock : [],
                actividad: Array.isArray(data.payload.actividad) ? data.payload.actividad.filter(Boolean) : []
              };
              setDb(baseCargada);
              
              // LÓGICA DE BLOQUEO DIARIO DE COTIZACIÓN
              const hoyStr = new Date().toLocaleDateString();
              if (baseCargada.fechaUltimaCotizacion !== hoyStr) {
                  setCotizacionDiariaInput(baseCargada.cotizacionDolar);
                  setBloqueoCotizacion(true);
              }
            }
          } catch (err) { console.error("Iniciando de cero."); }
          setIsLoaded(true);
        }
        fetchNube();
      }, []);

      const guardarEnNube = async (nuevoEstadoDb) => {
        setDb(nuevoEstadoDb);
        if (supaClient) {
          const { error } = await supaClient.from('iconnecture_data').update({ payload: nuevoEstadoDb }).eq('id', 1);
          if (error) alert("Atención: No se pudo guardar en la nube. Revisá tu conexión.");
        }
      };

      const login = (e) => {
        e.preventDefault();
        if (passInput === 'bruno123') { setSesion(true); setErrorLogin(''); }
        else { setErrorLogin('Clave incorrecta'); setPassInput(''); }
      };

      const procesarBloqueoCotizacion = (e) => {
          e.preventDefault();
          const val = parseFloat(cotizacionDiariaInput) || 1500;
          const hoyStr = new Date().toLocaleDateString();
          const log = generarLog('Actualizó Cotización Diaria', `Confirmó cotización del día a $${val}`);
          
          guardarEnNube({...db, cotizacionDolar: val, fechaUltimaCotizacion: hoyStr, actividad: [log, ...(db.actividad || [])].slice(0, 500)});
          setBloqueoCotizacion(false);
      };

      // Funciones de visualización
      const calcularUSD = (monto, moneda) => { return moneda === 'USD' ? (parseFloat(monto) || 0) : (parseFloat(monto) || 0) / db.cotizacionDolar; };
      const formatDinero = (montoUSD) => { return `$ ${parseFloat(montoUSD || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD`; };
      
      const calcularDiasPasados = (fechaStr) => {
          const partes = fechaStr.split('/'); // Asume DD/MM/YYYY local
          const fechaObj = new Date(partes[2], partes[1] - 1, partes[0]);
          const hoy = new Date();
          const difTiempo = Math.abs(hoy - fechaObj);
          return Math.floor(difTiempo / (1000 * 60 * 60 * 24)); 
      };

      const limpiarHistoriaConceptos = () => {
        if(window.confirm("¿Estás seguro de vaciar el historial de nombres de gastos?")) {
          guardarEnNube({...db, historiaConceptos: [], actividad: [generarLog('Limpió Historial', 'Vació la memoria de conceptos de gastos.'), ...(db.actividad || [])].slice(0, 500)});
        }
      };

      const limpiarHistoriaStock = () => {
        if(window.confirm("¿Estás seguro de vaciar el historial de nombres de repuestos?")) {
          guardarEnNube({...db, historiaStock: [], actividad: [generarLog('Limpió Historial', 'Vació la memoria de conceptos de stock.'), ...(db.actividad || [])].slice(0, 500)});
        }
      };

      // ==========================================
      // MOTOR DEL ASISTENTE INTELIGENTE
      // ==========================================
      useEffect(() => { if(chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: 'smooth' }); }, [chatAsistente, vista]);

      const procesarConsultaAsistente = (e) => {
        e.preventDefault();
        const textoUser = consultaAsistente.trim();
        if(!textoUser) return;
        
        const nuevoChat = [...chatAsistente, { emisor: 'user', texto: textoUser }];
        setChatAsistente(nuevoChat);
        setConsultaAsistente('');

        const lower = textoUser.toLowerCase();
        let logsMatch = [...(db.actividad || [])];
        const hoy = new Date();
        const ayer = new Date(); ayer.setDate(hoy.getDate() - 1);

        if (lower.includes('hoy')) { logsMatch = logsMatch.filter(l => new Date(l.fecha).toLocaleDateString() === hoy.toLocaleDateString()); } 
        else if (lower.includes('ayer')) { logsMatch = logsMatch.filter(l => new Date(l.fecha).toLocaleDateString() === ayer.toLocaleDateString()); }

        if (lower.includes('gasto') || lower.includes('gastos')) { logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('gasto')); } 
        else if (lower.includes('deuda') || lower.includes('deudas')) { logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('deuda')); } 
        else if (lower.includes('stock') || lower.includes('repuesto') || lower.includes('bateria') || lower.includes('batería')) { logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('stock') || l.accion.toLowerCase().includes('repuesto')); } 
        else if (lower.includes('activo') || lower.includes('billetera') || lower.includes('plata')) { logsMatch = logsMatch.filter(l => l.accion.toLowerCase().includes('billetera') || l.accion.toLowerCase().includes('activo') || l.accion.toLowerCase().includes('pago')); }

        if (lower.includes('bruno')) { logsMatch = logsMatch.filter(l => l.usuario.toLowerCase() === 'bruno'); }

        setTimeout(() => {
            let respuesta = '';
            if (logsMatch.length === 0) respuesta = "Revisé los registros y no encontré ningún movimiento que coincida con lo que me pedís.";
            else {
                let limite = 5;
                const ultimos = logsMatch.slice(0, limite);
                respuesta = `Encontré ${logsMatch.length} movimientos relacionados a eso. Acá tenés los más recientes:\n\n` + ultimos.map(l => `• ${l.detalle}`).join('\n\n');
                if(logsMatch.length > limite) respuesta += `\n\n*(Y ${logsMatch.length - limite} movimientos más que podés ver abajo en la tabla)*`;
            }
            setChatAsistente(prev => [...prev, { emisor: 'bot', texto: respuesta }]);
        }, 500); 
      };

      // ==========================================
      // REEMBOLSOS Y DESCUENTOS SEGUROS
      // ==========================================
      const procesarDescuentoSeguro = (walletId, montoGasto, monedaGasto, activosActuales) => {
        const activosClon = [...activosActuales];
        const idx = activosClon.findIndex(w => w.id === parseInt(walletId));
        if (idx === -1) return { success: false, msg: 'Billetera no encontrada' };
        
        const wallet = activosClon[idx];
        let montoARestar = parseFloat(montoGasto);
        
        if (monedaGasto === 'ARS' && wallet.moneda === 'USD') montoARestar = montoARestar / db.cotizacionDolar;
        if (monedaGasto === 'USD' && wallet.moneda === 'ARS') montoARestar = montoARestar * db.cotizacionDolar;
        
        if (parseFloat(wallet.monto) < montoARestar) {
            return { success: false, msg: `Saldo insuficiente en ${wallet.nombre}. Tenés ${wallet.monto} ${wallet.moneda} e intentás descontar el equivalente a ${montoARestar.toFixed(2)} ${wallet.moneda}.` };
        }
        
        activosClon[idx].monto = (parseFloat(wallet.monto) - montoARestar).toFixed(2);
        return { success: true, activosActualizados: activosClon };
      };

      const procesarReembolsoWallet = (walletId, montoAReembolsar, monedaReembolso, activosActuales) => {
        const activosClon = [...activosActuales];
        const idx = activosClon.findIndex(w => w.id === parseInt(walletId));
        if (idx === -1) return activosClon; 
        
        const wallet = activosClon[idx];
        let montoASumar = parseFloat(montoAReembolsar);
        
        if (monedaReembolso === 'ARS' && wallet.moneda === 'USD') montoASumar = montoASumar / db.cotizacionDolar;
        if (monedaReembolso === 'USD' && wallet.moneda === 'ARS') montoASumar = montoASumar * db.cotizacionDolar;
        
        activosClon[idx].monto = (parseFloat(wallet.monto) + montoASumar).toFixed(2);
        return activosClon;
      };

      // ==========================================
      // HANDLERS FINANCIEROS (Y AUDITORÍA)
      // ==========================================
      const agregarActivo = (e) => {
        e.preventDefault();
        const item = { id: Date.now(), nombre: nuevoActivo.nombre.trim(), monto: parseFloat(nuevoActivo.monto) || 0, moneda: nuevoActivo.moneda, tipo: nuevoActivo.tipo };
        const log = generarLog('Creó Billetera/Activo', `Creó ${item.tipo}: "${item.nombre}" con saldo inicial de ${item.monto} ${item.moneda}`, item);
        guardarEnNube({ ...db, activos: [item, ...db.activos], actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevoActivo({ nombre: '', monto: '', moneda: 'USD', tipo: 'billetera' });
      };

      const agregarGastoPuntual = (e) => {
        e.preventDefault();
        if (!nuevoGastoPuntual.walletId || !nuevoGastoPuntual.concepto) return alert('Completá los datos.');
        const operacion = procesarDescuentoSeguro(nuevoGastoPuntual.walletId, nuevoGastoPuntual.monto, nuevoGastoPuntual.moneda, db.activos);
        if (!operacion.success) return alert(operacion.msg); 
        
        const walletUsada = db.activos.find(w => w.id === parseInt(nuevoGastoPuntual.walletId));
        const conceptoTrim = nuevoGastoPuntual.concepto.trim();
        const item = { id: Date.now(), concepto: conceptoTrim, monto: parseFloat(nuevoGastoPuntual.monto) || 0, moneda: nuevoGastoPuntual.moneda, fecha: new Date().toLocaleDateString(), pagadoCon: walletUsada?.nombre || 'Desconocido', walletIdOriginal: walletUsada?.id };

        const nuevaHistoriaConceptos = [...new Set([conceptoTrim, ...(db.historiaConceptos || [])])];
        const log = generarLog('Creó Gasto Suelto', `Registró gasto en "${item.concepto}" por ${item.monto} ${item.moneda}. Pagado con ${item.pagadoCon}.`, item);

        guardarEnNube({ ...db, activos: operacion.activosActualizados, gastosPuntuales: [item, ...(db.gastosPuntuales || [])], historiaConceptos: nuevaHistoriaConceptos, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevoGastoPuntual({ concepto: '', monto: '', moneda: 'ARS', walletId: nuevoGastoPuntual.walletId });
        setMostrarInputConceptoLibre(false);
      };

      const eliminarGastoPuntual = (itemGasto) => {
        if(window.confirm(`¿Eliminar gasto de ${itemGasto.concepto}? El dinero será reembolsado a ${itemGasto.pagadoCon}.`)){
            const activosReembolsados = procesarReembolsoWallet(itemGasto.walletIdOriginal, itemGasto.monto, itemGasto.moneda, db.activos);
            const log = generarLog('Eliminó Gasto Suelto', `Eliminó gasto de "${itemGasto.concepto}" por ${itemGasto.monto} ${itemGasto.moneda}. Dinero reembolsado a ${itemGasto.pagadoCon}.`, itemGasto);
            guardarEnNube({ ...db, activos: activosReembolsados, gastosPuntuales: db.gastosPuntuales.filter(x => x.id !== itemGasto.id), actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        }
      };

      const procesarEdicionGastoPuntual = (e) => {
        e.preventDefault();
        const gastoOriginal = db.gastosPuntuales.find(g => g.id === editandoGastoPuntual.id);
        const activosReembolsados = procesarReembolsoWallet(gastoOriginal.walletIdOriginal, gastoOriginal.monto, gastoOriginal.moneda, db.activos);
        const operacionNuevoDescuento = procesarDescuentoSeguro(editandoGastoPuntual.walletIdOriginal, editandoGastoPuntual.monto, editandoGastoPuntual.moneda, activosReembolsados);
        
        if (!operacionNuevoDescuento.success) { return alert(operacionNuevoDescuento.msg + " (El gasto original no se modificó)."); }

        const nombreWalletNueva = operacionNuevoDescuento.activosActualizados.find(w => w.id === parseInt(editandoGastoPuntual.walletIdOriginal))?.nombre;
        const gastosPuntualesActualizados = db.gastosPuntuales.map(g => {
            if (g.id === editandoGastoPuntual.id) return { ...g, concepto: editandoGastoPuntual.concepto, monto: parseFloat(editandoGastoPuntual.monto), moneda: editandoGastoPuntual.moneda, walletIdOriginal: parseInt(editandoGastoPuntual.walletIdOriginal), pagadoCon: nombreWalletNueva };
            return g;
        });

        const log = generarLog('Editó Gasto Suelto', `Editó gasto de "${gastoOriginal.concepto}" a "${editandoGastoPuntual.concepto}". Modificó monto de ${gastoOriginal.monto} a ${editandoGastoPuntual.monto}.`, { original: gastoOriginal, nuevo: editandoGastoPuntual });
        guardarEnNube({ ...db, activos: operacionNuevoDescuento.activosActualizados, gastosPuntuales: gastosPuntualesActualizados, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setEditandoGastoPuntual(null);
      };

      const agregarGastoFijo = (e) => {
        e.preventDefault();
        const item = { 
          id: Date.now(), concepto: nuevoGastoFijo.concepto.trim(), monto: parseFloat(nuevoGastoFijo.monto) || 0, moneda: nuevoGastoFijo.moneda, tipo: nuevoGastoFijo.tipo, diaVencimiento: nuevoGastoFijo.diaVencimiento,
          cuotasTotales: nuevoGastoFijo.tipo === 'cuotas' ? parseInt(nuevoGastoFijo.cuotasTotales) || 1 : null, cuotasPagadas: nuevoGastoFijo.tipo === 'cuotas' ? 0 : null, ultimoPago: null
        };
        const log = generarLog('Creó Gasto Fijo', `Registró "${item.concepto}" por ${item.monto} ${item.moneda} (${item.tipo}).`, item);
        guardarEnNube({ ...db, gastosFijos: [item, ...(db.gastosFijos || [])], actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevoGastoFijo({ concepto: '', monto: '', moneda: 'ARS', tipo: 'fijo', cuotasTotales: '3', diaVencimiento: '1' });
      };

      const procesarPagoFijo = (itemFijo) => {
        if (!pagoActivo.walletId) return alert('Elegí una billetera para descontar el pago.');
        const operacion = procesarDescuentoSeguro(pagoActivo.walletId, itemFijo.monto, itemFijo.moneda, db.activos);
        if (!operacion.success) return alert(operacion.msg); 
        
        const gastosFijosActualizados = db.gastosFijos.map(g => {
          if (g.id === itemFijo.id) return { ...g, cuotasPagadas: g.tipo === 'cuotas' ? g.cuotasPagadas + 1 : g.cuotasPagadas, ultimoPago: new Date().toLocaleDateString() };
          return g;
        });

        const walletUsada = operacion.activosActualizados.find(w => w.id === parseInt(pagoActivo.walletId))?.nombre;
        const log = generarLog('Efectuó Pago (Fijo/Cuota)', `Pagó "${itemFijo.concepto}" (${itemFijo.monto} ${itemFijo.moneda}) desde la billetera ${walletUsada}.`, itemFijo);

        guardarEnNube({ ...db, activos: operacion.activosActualizados, gastosFijos: gastosFijosActualizados, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setPagoActivo({ idGasto: null, walletId: '' }); 
      };

      // --- DEUDAS (HACIA OTROS) ---
      const agregarDeuda = (e) => {
        e.preventDefault();
        const montoNuevo = parseFloat(nuevaDeuda.monto) || 0;
        let deudasActualizadas = [...(db.deudas || [])];
        const idxExistente = deudasActualizadas.findIndex(d => d.acreedor.trim().toLowerCase() === nuevaDeuda.acreedor.trim().toLowerCase() && d.moneda === nuevaDeuda.moneda);

        let log;
        if (idxExistente !== -1) {
          deudasActualizadas[idxExistente].monto = (parseFloat(deudasActualizadas[idxExistente].monto) + montoNuevo).toFixed(2);
          log = generarLog('Aumentó Deuda Existente', `Le sumó ${montoNuevo} ${nuevaDeuda.moneda} a la deuda con "${deudasActualizadas[idxExistente].acreedor}".`, deudasActualizadas[idxExistente]);
        } else {
          const item = { id: Date.now(), acreedor: nuevaDeuda.acreedor.trim(), monto: montoNuevo.toFixed(2), moneda: nuevaDeuda.moneda, fecha: new Date().toLocaleDateString() };
          deudasActualizadas.unshift(item);
          log = generarLog('Creó Nueva Deuda', `Registró nueva deuda con "${item.acreedor}" por ${item.monto} ${item.moneda}.`, item);
        }
        guardarEnNube({ ...db, deudas: deudasActualizadas, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevaDeuda({ acreedor: '', monto: '', moneda: 'USD' });
      };

      const procesarPagoDeuda = (itemDeuda) => {
        if (!pagoDeudaActivo.walletId || !pagoDeudaActivo.montoAbono) return alert('Completá los datos.');
        const abono = parseFloat(pagoDeudaActivo.montoAbono);
        if (abono > parseFloat(itemDeuda.monto)) return alert('No podés abonar más dinero del que debés.');

        const operacion = procesarDescuentoSeguro(pagoDeudaActivo.walletId, abono, itemDeuda.moneda, db.activos);
        if (!operacion.success) return alert(operacion.msg); 

        const nuevoMontoDeuda = parseFloat(itemDeuda.monto) - abono;
        let deudasActualizadas = [];
        if (nuevoMontoDeuda <= 0.05) deudasActualizadas = (db.deudas || []).filter(d => d.id !== itemDeuda.id);
        else deudasActualizadas = (db.deudas || []).map(d => d.id === itemDeuda.id ? { ...d, monto: nuevoMontoDeuda.toFixed(2) } : d);

        const walletUsada = operacion.activosActualizados.find(w => w.id === parseInt(pagoDeudaActivo.walletId))?.nombre;
        const log = generarLog('Abonó a Deuda', `Abonó ${abono} ${itemDeuda.moneda} a la deuda de "${itemDeuda.acreedor}" desde la billetera ${walletUsada}.`, { deudaOriginal: itemDeuda, abono, walletUsada });

        guardarEnNube({ ...db, activos: operacion.activosActualizados, deudas: deudasActualizadas, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setPagoDeudaActivo({ idDeuda: null, walletId: '', montoAbono: '' });
      };

      // --- NUEVO: DEUDAS HACIA MÍ (COBRAR) ---
      const agregarDeudaCobrar = (e) => {
        e.preventDefault();
        if (!nuevaDeudaCobrar.walletId) return alert('Tenés que seleccionar de qué billetera le prestaste la plata para descontarla.');
        
        const montoPrestado = parseFloat(nuevaDeudaCobrar.monto) || 0;
        const operacion = procesarDescuentoSeguro(nuevaDeudaCobrar.walletId, montoPrestado, nuevaDeudaCobrar.moneda, db.activos);
        if (!operacion.success) return alert(operacion.msg);

        let deudasCobrarActualizadas = [...(db.deudasCobrar || [])];
        const idxExistente = deudasCobrarActualizadas.findIndex(d => d.deudor.trim().toLowerCase() === nuevaDeudaCobrar.deudor.trim().toLowerCase() && d.moneda === nuevaDeudaCobrar.moneda);

        let log;
        if (idxExistente !== -1) {
          deudasCobrarActualizadas[idxExistente].monto = (parseFloat(deudasCobrarActualizadas[idxExistente].monto) + montoPrestado).toFixed(2);
          log = generarLog('Aumentó Deuda a Favor', `Prestó ${montoPrestado} ${nuevaDeudaCobrar.moneda} extra a "${deudasCobrarActualizadas[idxExistente].deudor}". Descontado de tu billetera.`, deudasCobrarActualizadas[idxExistente]);
        } else {
          const item = { id: Date.now(), deudor: nuevaDeudaCobrar.deudor.trim(), monto: montoPrestado.toFixed(2), moneda: nuevaDeudaCobrar.moneda, fecha: new Date().toLocaleDateString() };
          deudasCobrarActualizadas.unshift(item);
          log = generarLog('Creó Cuenta a Cobrar', `Prestó ${item.monto} ${item.moneda} a "${item.deudor}". Descontado de tu billetera.`, item);
        }

        guardarEnNube({ ...db, activos: operacion.activosActualizados, deudasCobrar: deudasCobrarActualizadas, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevaDeudaCobrar({ deudor: '', monto: '', moneda: 'USD', walletId: '' });
      };

      const procesarCobroDeuda = (itemDeuda) => {
        if (!cobroDeudaActivo.walletId || !cobroDeudaActivo.montoCobro) return alert('Completá los datos.');
        const cobro = parseFloat(cobroDeudaActivo.montoCobro);
        if (cobro > parseFloat(itemDeuda.monto)) return alert('No podés cobrar más dinero del que te deben.');

        const activosConCobro = procesarReembolsoWallet(cobroDeudaActivo.walletId, cobro, itemDeuda.moneda, db.activos);

        const nuevoMontoDeuda = parseFloat(itemDeuda.monto) - cobro;
        let deudasCobrarActualizadas = [];
        if (nuevoMontoDeuda <= 0.05) deudasCobrarActualizadas = (db.deudasCobrar || []).filter(d => d.id !== itemDeuda.id);
        else deudasCobrarActualizadas = (db.deudasCobrar || []).map(d => d.id === itemDeuda.id ? { ...d, monto: nuevoMontoDeuda.toFixed(2) } : d);

        const walletUsada = activosConCobro.find(w => w.id === parseInt(cobroDeudaActivo.walletId))?.nombre;
        const log = generarLog('Registró Cobro', `Recibió ${cobro} ${itemDeuda.moneda} de "${itemDeuda.deudor}". Dinero ingresado a billetera ${walletUsada}.`, { deudaOriginal: itemDeuda, cobro, walletUsada });

        guardarEnNube({ ...db, activos: activosConCobro, deudasCobrar: deudasCobrarActualizadas, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setCobroDeudaActivo({ idDeuda: null, walletId: '', montoCobro: '' });
      };

      const eliminarDeudaCobrar = (itemDeuda) => {
        if(window.confirm(`¿Estás seguro de eliminar la deuda de ${itemDeuda.deudor} sin recuperar la plata a ninguna billetera? (Se asume incobrable)`)){
            const log = generarLog('Eliminó Cuenta a Cobrar', `Borró la deuda de "${itemDeuda.deudor}" por ${itemDeuda.monto} ${itemDeuda.moneda} sin ingresarlo a billeteras (Incobrable).`, itemDeuda);
            guardarEnNube({ ...db, deudasCobrar: (db.deudasCobrar || []).filter(x => x.id !== itemDeuda.id), actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        }
      };

      // --- STOCK ---
      const agregarStock = (e) => {
        e.preventDefault();
        if (!nuevoStock.concepto) return alert('Ingresá el concepto.');
        const conceptoTrim = nuevoStock.concepto.trim();
        let stockActualizado = [...(db.stock || [])];
        const idx = stockActualizado.findIndex(s => s.concepto.toLowerCase().trim() === conceptoTrim.toLowerCase());
        
        let log;
        if (idx !== -1) {
          stockActualizado[idx].cantidad = parseInt(stockActualizado[idx].cantidad) + parseInt(nuevoStock.cantidad);
          stockActualizado[idx].monto = parseFloat(nuevoStock.monto) || 0;
          stockActualizado[idx].moneda = nuevoStock.moneda;
          log = generarLog('Aumentó Repuesto Existente', `Sumó ${nuevoStock.cantidad} unid. de "${stockActualizado[idx].concepto}".`, stockActualizado[idx]);
        } else {
          const item = { id: Date.now(), concepto: conceptoTrim, cantidad: parseInt(nuevoStock.cantidad) || 1, monto: parseFloat(nuevoStock.monto) || 0, moneda: nuevoStock.moneda };
          stockActualizado.unshift(item);
          log = generarLog('Creó Nuevo Repuesto', `Ingresó ${item.cantidad} unid. de "${item.concepto}" a ${item.monto} ${item.moneda} c/u.`, item);
        }
        
        const nuevaHistoriaStock = [...new Set([conceptoTrim, ...(db.historiaStock || [])])];
        guardarEnNube({ ...db, stock: stockActualizado, historiaStock: nuevaHistoriaStock, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
        setNuevoStock({ concepto: '', cantidad: '1', monto: '', moneda: 'USD' });
        setMostrarInputStockLibre(false);
      };

      const modificarCantidadStock = (id, delta) => {
        const itemAfectado = db.stock.find(s => s.id === id);
        const nuevaCant = Math.max(0, parseInt(itemAfectado.cantidad) + delta);
        const stockActualizado = db.stock.map(s => s.id === id ? { ...s, cantidad: nuevaCant } : s);
        const accionTexto = delta > 0 ? 'Sumó +1 unidad' : 'Restó -1 unidad';
        const log = generarLog('Modificó Cantidad Stock', `${accionTexto} de "${itemAfectado.concepto}". Quedan ${nuevaCant}.`, { itemAfectado, delta });
        guardarEnNube({ ...db, stock: stockActualizado, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
      };

      // --- CÁLCULOS TOTALES ---
      const totalBilleterasYActivosUSD = (db.activos || []).reduce((acc, item) => acc + calcularUSD(item.monto, item.moneda), 0);
      const totalStockUSD = (db.stock || []).reduce((acc, item) => acc + (calcularUSD(item.monto, item.moneda) * parseInt(item.cantidad)), 0);
      
      const totalDeudasPendientesUSD = (db.deudas || []).reduce((acc, item) => acc + calcularUSD(item.monto, item.moneda), 0);
      const totalDeudasCobrarUSD = (db.deudasCobrar || []).reduce((acc, item) => acc + calcularUSD(item.monto, item.moneda), 0);
      
      const totalGastosFijosUSD = (db.gastosFijos || []).reduce((acc, item) => acc + calcularUSD(item.monto, item.moneda), 0);
      const totalGastosPuntualesUSD = (db.gastosPuntuales || []).reduce((acc, item) => acc + calcularUSD(item.monto, item.moneda), 0);
      
      // Patrimonio: Cuentas por cobrar NO suman al neto disponible inmediato, y tampoco restan. Son un activo aparte. 
      // Por eso se calcula el disponible líquido igual, pero las deudas a cobrar se muestran en su pestaña.
      const patrimonioNetoRealUSD = totalBilleterasYActivosUSD + totalStockUSD - totalDeudasPendientesUSD;

      // ==========================================
      // 5. INTERFACES
      // ==========================================
      if (!isLoaded) return <div className="flex h-screen items-center justify-center font-bold text-blue-400 animate-pulse text-xl">Conectando a tu Nube...</div>;

      if (!sesion) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 p-4">
            <form onSubmit={login} className="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-sm w-full space-y-6 shadow-2xl fade-in">
              <div className="text-center space-y-2">
                <i className="fa-solid fa-fingerprint text-5xl text-blue-500 mb-3"></i>
                <h1 className="text-3xl font-black text-white">Patrimonio</h1>
                <p className="text-slate-400 text-sm font-bold tracking-widest uppercase">Acceso Privado</p>
              </div>
              <div>
                <input type="password" required placeholder="Tu clave..." value={passInput} onChange={e => {setPassInput(e.target.value); setErrorLogin('');}} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-4 text-center text-2xl font-mono text-white tracking-widest focus:outline-none focus:border-blue-500" />
                {errorLogin && <p className="text-rose-400 text-xs font-bold text-center mt-3">{errorLogin}</p>}
              </div>
              <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition text-base">Desbloquear</button>
            </form>
          </div>
        );
      }

      // PANTALLA DE BLOQUEO DIARIO DE COTIZACIÓN
      if (bloqueoCotizacion) {
          return (
            <div className="flex items-center justify-center min-h-screen bg-slate-950 p-4">
              <form onSubmit={procesarBloqueoCotizacion} className="bg-slate-900 border border-indigo-500/50 rounded-3xl p-8 max-w-sm w-full space-y-6 shadow-2xl fade-in text-center">
                <div className="space-y-2">
                  <i className="fa-solid fa-calendar-day text-5xl text-emerald-400 mb-2"></i>
                  <h1 className="text-2xl font-black text-white">Nuevo Día de Trabajo</h1>
                  <p className="text-slate-400 text-xs">Por favor, verificá o actualizá la cotización del dólar de hoy para desbloquear el sistema.</p>
                </div>
                <div>
                  <label className="text-[10px] font-bold text-slate-500 uppercase block mb-2">Cotización Dólar ARS de Hoy</label>
                  <input type="number" step="any" required autoFocus value={cotizacionDiariaInput} onChange={e => setCotizacionDiariaInput(e.target.value)} className="w-full bg-slate-950 border border-emerald-500 rounded-xl px-4 py-4 text-center text-3xl font-black text-emerald-400 focus:outline-none focus:border-emerald-400" />
                </div>
                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl transition text-base">Confirmar y Entrar</button>
              </form>
            </div>
          );
      }

      return (
        <div className="flex flex-col md:flex-row h-screen bg-slate-950 text-slate-100 overflow-hidden font-sans text-sm">
          
          {/* BARRA LATERAL */}
          <aside className="w-full md:w-64 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 z-10">
            <div className="p-6 border-b border-slate-800 flex items-center gap-4">
              <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white text-xl shadow-lg"><i className="fa-solid fa-bolt"></i></div>
              <div>
                <h1 className="font-black text-base text-white leading-tight">Bruno</h1>
                <p className="text-[10px] text-blue-400 font-bold uppercase tracking-widest">Nube Activa</p>
              </div>
            </div>
            
            <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
              <button onClick={() => setVista('patrimonio')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${vista === 'patrimonio' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                <i className="fa-solid fa-wallet w-5 text-center"></i> Patrimonio y Gastos
              </button>
              <button onClick={() => setVista('deudas')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${vista === 'deudas' ? 'bg-rose-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                <i className="fa-solid fa-handshake w-5 text-center"></i> Deudas hacia Otros
              </button>
              {/* NUEVA PESTAÑA */}
              <button onClick={() => setVista('cobrar')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${vista === 'cobrar' ? 'bg-emerald-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                <i className="fa-solid fa-hand-holding-dollar w-5 text-center"></i> Deudas hacia Mí
              </button>

              <button onClick={() => setVista('stock')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${vista === 'stock' ? 'bg-amber-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                <i className="fa-solid fa-boxes-stacked w-5 text-center"></i> Stock Repuestos
              </button>
              <button onClick={() => setVista('actividad')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all mt-4 border border-indigo-500/30 ${vista === 'actividad' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                <i className="fa-solid fa-shield-halved w-5 text-center text-indigo-400"></i> Auditoría (Logs)
              </button>
            </nav>

            <div className="p-4 border-t border-slate-800 text-center">
              <div className="bg-slate-950 border border-slate-800 rounded-xl p-3">
                <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Cotización Dólar</p>
                {!editandoDolar ? (
                  <div className="flex items-center justify-center gap-2">
                    <span className="text-lg font-black text-emerald-400">${db.cotizacionDolar}</span>
                    <button onClick={() => { setDolarInput(db.cotizacionDolar); setEditandoDolar(true); }} className="text-slate-500 hover:text-white"><i className="fa-solid fa-pen text-xs"></i></button>
                  </div>
                ) : (
                  <div className="flex items-center gap-1 mt-1 justify-center">
                    <input type="number" value={dolarInput} onChange={e => setDolarInput(e.target.value)} className="w-16 bg-slate-900 border border-emerald-500 rounded px-1.5 py-1 text-white font-mono text-sm focus:outline-none text-center" />
                    <button onClick={() => { 
                      const val = parseFloat(dolarInput) || 1500;
                      const log = generarLog('Actualizó Cotización Manual', `Cambió la cotización del dólar a $${val}`);
                      guardarEnNube({...db, cotizacionDolar: val, actividad: [log, ...(db.actividad || [])].slice(0, 500)}); 
                      setEditandoDolar(false); 
                    }} className="bg-emerald-600 text-white px-2 py-1 rounded font-bold text-xs">Ok</button>
                  </div>
                )}
              </div>
            </div>
          </aside>

          {/* CONTENIDO PRINCIPAL */}
          <main className="flex-1 overflow-y-auto p-4 md:p-8 relative fade-in hide-scrollbar">
            
            {/* VISTA 1: PATRIMONIO Y GASTOS */}
            {vista === 'patrimonio' && (
              <div className="max-w-6xl mx-auto space-y-8 pb-20 fade-in">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="bg-gradient-to-br from-blue-900/40 to-slate-900 border border-blue-500/30 rounded-3xl p-6 shadow-xl relative overflow-hidden">
                    <p className="text-xs font-bold text-blue-400 uppercase tracking-widest mb-3 relative z-10"><i className="fa-solid fa-scale-balanced mr-2"></i>Patrimonio Neto Real</p>
                    <h2 className={`text-4xl font-black relative z-10 ${patrimonioNetoRealUSD >= 0 ? 'text-white' : 'text-rose-400'}`}>
                      {patrimonioNetoRealUSD < 0 ? '-' : ''}{formatDinero(Math.abs(patrimonioNetoRealUSD))}
                    </h2>
                    <p className="text-slate-400 text-[9px] uppercase font-bold mt-2 relative z-10 leading-tight">Activos + Stock - Deudas</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3"><i className="fa-solid fa-calendar-days mr-2"></i>Carga Fija Mensual</p>
                    <h2 className="text-3xl font-black text-amber-400">{formatDinero(totalGastosFijosUSD)}<span className="text-sm text-slate-500 ml-1">/mes</span></h2>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3"><i className="fa-solid fa-receipt mr-2"></i>Sueltos Históricos</p>
                    <h2 className="text-3xl font-black text-rose-400">{formatDinero(totalGastosPuntualesUSD)}</h2>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                  {/* Billeteras */}
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6 shadow-xl">
                    <div className="border-b border-slate-800 pb-3">
                      <h3 className="text-lg font-bold text-white"><i className="fa-solid fa-wallet text-blue-400 mr-2"></i>Billeteras y Activos</h3>
                      <p className="text-xs text-slate-400 mt-1">Saldos fijos blindados por moneda.</p>
                    </div>
                    
                    <form onSubmit={agregarActivo} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-inner">
                      <div className="flex gap-2">
                        <select value={nuevoActivo.tipo} onChange={e => setNuevoActivo({...nuevoActivo, tipo: e.target.value})} className="w-1/2 bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white text-xs font-bold focus:outline-none focus:border-blue-500"><option value="billetera">Dinero Líquido</option><option value="activo">Activo Físico</option></select>
                        <input type="text" required placeholder="Nombre (Ej: Efectivo)" value={nuevoActivo.nombre} onChange={e => setNuevoActivo({...nuevoActivo, nombre: e.target.value})} className="w-1/2 bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white focus:outline-none focus:border-blue-500 text-sm" />
                      </div>
                      <div className="flex gap-2">
                        <input type="number" step="any" required placeholder="Valor" value={nuevoActivo.monto} onChange={e => setNuevoActivo({...nuevoActivo, monto: e.target.value})} className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono focus:outline-none focus:border-blue-500 text-lg" />
                        <select value={nuevoActivo.moneda} onChange={e => setNuevoActivo({...nuevoActivo, moneda: e.target.value})} className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white font-bold focus:outline-none focus:border-blue-500"><option value="USD">USD</option><option value="ARS">ARS</option></select>
                        <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-3 rounded-xl transition"><i className="fa-solid fa-plus"></i></button>
                      </div>
                    </form>

                    <div className="space-y-3">
                      {db.activos.length === 0 ? <p className="text-center text-slate-500 py-6 text-sm font-bold border-2 border-dashed border-slate-800 rounded-xl">Vacío.</p> : db.activos.map(item => (
                        <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex justify-between items-center hover:border-slate-700 transition">
                          <div>
                            <p className="font-bold text-white text-base flex items-center gap-2">
                              {item.nombre} 
                              {(!item.tipo || item.tipo === 'billetera') ? <i className="fa-solid fa-money-bill-1-wave text-[10px] text-emerald-400" title="Billetera"></i> : <i className="fa-solid fa-cube text-[10px] text-amber-400" title="Físico"></i>}
                            </p>
                            <p className="text-[13px] text-emerald-400 font-black font-mono mt-1">{item.monto} <span className="text-[10px]">{item.moneda}</span></p>
                          </div>
                          <div className="flex items-center gap-2">
                            <button onClick={() => setEditandoActivo({...item, tipo: item.tipo || 'billetera'})} className="bg-slate-800 hover:bg-slate-700 text-slate-300 w-8 h-8 rounded-lg transition-colors"><i className="fa-solid fa-pen text-xs"></i></button>
                            <button onClick={() => {

                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Acreedor / Concepto</label>
                    <input type="text" required value={editandoDeuda.acreedor} onChange={e => setEditandoDeuda({...editandoDeuda, acreedor: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Nuevo Monto Pendiente</label>
                    <div className="flex gap-2">
                      <input type="number" step="any" required value={editandoDeuda.monto} onChange={e => setEditandoDeuda({...editandoDeuda, monto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono text-lg" />
                      <select value={editandoDeuda.moneda} onChange={e => setEditandoDeuda({...editandoDeuda, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-3 text-white font-bold"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                    </div>
                  </div>
                </div>
                <div className="flex gap-3 pt-2">
                  <button type="submit" className="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl transition">Guardar Cambios</button>
                  <button type="button" onClick={() => setEditandoDeuda(null)} className="bg-slate-800 text-white font-bold px-5 py-3 rounded-xl transition">Cancelar</button>
                </div>
              </form>
            </div>
          )}

          {editandoDeudaCobrar && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => {
                e.preventDefault();
                const actualizadas = db.deudasCobrar.map(d => d.id === editandoDeudaCobrar.id ? { ...d, deudor: editandoDeudaCobrar.deudor, monto: parseFloat(editandoDeudaCobrar.monto) || 0, moneda: editandoDeudaCobrar.moneda } : d);
                const log = generarLog('Editó Cuenta por Cobrar', `Editó deuda de "${editandoDeudaCobrar.deudor}". Nuevo monto a favor: ${editandoDeudaCobrar.monto} ${editandoDeudaCobrar.moneda}`, editandoDeudaCobrar);
                guardarEnNube({ ...db, deudasCobrar: actualizadas, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
                setEditandoDeudaCobrar(null);
              }} className="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-sm w-full space-y-5 shadow-2xl">
                <h3 className="font-black text-white text-xl border-b border-slate-800 pb-3">Editar Deuda a mi Favor</h3>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Deudor / Concepto</label>
                    <input type="text" required value={editandoDeudaCobrar.deudor} onChange={e => setEditandoDeudaCobrar({...editandoDeudaCobrar, deudor: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Nuevo Monto a Cobrar</label>
                    <div className="flex gap-2">
                      <input type="number" step="any" required value={editandoDeudaCobrar.monto} onChange={e => setEditandoDeudaCobrar({...editandoDeudaCobrar, monto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono text-lg" />
                      <select value={editandoDeudaCobrar.moneda} onChange={e => setEditandoDeudaCobrar({...editandoDeudaCobrar, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-3 text-white font-bold"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                    </div>
                  </div>
                </div>
                <div className="flex gap-3 pt-2">
                  <button type="submit" className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition">Guardar Cambios</button>
                  <button type="button" onClick={() => setEditandoDeudaCobrar(null)} className="bg-slate-800 text-white font-bold px-5 py-3 rounded-xl transition">Cancelar</button>
                </div>
              </form>
            </div>
          )}

          {editandoStock && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={(e) => {
                e.preventDefault();
                const actualizado = db.stock.map(s => s.id === editandoStock.id ? { ...s, concepto: editandoStock.concepto, monto: parseFloat(editandoStock.monto) || 0, moneda: editandoStock.moneda } : s);
                const log = generarLog('Editó Repuesto de Stock', `Modificó características de "${editandoStock.concepto}". Precio: ${editandoStock.monto} ${editandoStock.moneda}`, editandoStock);
                guardarEnNube({ ...db, stock: actualizado, actividad: [log, ...(db.actividad || [])].slice(0, 500) });
                setEditandoStock(null);
              }} className="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-sm w-full space-y-5 shadow-2xl">
                <h3 className="font-black text-white text-xl border-b border-slate-800 pb-3">Editar Repuesto</h3>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Concepto</label>
                    <input type="text" required value={editandoStock.concepto} onChange={e => setEditandoStock({...editandoStock, concepto: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Costo Unitario</label>
                    <div className="flex gap-2">
                      <input type="number" step="any" required value={editandoStock.monto} onChange={e => setEditandoStock({...editandoStock, monto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono text-lg" />
                      <select value={editandoStock.moneda} onChange={e => setEditandoStock({...editandoStock, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-3 text-white font-bold"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                    </div>
                  </div>
                </div>
                <div className="flex gap-3 pt-2">
                  <button type="submit" className="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl transition">Guardar Cambios</button>
                  <button type="button" onClick={() => setEditandoStock(null)} className="bg-slate-800 text-white font-bold px-5 py-3 rounded-xl transition">Cancelar</button>
                </div>
              </form>
            </div>
          )}

          {editandoGastoPuntual && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={procesarEdicionGastoPuntual} className="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-sm w-full space-y-5 shadow-2xl">
                <h3 className="font-black text-white text-xl border-b border-slate-800 pb-3">Editar Gasto</h3>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Concepto</label>
                    <input type="text" required value={editandoGastoPuntual.concepto} onChange={e => setEditandoGastoPuntual({...editandoGastoPuntual, concepto: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Monto Correcto</label>
                    <div className="flex gap-2">
                      <input type="number" step="any" required value={editandoGastoPuntual.monto} onChange={e => setEditandoGastoPuntual({...editandoGastoPuntual, monto: e.target.value})} className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono text-lg" />
                      <select value={editandoGastoPuntual.moneda} onChange={e => setEditandoGastoPuntual({...editandoGastoPuntual, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-3 text-white font-bold"><option value="USD">USD</option><option value="ARS">ARS</option></select>
                    </div>
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 font-bold mb-1 block">Billetera de donde salió</label>
                    <select required value={editandoGastoPuntual.walletIdOriginal} onChange={e => setEditandoGastoPuntual({...editandoGastoPuntual, walletIdOriginal: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-3 text-white text-xs font-bold">
                      <option value="">Seleccionar billetera...</option>
                      {billeterasDisponibles.map(a => <option key={a.id} value={a.id}>{a.nombre} (Disp: {a.monto})</option>)}
                    </select>
                  </div>
                </div>
                <div className="flex gap-3 pt-2">
                  <button type="submit" className="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl transition">Actualizar</button>
                  <button type="button" onClick={() => setEditandoGastoPuntual(null)} className="bg-slate-800 text-white font-bold px-5 py-3 rounded-xl transition">Cancelar</button>
                </div>
              </form>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
