                        <button type="button" onClick={() => { setMostrarCotizador(!mostrarCotizador); setMostrarPedidoMasivo(false); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition flex items-center gap-1.5 ${mostrarCotizador ? 'bg-cyan-600 text-white border-cyan-500 shadow-md' : 'bg-slate-950 text-cyan-400 border-cyan-500/40 hover:bg-slate-800'}`}>
                          <i className={`fa-solid ${mostrarCotizador ? 'fa-chevron-up' : 'fa-calculator'}`}></i>
                          {mostrarCotizador ? 'Ocultar Cotizador' : '🧮 Cotizador Mostrador (50/50 y Gremio)'}
                        </button>
                        <button type="button" onClick={() => { setMostrarPedidoMasivo(!mostrarPedidoMasivo); setMostrarCotizador(false); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition flex items-center gap-1.5 ${mostrarPedidoMasivo ? 'bg-amber-600 text-white border-amber-500 shadow-md' : 'bg-slate-950 text-amber-400 border-amber-500/40 hover:bg-slate-800'}`}>
                          <i className={`fa-solid ${mostrarPedidoMasivo ? 'fa-chevron-up' : 'fa-boxes-packing'}`}></i>
                          {mostrarPedidoMasivo ? 'Ocultar Pedido Completo' : '📦 Cargar Pedido Completo'}
                        </button>
                        {opcionesStock.length > 0 && <button onClick={limpiarHistoriaStock} className="text-slate-500 hover:text-amber-400 bg-slate-950 px-2 py-1 rounded border border-slate-800 text-xs" title="Limpiar memoria de nombres"><i className="fa-solid fa-eraser"></i></button>}
                      </div>
                    </div>

                    {/* COTIZADOR FLEXIBLE + MULTIPLICADOR GREMIO + GENERADOR DE LISTA DE PRECIOS */}
                    {mostrarCotizador && (() => {
                      const grupoSel = stockAgrupado.find(g => g.key === cotizador.grupoKey);
                      const obtenerCostoGrupoUSD = (g) => {
                        if (!g || !g.lotes || g.lotes.length === 0) return 0;
                        const ord = [...g.lotes].sort((a, b) => a.id - b.id);
                        const ult = ord[ord.length - 1];
                        return aUSDBase(ult.monto, ult.moneda, db.cotizacionDolar);
                      };

                      // Detecta Generación (11, 12, 13, 14, 15, 16) y Gama (Mini=0, Base=1, Plus=2, Pro=3, Pro Max=4)
                      const analizarJerarquiaIphone = (nombreRaw) => {
                        const low = (nombreRaw || '').toLowerCase();
                        let gen = 99;
                        const matchNum = low.match(/\b(1[1-7])\b/);
                        if (matchNum) gen = parseInt(matchNum[1]);
                        else if (low.includes('xs') || low.includes('xr')) gen = 10.5;
                        else if (low.includes(' x')) gen = 10;
                        else if (low.includes('8')) gen = 8;
                        else if (low.includes('se')) gen = 9;

                        let tier = 1; // Base por defecto
                        let sufijo = '';
                        if (low.includes('pro max') || low.includes('promax')) { tier = 4; sufijo = ' Pro Max'; }
                        else if (low.includes('pro')) { tier = 3; sufijo = ' Pro'; }
                        else if (low.includes('plus')) { tier = 2; sufijo = ' Plus'; }
                        else if (low.includes('mini')) { tier = 0; sufijo = ' Mini'; }

                        const nombreLimpio = gen < 99 ? `iPhone ${gen}${sufijo}` : nombreRaw.replace(/batería|bateria/gi, '').trim();
                        const ordenSort = (gen * 10) + tier;

                        // Puntaje de escalera (0 en 13 Base, sube por versión y por generación)
                        const genBase = gen >= 11 && gen < 99 ? (gen - 13) : 0;
                        const pesoTier = tier === 4 ? 2.6 : tier === 3 ? 1.8 : tier === 2 ? 0.6 : 0;
                        const escalonesExtra = Math.max(0, (genBase * 1.6) + pesoTier);

                        return { gen, tier, nombreLimpio, ordenSort, escalonesExtra };
                      };

                      const costoRepUSD = obtenerCostoGrupoUSD(grupoSel);
                      const costoRepARS = Math.round(costoRepUSD * db.cotizacionDolar);
                      const baseGremio = parseFloat(cotizador.baseGremioUSD) || 10;
                      const baseGanUSD = parseFloat(cotizador.gananciaObjetivoUSD) || 19;
                      const pasoEscalonUSD = parseFloat(cotizador.escalonUSD) || 3.5;

                      const calcularGananciaObjetivoModelo = (escalonesExtra = 0) => {
                        if (cotizador.modoCalculo === 'mult_gremio') {
                          return (parseFloat(cotizador.multGremio) || 0) * baseGremio;
                        }
                        if (cotizador.modoCalculo === 'escalera') {
                          return baseGanUSD + (escalonesExtra * pasoEscalonUSD);
                        }
                        return baseGanUSD;
                      };

                      const redondearPesos = (valorARS) => {
                        const red = parseInt(cotizador.redondeoARS) || 1;
                        if (red <= 1) return Math.round(valorARS);
                        return Math.round(valorARS / red) * red;
                      };

                      const recalcularPrecioIndividual = (costoBaseUSD, ganMiaUSD, monedaDest = cotizador.monedaCliente) => {
                        const totalClienteUSD = costoBaseUSD + (ganMiaUSD * 2);
                        return monedaDest === 'ARS'
                          ? redondearPesos(totalClienteUSD * db.cotizacionDolar)
                          : redondear(totalClienteUSD);
                      };

                      const infoGrupoSel = grupoSel ? analizarJerarquiaIphone(grupoSel.concepto) : { escalonesExtra: 0 };
                      const gananciaMiaObjetivoIndivUSD = calcularGananciaObjetivoModelo(infoGrupoSel.escalonesExtra);

                      const precioCliNum = parseFloat(cotizador.precioCliente) || 0;
                      const precioCliUSD = cotizador.monedaCliente === 'ARS' ? (precioCliNum / db.cotizacionDolar) : precioCliNum;
                      const precioCliARS = cotizador.monedaCliente === 'ARS' ? precioCliNum : Math.round(precioCliNum * db.cotizacionDolar);

                      const manoObraBrutaUSD = Math.max(0, precioCliUSD - costoRepUSD);
                      const sacaNegocio50USD = manoObraBrutaUSD / 2;
                      const gananciaMia50USD = manoObraBrutaUSD / 2;
                      const equivalenciaGremioActual = baseGremio > 0 ? (gananciaMia50USD / baseGremio) : 0;
                      const totalRindeLocalAmiUSD = costoRepUSD + gananciaMia50USD;

                      const precioGremioUSD = redondear(costoRepUSD + baseGremio);
                      const precioGremioARS = Math.round(precioGremioUSD * db.cotizacionDolar);

                      // Armamos la lista base desde el stock + inyectamos automáticamente iPhone 14 Pro si existe Batería 13 Pro
                      let baseItemsLista = stockAgrupado
                        .filter(g => !cotizador.soloBateriasLista || esTextoBateria(g.concepto))
                        .map(g => ({ ...g, esCompatible: false, notaCompat: '' }));

                      const bat13Pro = baseItemsLista.find(g => {
                        const j = analizarJerarquiaIphone(g.concepto);
                        return j.gen === 13 && j.tier === 3;
                      });
                      const existe14Pro = baseItemsLista.some(g => {
                        const j = analizarJerarquiaIphone(g.concepto);
                        return j.gen === 14 && j.tier === 3;
                      });

                      if (bat13Pro && !existe14Pro) {
                        baseItemsLista.push({
                          ...bat13Pro,
                          key: 'virtual_14_pro',
                          concepto: 'Bateria 14 Pro',
                          esCompatible: true,
                          notaCompat: 'Usa Bat. 13 Pro'
                        });
                      }

                      // Ordenamos por jerarquía Apple (13 -> 13 Pro -> 13 Pro Max -> 14 -> 14 Pro -> 14 Pro Max -> 15...)
                      const itemsOrdenados = baseItemsLista
                        .map(g => ({ ...g, jerarquia: analizarJerarquiaIphone(g.concepto) }))
                        .sort((a, b) => a.jerarquia.ordenSort - b.jerarquia.ordenSort);

                      // Calculamos precios y garantizamos que ningún modelo superior quede más barato que el escalón anterior
                      let pisoPrecioAnteriorARS = 0;
                      const modelosParaLista = itemsOrdenados.map(g => {
                        const cUSD = obtenerCostoGrupoUSD(g);
                        const ganSugeridaUSD = calcularGananciaObjetivoModelo(g.jerarquia.escalonesExtra);
                        const totalCliSugUSD = cUSD + (ganSugeridaUSD * 2);
                        let precioSugARS = redondearPesos(totalCliSugUSD * db.cotizacionDolar);

                        if (cotizador.modoCalculo === 'escalera' && precioSugARS < pisoPrecioAnteriorARS) {
                          precioSugARS = pisoPrecioAnteriorARS;
                        }
                        pisoPrecioAnteriorARS = precioSugARS;

                        const manualARS = cotizador.preciosManualesARS?.[g.jerarquia.nombreLimpio];
                        const precioFinalARS = manualARS !== undefined && manualARS !== '' ? (parseFloat(manualARS) || 0) : precioSugARS;
                        const precioFinalUSD = precioFinalARS / db.cotizacionDolar;
                        const manoObraRealUSD = Math.max(0, precioFinalUSD - cUSD);
                        const ganMiaRealUSD = manoObraRealUSD / 2;

                        const gremioUSD = redondear(cUSD + baseGremio);
                        const gremioARS = redondearPesos(gremioUSD * db.cotizacionDolar);

                        return {
                          key: g.key,
                          nombreLista: g.jerarquia.nombreLimpio,
                          conceptoStock: g.concepto,
                          esCompatible: g.esCompatible,
                          notaCompat: g.notaCompat,
                          stock: g.cantidadTotal,
                          costoUSD: redondear(cUSD),
                          gananciaMiaUSD: redondear(ganMiaRealUSD),
                          sacaLocalUSD: redondear(ganMiaRealUSD),
                          precioSugeridoARS: precioSugARS,
                          precioClienteARS: precioFinalARS,
                          precioClienteUSD: redondear(precioFinalUSD),
                          tieneAjusteManual: manualARS !== undefined && manualARS !== '',
                          precioGremioUSD: gremioUSD,
                          precioGremioARS: gremioARS
                        };
                      });

                      const cambiarPrecioManualFila = (nombreModelo, nuevoValorARS) => {
                        setCotizador({
                          ...cotizador,
                          preciosManualesARS: {
                            ...(cotizador.preciosManualesARS || {}),
                            [nombreModelo]: nuevoValorARS
                          }
                        });
                      };

                      const copiarListaAlPortapapeles = (tipo) => {
                        if (modelosParaLista.length === 0) return;
                        const lineas = modelosParaLista.map(m => {
                          if (tipo === 'cliente_ars') return `${m.nombreLista} - $${m.precioClienteARS.toLocaleString('es-AR')}`;
                          return `${m.nombreLista} - U$D ${m.precioGremioUSD} ($${m.precioGremioARS.toLocaleString('es-AR')})`;
                        });
                        navigator.clipboard.writeText(lineas.join('\n'));
                        setCotizador({ ...cotizador, copiadoTipo: tipo });
                        setTimeout(() => setCotizador(prev => ({ ...prev, copiadoTipo: '' })), 2500);
                      };

                      return (
                        <div className="bg-slate-950 border-2 border-cyan-500/50 rounded-2xl p-4 space-y-4 shadow-xl fade-in">
                          {/* PESTAÑAS INTERNAS: INDIVIDUAL VS LISTA DE PRECIOS EN ESCALERA */}
                          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-800 pb-3">
                            <div>
                              <h4 className="text-xs font-black text-cyan-400 uppercase tracking-wider"><i className="fa-solid fa-stairs mr-1.5"></i>Lista de Precios en Escalera y Cotizador 50/50</h4>
                              <p className="text-[11px] text-slate-400">Ordenado por jerarquía Apple (13 → 14 → 15) con compatibilidad automática 13 Pro / 14 Pro.</p>
                            </div>
                            <div className="bg-slate-900 p-1 rounded-xl border border-slate-800 flex w-full sm:w-auto">
                              <button type="button" onClick={() => setCotizador({...cotizador, modoVista: 'lista'})} className={`flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-xs font-black transition ${cotizador.modoVista === 'lista' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                                📋 Lista en Escalera ({modelosParaLista.length})
                              </button>
                              <button type="button" onClick={() => setCotizador({...cotizador, modoVista: 'individual'})} className={`flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-xs font-black transition ${cotizador.modoVista === 'individual' ? 'bg-cyan-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                                🧮 Cotizar 1 Equipo
                              </button>
                            </div>
                          </div>

                          {/* REGLA DE GANANCIA: ESCALERA POR GAMA vs MONTO FIJO vs MULTIPLICADOR GREMIO */}
                          <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-3 space-y-3">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                              <span className="text-[10px] font-black text-emerald-400 uppercase tracking-wider">
                                Modo de cálculo para tu 50% limpio:
                              </span>
                              <div className="flex gap-1.5 flex-wrap w-full sm:w-auto">
                                <button type="button" onClick={() => setCotizador({...cotizador, modoCalculo: 'escalera'})} className={`flex-1 sm:flex-initial px-2.5 py-1 rounded-lg text-[11px] font-bold border transition ${cotizador.modoCalculo === 'escalera' ? 'bg-purple-600 text-white border-purple-400' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>
                                  🪜 Escalera por Gama (Recomendado)
                                </button>
                                <button type="button" onClick={() => setCotizador({...cotizador, modoCalculo: 'fijo'})} className={`flex-1 sm:flex-initial px-2.5 py-1 rounded-lg text-[11px] font-bold border transition ${cotizador.modoCalculo === 'fijo' ? 'bg-emerald-600 text-white border-emerald-400' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>
                                  💵 USD Fijo Parejo
                                </button>
                                <button type="button" onClick={() => setCotizador({...cotizador, modoCalculo: 'mult_gremio'})} className={`flex-1 sm:flex-initial px-2.5 py-1 rounded-lg text-[11px] font-bold border transition ${cotizador.modoCalculo === 'mult_gremio' ? 'bg-amber-600 text-white border-amber-400' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>
                                  ⚡ Multiplicador Gremio
                                </button>
                              </div>
                            </div>

                            {cotizador.modoCalculo === 'escalera' && (
                              <div className="grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-center">
                                <div className="sm:col-span-4">
                                  <label className="text-[9px] font-bold text-purple-300 uppercase block mb-1">1. Ganancia Base tuya (Ej: iPhone 13 Base)</label>
                                  <div className="flex items-center bg-slate-950 border border-purple-500/50 rounded-xl px-3 py-1.5">
                                    <span className="text-emerald-400 font-mono font-black text-xs mr-1.5">+U$D</span>
                                    <input type="number" step="any" value={cotizador.gananciaObjetivoUSD} onChange={e => setCotizador({...cotizador, gananciaObjetivoUSD: e.target.value})} className="w-full bg-transparent text-white font-mono font-black text-sm focus:outline-none" />
                                    <span className="text-[10px] text-slate-500 ml-1">tuyos</span>
                                  </div>
                                </div>
                                <div className="sm:col-span-4">
                                  <label className="text-[9px] font-bold text-purple-300 uppercase block mb-1">2. Salto por Escalón (Línea y Pro/Max)</label>
                                  <div className="flex items-center bg-slate-950 border border-purple-500/50 rounded-xl px-3 py-1.5">
                                    <span className="text-purple-400 font-mono font-black text-xs mr-1.5">+U$D</span>
                                    <input type="number" step="0.5" value={cotizador.escalonUSD} onChange={e => setCotizador({...cotizador, escalonUSD: e.target.value})} className="w-full bg-transparent text-white font-mono font-black text-sm focus:outline-none" />
                                    <span className="text-[10px] text-slate-500 ml-1">por gama</span>
                                  </div>
                                </div>
                                <div className="sm:col-span-4 bg-slate-950 border border-slate-800 rounded-xl p-2 text-[10px] text-slate-400">
                                  Con <strong className="text-emerald-400">+{cotizador.gananciaObjetivoUSD} USD</strong> de base y salto de <strong className="text-purple-300">+{cotizador.escalonUSD} USD</strong>, el 13 arranca cerca de $90.000 y sube en escalera hasta el 15 Pro Max (~$145.000).
                                </div>
                              </div>
                            )}

                            {cotizador.modoCalculo === 'fijo' && (
                              <div className="grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-center">
                                <div className="sm:col-span-5">
                                  <label className="text-[9px] font-bold text-slate-400 uppercase block mb-1">Escribir Ganancia Limpia deseada (USD)</label>
                                  <div className="flex items-center bg-slate-950 border border-emerald-500/50 rounded-xl px-3 py-1.5">
                                    <span className="text-emerald-400 font-mono font-black text-xs mr-2">+U$D</span>
                                    <input type="number" step="any" value={cotizador.gananciaObjetivoUSD} onChange={e => {
                                      const val = e.target.value;
                                      const nPrecio = grupoSel ? recalcularPrecioIndividual(costoRepUSD, parseFloat(val) || 0) : cotizador.precioCliente;
                                      setCotizador({...cotizador, gananciaObjetivoUSD: val, precioCliente: String(nPrecio)});
                                    }} className="w-full bg-transparent text-white font-mono font-black text-sm focus:outline-none" />
                                  </div>
                                </div>
                                <div className="sm:col-span-7">
                                  <label className="text-[9px] font-bold text-slate-400 uppercase block mb-1">Atajos rápidos (Tu 50% neto)</label>
                                  <div className="grid grid-cols-5 gap-1.5">
                                    {[15, 20, 25, 30, 35].map(val => (
                                      <button key={val} type="button" onClick={() => {
                                        const nPrecio = grupoSel ? recalcularPrecioIndividual(costoRepUSD, val) : cotizador.precioCliente;
                                        setCotizador({...cotizador, gananciaObjetivoUSD: String(val), precioCliente: String(nPrecio)});
                                      }} className={`py-1.5 rounded-xl text-xs font-mono font-black border transition ${parseFloat(cotizador.gananciaObjetivoUSD) === val ? 'bg-emerald-600 text-white border-emerald-400' : 'bg-slate-950 text-emerald-400 border-slate-800'}`}>
                                        +${val}
                                      </button>
                                    ))}
                                  </div>
                                </div>
                              </div>
                            )}

                            {cotizador.modoCalculo === 'mult_gremio' && (
                              <div className="grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-center">
                                <div className="sm:col-span-5">
                                  <label className="text-[9px] font-bold text-amber-400 uppercase block mb-1">1 Cliente equivale a X reparaciones de Gremio (U$D {baseGremio})</label>
                                  <div className="flex items-center gap-1.5">
                                    <div className="flex-1 flex items-center bg-slate-950 border border-amber-500/50 rounded-xl px-3 py-1.5">
                                      <input type="number" step="any" value={cotizador.multGremio} onChange={e => {
                                        const mVal = e.target.value;
                                        const ganUSD = (parseFloat(mVal) || 0) * baseGremio;
                                        const nPrecio = grupoSel ? recalcularPrecioIndividual(costoRepUSD, ganUSD) : cotizador.precioCliente;
                                        setCotizador({...cotizador, multGremio: mVal, precioCliente: String(nPrecio)});
                                      }} className="w-full bg-transparent text-amber-400 font-mono font-black text-sm focus:outline-none" />
                                      <span className="text-[10px] text-slate-400 font-bold ml-1">x Gremio</span>
                                    </div>
                                    <span className="text-xs font-mono font-black text-emerald-400 bg-slate-950 border border-slate-800 px-2.5 py-2 rounded-xl shrink-0">
                                      = +U$D {redondear((parseFloat(cotizador.multGremio) || 0) * baseGremio)} tuyos
                                    </span>
                                  </div>
                                </div>
                                <div className="sm:col-span-7">
                                  <label className="text-[9px] font-bold text-slate-400 uppercase block mb-1">Multiplicadores rápidos</label>
                                  <div className="grid grid-cols-5 gap-1.5">
                                    {[1.5, 2, 2.5, 3, 3.5].map(m => (
                                      <button key={m} type="button" onClick={() => {
                                        const ganUSD = m * baseGremio;
                                        const nPrecio = grupoSel ? recalcularPrecioIndividual(costoRepUSD, ganUSD) : cotizador.precioCliente;
                                        setCotizador({...cotizador, multGremio: String(m), precioCliente: String(nPrecio)});
                                      }} className={`py-1.5 rounded-xl text-xs font-mono font-black border transition ${parseFloat(cotizador.multGremio) === m ? 'bg-amber-600 text-white border-amber-400' : 'bg-slate-950 text-amber-400 border-slate-800'}`}>
                                        {m}x (${m * baseGremio})
                                      </button>
                                    ))}
                                  </div>
                                </div>
                              </div>
                            )}
                          </div>

                          {/* VISTA 1: LISTA DE PRECIOS EN ESCALERA (CON RETOQUE POR MODELO Y COPIADO LIMPIO) */}
                          {cotizador.modoVista === 'lista' && (
                            <div className="space-y-3 pt-1">
                              <div className="flex flex-wrap justify-between items-center gap-2 bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                                <div className="flex items-center gap-2 flex-wrap">
                                  <div className="flex items-center gap-1 text-[11px] text-slate-400">
                                    <span>Redondeo:</span>
                                    <select value={cotizador.redondeoARS} onChange={e => setCotizador({...cotizador, redondeoARS: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-white font-mono text-xs">
                                      <option value="5000">Cada $5.000</option>
                                      <option value="1000">Cada $1.000</option>
                                      <option value="500">Cada $500</option>
                                    </select>
                                  </div>
                                  {Object.keys(cotizador.preciosManualesARS || {}).length > 0 && (
                                    <button type="button" onClick={() => setCotizador({...cotizador, preciosManualesARS: {}})} className="text-[11px] text-amber-400 hover:underline font-bold px-2 py-1 bg-slate-950 rounded-lg border border-slate-800">
                                      ↺ Restaurar precios automáticos
                                    </button>
                                  )}
                                </div>

                                <div className="flex gap-1.5 flex-wrap">
                                  <button type="button" onClick={() => copiarListaAlPortapapeles('cliente_ars')} className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow">
                                    <i className={`fa-solid ${cotizador.copiadoTipo === 'cliente_ars' ? 'fa-check' : 'fa-copy'}`}></i>
                                    {cotizador.copiadoTipo === 'cliente_ars' ? '¡Copiada (Formato Escalera)!' : 'Copiar Lista Clientes (ARS)'}
                                  </button>
                                  <button type="button" onClick={() => copiarListaAlPortapapeles('gremio_usd')} className="bg-amber-600 hover:bg-amber-500 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow">
                                    <i className={`fa-solid ${cotizador.copiadoTipo === 'gremio_usd' ? 'fa-check' : 'fa-copy'}`}></i>
                                    {cotizador.copiadoTipo === 'gremio_usd' ? '¡Lista Gremio Copiada!' : 'Copiar Lista Gremio'}
                                  </button>
                                </div>
                              </div>

                              <div className="max-h-96 overflow-y-auto space-y-1.5 pr-1">
                                {modelosParaLista.map(item => (
                                  <div key={item.nombreLista} className="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-2.5 grid grid-cols-1 sm:grid-cols-12 gap-2 items-center text-xs">
                                    <div className="sm:col-span-4 flex items-center justify-between sm:block">
                                      <div className="flex items-center gap-1.5 flex-wrap">

                          const recP = parseFloat(pedidoMasivo.recargoPorc) || 0;
                          const dProv = parseFloat(pedidoMasivo.dolarProveedor) || 0;
                          const dSist = parseFloat(db.cotizacionDolar) || 1500;
                          const dUsado = dProv > 0 ? dProv : dSist;
                          const fDesc = Math.max(0, 1 - (descP / 100));
                          const fRec = 1 + (recP / 100);

                          const totalUnid = pedidoMasivo.items.reduce((acc, i) => acc + parseInt(i.cantidad), 0);
                          const subLista = pedidoMasivo.items.reduce((acc, i) => acc + (parseFloat(i.precioLista) * parseInt(i.cantidad)), 0);
                          const montoAhorrado = subLista * (1 - fDesc);
                          const subConDesc = subLista * fDesc;

                          // Paso a paso real: (Subtotal con descuento * Dólar Proveedor) + % Recargo en ARS -> dividido Dólar Sistema
                          const subEnARS = pedidoMasivo.moneda === 'USD' ? (subConDesc * dUsado) : subConDesc;
                          const montoRecargoARS = subEnARS * (fRec - 1);
                          const totalFinalARS = Math.round(subEnARS * fRec);
                          const totalFinalSistemaUSD = pedidoMasivo.moneda === 'USD'
                            ? redondear((subEnARS * fRec) / dSist)
                            : Math.round(subEnARS * fRec);

                          return (

                                  const pConDesc = pLista * fDesc;
                                  const pEnARS = pedidoMasivo.moneda === 'USD' ? (pConDesc * dUsado * fRec) : (pConDesc * fRec);
                                  const pFinalARS = Math.round(pEnARS);
                                  const pFinalSistema = pedidoMasivo.moneda === 'USD' ? redondear(pEnARS / dSist) : Math.round(pEnARS);
                                  return (

                                        <p className="text-[11px] text-slate-400 font-mono">
                                          Lista: {pLista} {pedidoMasivo.moneda} {descP > 0 ? `(-${descP}% = ${redondear(pConDesc)} ${pedidoMasivo.moneda})` : ''}
                                          <span className="text-emerald-400 font-bold ml-2">
                                            ➔ Real Sistema: {pFinalSistema} {pedidoMasivo.moneda} c/u (${pFinalARS.toLocaleString('es-AR')} ARS)
                                          </span>
                                        </p>
                                      </div>
                                      <div className="flex items-center gap-2 self-end sm:self-center shrink-0">

                                          <span className="px-2.5 py-0.5 font-mono font-black text-amber-400 text-xs border-x border-slate-700">{it.cantidad}</span>
                                          <button type="button" onClick={() => cambiarCantItemPedidoMasivo(it.idTemp, 1)} className="px-2 py-0.5 hover:bg-slate-800 text-slate-300 font-bold">+</button>
                                        </div>
                                        <button type="button" onClick={() => quitarItemDePedidoMasivo(it.idTemp)} className="bg-rose-950 hover:bg-rose-900 text-rose-400 w-6 h-6 rounded-lg text-xs"><i className="fa-solid fa-trash"></i></button>
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>

                              {/* TABLERO DE VERIFICACIÓN DE TOTALES */}

                          <div className="bg-purple-950/30 border border-purple-500/40 rounded-xl p-2.5 flex items-center justify-between gap-2">
                            <div>

                            </div>
                            <input type="number" min="1" value={filtroStats.simuladorCompra} onChange={e => setFiltroStats({...filtroStats, simuladorCompra: e.target.value})} className="w-16 bg-slate-950 border border-purple-500 rounded-lg px-2 py-1 text-center font-mono font-black text-white text-sm focus:outline-none" />
                          </div>
                        </div>

                        <div className="pt-2 space-y-3">

                          {estadisticasConsumo.items.length === 0 ? (

                                    <div>

                                          {item.porcentaje.toFixed(1)}% de rotación
                                        </span>
                                        <span className="bg-slate-900 border border-amber-500/40 text-amber-400 px-2 py-0.5 rounded text-[10px] font-mono font-bold">

                                        <span className="text-cyan-400"><i className="fa-solid fa-user mr-1"></i>Cliente: <strong>{item.cliente}</strong></span>

                                        <span className="text-slate-500 font-mono text-[10px]">• Stock ideal tras compra: <strong>{Math.round(item.stockIdeal)} unid.</strong></span>

                                    <div className={`bg-slate-900 border rounded-lg px-3 py-1.5 text-right shrink-0 w-full sm:w-auto flex sm:block justify-between items-center ${item.sugerenciaCompra > 0 ? 'border-emerald-500/40' : 'border-slate-800'}`}>
                                      <span className="text-[9px] text-slate-400 font-bold uppercase block">Sugerido p/ equilibrar stock:</span>

                                    </div>

                                  <div className="w-full bg-slate-900 rounded-full h-2 border border-slate-800 overflow-hidden flex">

              )}

              {/* VISTA NUEVA: CALCULADORA DE CUOTAS POSNET (INDIVIDUAL Y MULTI-EQUIPO) */}
              {vista === 'cuotas' && (() => {
                const montoNum = parseFloat(calcCuotas.monto) || 0;
                const extraNum = parseFloat(calcCuotas.extraDolar) || 0;
                const dolarContado = parseFloat(db.cotizacionDolar) || 1500;
                const dolarPosnet = dolarContado + extraNum;
                const pasoRedondeo = parseInt(calcCuotas.redondeo) || 1;
                const itemsMulti = calcCuotas.items || [];
                const enModoMulti = itemsMulti.length > 0;

                const calcularBloqueCuotas = (valMonto, valMoneda) => {
                  const mNum = parseFloat(valMonto) || 0;
                  const mEqUSD = valMoneda === 'USD' ? mNum : (mNum / dolarContado);
                  const bContadoARS = valMoneda === 'USD' ? Math.round(mNum * dolarContado) : Math.round(mNum);
                  const bPosnetARS = Math.round(mEqUSD * dolarPosnet);
                  const planesCalc = (calcCuotas.planes || []).map((p, idx) => {
                    const rec = parseFloat(p.recargo) || 0;
                    const totBruto = bPosnetARS * (1 + (rec / 100));
                    const cBruta = totBruto / p.cuotas;
                    const vCuota = pasoRedondeo > 1 ? Math.round(cBruta / pasoRedondeo) * pasoRedondeo : Math.round(cBruta);
                    const totFinal = pasoRedondeo > 1 ? (vCuota * p.cuotas) : Math.round(totBruto);
                    return { ...p, idx, valorCuota: vCuota, totalFinal: totFinal };
                  });
                  return { montoNum: mNum, montoEquivUSD: mEqUSD, baseContadoARS: bContadoARS, basePosnetARS: bPosnetARS, planes: planesCalc };
                };

                const agregarEquipoAListaCuotas = () => {
                  if (montoNum <= 0) return alert('Ingresá un precio base mayor a 0 para sumarlo a la lista.');
                  const nombreLim = calcCuotas.concepto.trim() || `Equipo #${itemsMulti.length + 1}`;
                  const nuevoItem = { id: Date.now() + Math.random(), concepto: nombreLim, monto: montoNum, moneda: calcCuotas.moneda };
                  setCalcCuotas({ ...calcCuotas, items: [...itemsMulti, nuevoItem], concepto: '', monto: '' });
                };

                const quitarEquipoDeListaCuotas = (idItem) => {
                  setCalcCuotas({ ...calcCuotas, items: itemsMulti.filter(i => i.id !== idItem) });
                };

                const parsearMontoTexto = (str) => {
                  let limpio = (str || '').trim();
                  if (/^\d{1,3}(\.\d{3})+$/.test(limpio)) {
                    limpio = limpio.replace(/\./g, '');
                  } else if (limpio.includes('.') && limpio.includes(',')) {
                    if (limpio.lastIndexOf(',') > limpio.lastIndexOf('.')) {
                      limpio = limpio.replace(/\./g, '').replace(',', '.');
                    } else {
                      limpio = limpio.replace(/,/g, '');
                    }
                  } else if (limpio.includes(',')) {
                    if (/^\d{1,3}(,\d{3})+$/.test(limpio)) limpio = limpio.replace(/,/g, '');
                    else limpio = limpio.replace(',', '.');
                  }
                  return parseFloat(limpio) || 0;
                };

                const detectarPrecioEnLinea = (linea) => {
                  const matchUsdPost = linea.match(/\$?\s*(\d[\d.,]*)\s*(?:\b(?:usd|dólares|dolares)\b|u\$d|u\$s|us\$)/i);
                  if (matchUsdPost) {
                    const val = parsearMontoTexto(matchUsdPost[1]);
                    if (val > 0) return { monto: val, moneda: 'USD' };
                  }
                  const matchUsdPre = linea.match(/(?:\b(?:usd)\b|u\$d|u\$s|us\$)\s*\$?\s*(\d[\d.,]*)/i);
                  if (matchUsdPre) {
                    const val = parsearMontoTexto(matchUsdPre[1]);
                    if (val > 0) return { monto: val, moneda: 'USD' };
                  }
                  const matchArsPost = linea.match(/\$?\s*(\d[\d.,]*)\s*\b(?:ars|pesos)\b/i);
                  if (matchArsPost) {
                    const val = parsearMontoTexto(matchArsPost[1]);
                    if (val > 0) return { monto: val, moneda: 'ARS' };
                  }
                  const matchArsPre = linea.match(/\bars\s*\$?\s*(\d[\d.,]*)/i);
                  if (matchArsPre) {
                    const val = parsearMontoTexto(matchArsPre[1]);
                    if (val > 0) return { monto: val, moneda: 'ARS' };
                  }
                  const todosPesos = [...linea.matchAll(/\$\s*(\d[\d.,]*)/g)];
                  if (todosPesos.length > 0) {
                    const val = parsearMontoTexto(todosPesos[todosPesos.length - 1][1]);
                    if (val > 0) return { monto: val, moneda: val < 10000 ? 'USD' : 'ARS' };
                  }
                  return null;
                };

                const procesarListaPegadaCuotas = (sumarALaActual = false, copiarDirecto = false) => {
                  const lineasRaw = (calcCuotas.textoMasivo || '').split('\n');
                  const detectados = [];
                  lineasRaw.forEach((l, idxL) => {
                    const lineaTrim = l.trim();
                    if (!lineaTrim) return;
                    const precioDet = detectarPrecioEnLinea(lineaTrim);
                    if (!precioDet) return;
                    const tituloLimpio = lineaTrim.replace(/^(?:📱\s*|\*\s*|[-•]\s*)+/, '').replace(/\*+$/, '').trim();
                    detectados.push({
                      id: Date.now() + idxL + Math.random(),
                      concepto: tituloLimpio,
                      monto: precioDet.monto,
                      moneda: precioDet.moneda
                    });
                  });

                  if (detectados.length === 0) {
                    return alert('No detecté precios en el texto. Revisá que cada línea tenga el valor (ej: $1245 USD o $90.000).');
                  }

                  const listaFinal = sumarALaActual ? [...itemsMulti, ...detectados] : detectados;

                  if (copiarDirecto) {
                    const bloques = listaFinal.map(it => {
                      const c = calcularBloqueCuotas(it.monto, it.moneda);
                      const renglones = [`📱 *${it.concepto}*`];
                      c.planes.filter(p => p.activo).forEach(p => {
                        const txtTotal = calcCuotas.mostrarTotalEnTexto ? ` (Total: $${p.totalFinal.toLocaleString('es-AR')})` : '';
                        renglones.push(`- *${p.cuotas} cuotas fijas* de $${p.valorCuota.toLocaleString('es-AR')}${txtTotal}`);
                      });
                      return renglones.join('\n');
                    });
                    navigator.clipboard.writeText(bloques.join('\n\n'));
                  }

                  setCalcCuotas({
                    ...calcCuotas,
                    items: listaFinal,
                    modoMulti: 'separado',
                    incluirContado: false,
                    mostrarMasivo: false,
                    copiado: copiarDirecto
                  });
                  if (copiarDirecto) {
                    setTimeout(() => setCalcCuotas(prev => ({ ...prev, copiado: false })), 2500);
                  }
                };

                const togglePlanCuota = (idx) => {
                  const copia = calcCuotas.planes.map((p, i) => i === idx ? { ...p, activo: !p.activo } : p);
                  setCalcCuotas({ ...calcCuotas, planes: copia });
                };

                const cambiarRecargoPlan = (idx, nuevoRec) => {
                  const copia = calcCuotas.planes.map((p, i) => i === idx ? { ...p, recargo: nuevoRec } : p);
                  setCalcCuotas({ ...calcCuotas, planes: copia });
                };

                // Cálculos activos: individual, multi por separado o multi en combo
                const calcIndividual = calcularBloqueCuotas(montoNum, calcCuotas.moneda);
                const itemsCalculados = itemsMulti.map(it => ({ ...it, calc: calcularBloqueCuotas(it.monto, it.moneda) }));
                const totalComboUSD = itemsCalculados.reduce((acc, it) => acc + it.calc.montoEquivUSD, 0);
                const calcCombo = calcularBloqueCuotas(totalComboUSD, 'USD');

                const planesVisiblesTarjetas = !enModoMulti
                  ? calcIndividual.planes
                  : (calcCuotas.modoMulti === 'combo' ? calcCombo.planes : (montoNum > 0 ? calcIndividual.planes : calcCombo.planes));

                const armarTextoWhatsapp = () => {
                  const lineas = [];

                  if (!enModoMulti) {
                    if (montoNum <= 0) return '';
                    if (calcCuotas.concepto.trim()) lineas.push(`📱 *${calcCuotas.concepto.trim()}*`);
                    if (calcCuotas.incluirContado) {
                      if (calcCuotas.moneda === 'USD') {
                        lineas.push(`💵 Efectivo / Transferencia: *U$D ${montoNum.toLocaleString('es-AR')}* ($${calcIndividual.baseContadoARS.toLocaleString('es-AR')})`);
                      } else {
                        lineas.push(`💵 Efectivo / Transferencia: *$${calcIndividual.baseContadoARS.toLocaleString('es-AR')}*`);
                      }
                    }
                    lineas.push(`💳 *Tarjeta de Crédito (Cuotas Fijas):*`);
                    calcIndividual.planes.filter(p => p.activo).forEach(p => {
                      const txtTotal = calcCuotas.mostrarTotalEnTexto ? ` (Total: $${p.totalFinal.toLocaleString('es-AR')})` : '';
                      lineas.push(`- *${p.cuotas} cuotas fijas* de $${p.valorCuota.toLocaleString('es-AR')}${txtTotal}`);
                    });
                    return lineas.join('\n');
                  }

                  if (calcCuotas.modoMulti === 'combo') {
                    lineas.push(`📦 *COTIZACIÓN COMBINADA (${itemsCalculados.length} ítems)*`);
                    itemsCalculados.forEach(it => {
                      const pStr = it.moneda === 'USD'
                        ? `U$D ${parseFloat(it.monto).toLocaleString('es-AR')}`
                        : `$${Math.round(parseFloat(it.monto)).toLocaleString('es-AR')}`;
                      lineas.push(`▪️ ${it.concepto} (${pStr})`);
                    });
                    if (calcCuotas.incluirContado) {
                      lineas.push(`💵 *Total Contado / Transf.:* U$D ${redondear(totalComboUSD).toLocaleString('es-AR')} ($${calcCombo.baseContadoARS.toLocaleString('es-AR')})`);
                    }
                    lineas.push(`💳 *Tarjeta de Crédito (Cuotas Fijas por todo junto):*`);
                    calcCombo.planes.filter(p => p.activo).forEach(p => {
                      const txtTotal = calcCuotas.mostrarTotalEnTexto ? ` (Total: $${p.totalFinal.toLocaleString('es-AR')})` : '';
                      lineas.push(`- *${p.cuotas} cuotas fijas* de $${p.valorCuota.toLocaleString('es-AR')}${txtTotal}`);
                    });
                    return lineas.join('\n');
                  }

                  // Modo Multi: Por separado (comparar varios equipos en 1 solo mensaje)
                  itemsCalculados.forEach((it, idxIt) => {
                    if (idxIt > 0) lineas.push('');
                    lineas.push(`📱 *${it.concepto}*`);
                    if (calcCuotas.incluirContado) {
                      if (it.moneda === 'USD') {
                        lineas.push(`💵 Efectivo / Transf.: *U$D ${parseFloat(it.monto).toLocaleString('es-AR')}* ($${it.calc.baseContadoARS.toLocaleString('es-AR')})`);
                      } else {
                        lineas.push(`💵 Efectivo / Transf.: *$${it.calc.baseContadoARS.toLocaleString('es-AR')}*`);
                      }
                    }
                    it.calc.planes.filter(p => p.activo).forEach(p => {
                      const txtTotal = calcCuotas.mostrarTotalEnTexto ? ` (Total: $${p.totalFinal.toLocaleString('es-AR')})` : '';
                      lineas.push(`- *${p.cuotas} cuotas fijas* de $${p.valorCuota.toLocaleString('es-AR')}${txtTotal}`);
                    });
                  });
                  return lineas.join('\n');
                };

                const textoFinalWA = armarTextoWhatsapp();

                const copiarCuotasCliente = () => {
                  if (!textoFinalWA) return alert('Ingresá un monto o sumá equipos a la lista primero.');
                  navigator.clipboard.writeText(textoFinalWA);
                  setCalcCuotas({ ...calcCuotas, copiado: true });
                  setTimeout(() => setCalcCuotas(prev => ({ ...prev, copiado: false })), 2500);
                };

                return (
                  <div className="max-w-4xl mx-auto space-y-5 fade-in">
                    {/* TARJETA DE INGRESO DE MONTO Y CONFIGURACIÓN */}
                    <div className="bg-slate-900 border border-indigo-500/30 rounded-2xl p-4 sm:p-5 space-y-4 shadow-xl">
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-800 pb-3">
                        <div>
                          <h3 className="text-sm font-black text-white flex items-center gap-2">
                            <i className="fa-solid fa-credit-card text-indigo-400"></i> Simulador de Cuotas Posnet (1 o Varios Equipos)
                          </h3>
                          <p className="text-[11px] text-slate-400">Cotizá al instante, sumá uno por uno o pegá una lista entera para calcular todo junto.</p>
                        </div>
                        <div className="flex items-center gap-2 flex-wrap">
                          <button type="button" onClick={() => setCalcCuotas({...calcCuotas, mostrarMasivo: !calcCuotas.mostrarMasivo})} className={`px-3 py-2 rounded-xl text-xs font-black border transition flex items-center gap-1.5 ${calcCuotas.mostrarMasivo ? 'bg-indigo-600 text-white border-indigo-400 shadow-md' : 'bg-slate-950 text-indigo-300 border-indigo-500/50 hover:bg-slate-800'}`}>
                            <i className={`fa-solid ${calcCuotas.mostrarMasivo ? 'fa-chevron-up' : 'fa-wand-magic-sparkles'}`}></i>
                            {calcCuotas.mostrarMasivo ? 'Ocultar Pegado' : '📋 Pegar Lista Masiva'}
                          </button>
                          <div className="bg-indigo-950/60 border border-indigo-500/40 rounded-xl px-3 py-1.5 text-right shrink-0">
                            <span className="text-[9px] font-bold text-indigo-300 uppercase block">Dólar Posnet Aplicado</span>
                            <span className="font-mono font-black text-white text-sm">
                              $ {dolarPosnet.toLocaleString('es-AR')} <span className="text-[10px] font-normal text-indigo-300">(${dolarContado} + ${extraNum})</span>
                            </span>
                          </div>
                        </div>
                      </div>

                      {/* CAJA DE PEGADO MASIVO AUTOMÁTICO */}
                      {calcCuotas.mostrarMasivo && (
                        <div className="bg-slate-950 border-2 border-indigo-500/50 rounded-xl p-3.5 space-y-2.5 fade-in">
                          <div className="flex justify-between items-center gap-2">
                            <label className="text-[10px] font-black text-indigo-300 uppercase tracking-wider">
                              <i className="fa-solid fa-paste mr-1.5"></i>Pegá acá tus líneas de equipos (1 por renglón, en USD o ARS)
                            </label>
                            {calcCuotas.textoMasivo && (
                              <button type="button" onClick={() => setCalcCuotas({...calcCuotas, textoMasivo: ''})} className="text-[10px] text-slate-400 hover:text-rose-400 font-bold">Limpiar texto</button>
                            )}
                          </div>
                          <textarea
                            rows="4"
                            autoFocus
                            placeholder={'Pegá tu lista acá, por ejemplo:\niPhone 17 Pro Max | 256 GB | 🔋 96-99% | 🎨 Naranja | 💵 $1245 USD\niPhone 17 Pro Max | 256 GB | 🔋 95% | 🎨 Silver | 💵 $1235 USD'}
                            value={calcCuotas.textoMasivo || ''}
                            onChange={e => setCalcCuotas({...calcCuotas, textoMasivo: e.target.value})}
                            className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-xs font-mono focus:outline-none focus:border-indigo-500 resize-y"
                          ></textarea>
                          <div className="flex flex-wrap gap-2 justify-end">
                            {enModoMulti && (
                              <button type="button" onClick={() => procesarListaPegadaCuotas(true, false)} className="bg-slate-800 hover:bg-slate-700 text-indigo-300 font-bold px-3 py-2 rounded-xl text-xs transition border border-indigo-500/30">
                                <i className="fa-solid fa-plus mr-1"></i>Sumar a la lista actual
                              </button>
                            )}
                            <button type="button" onClick={() => procesarListaPegadaCuotas(false, false)} className="bg-indigo-600 hover:bg-indigo-500 text-white font-black px-3.5 py-2 rounded-xl text-xs transition shadow">
                              <i className="fa-solid fa-calculator mr-1.5"></i>Calcular Lista
                            </button>
                            <button type="button" onClick={() => procesarListaPegadaCuotas(false, true)} className="bg-emerald-600 hover:bg-emerald-500 text-white font-black px-3.5 py-2 rounded-xl text-xs transition shadow">
                              <i className="fa-solid fa-bolt mr-1.5"></i>Calcular y Copiar Directo
                            </button>
                          </div>
                        </div>
                      )}

                      <div className="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
                        <div className="sm:col-span-4">
                          <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Equipo o Reparación</label>
                          <input type="text" placeholder="Ej: iPhone 15 Pro 256GB / Bat. 13 Pro" value={calcCuotas.concepto} onChange={e => setCalcCuotas({...calcCuotas, concepto: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-indigo-500" />
                        </div>

                        <div className="sm:col-span-3">
                          <label className="text-[10px] font-bold text-indigo-400 uppercase block mb-1">Precio Base</label>
                          <div className="flex">
                            <input type="number" step="any" placeholder="Ej: 650 o 110000" value={calcCuotas.monto} onChange={e => setCalcCuotas({...calcCuotas, monto: e.target.value})} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); agregarEquipoAListaCuotas(); } }} className="w-full min-w-0 bg-slate-950 border border-indigo-500/60 rounded-l-xl px-3 py-2 text-white font-mono font-black text-sm focus:outline-none" />
                            <select value={calcCuotas.moneda} onChange={e => setCalcCuotas({...calcCuotas, moneda: e.target.value})} className="bg-slate-950 border border-indigo-500/60 border-l-0 rounded-r-xl px-2.5 py-2 text-white text-xs font-black">
                              <option value="USD">USD</option>
                              <option value="ARS">ARS</option>
                            </select>
                          </div>
                        </div>

                        <div className="sm:col-span-2">
                          <label className="text-[10px] font-bold text-amber-400 uppercase block mb-1">Extra Dólar ($)</label>
                          <input type="number" step="10" value={calcCuotas.extraDolar} onChange={e => setCalcCuotas({...calcCuotas, extraDolar: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-2 text-amber-400 font-mono font-bold text-xs text-center" />
                        </div>

                        <div className="sm:col-span-3 flex gap-1.5">
                          <div className="w-24 shrink-0">
                            <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Redondeo</label>

                e.preventDefault();
              if (!window.confirm(`¿Confirmás guardar los cambios en esta reparación histórica?`)) return;
                const mOrig = parseFloat(editandoRepHist.nuevoMonto) || 0;
                const monOrig = editandoRepHist.nuevaMoneda || 'USD';
                const nvoMontoUSD = aUSDBase(mOrig, monOrig, db.cotizacionDolar);
                const antMontoUSD = parseFloat(editandoRepHist.montoCobrado) || 0;
                const diffUSD = nvoMontoUSD - antMontoUSD;
                const diasG = parseInt(editandoRepHist.nuevosDiasGarantia) || 0;

                let deudasCb = [...(db.deudasCobrar || [])];
                const eqOrig = editandoRepHist.equipoOriginal || {};
                const imeiEq = eqOrig.imei || '';
                const nomCli = (eqOrig.clienteNombre || '').toLowerCase().trim();
                const modEq = (eqOrig.modelo || '').toLowerCase().trim();

                // 1. Si es GREMIO: actualiza el 100% de la diferencia en Cuentas a Cobrar
                if (eqOrig.origen === 'gremio' && Math.abs(diffUSD) > 0.001) {
                  const nomGremio = eqOrig.gremio;
                  const idx = deudasCb.findIndex(d => d.deudor === nomGremio && d.motivo === "Acumulado de Reparaciones Gremio");
                  if (idx !== -1) {
                    const nvoSaldo = Math.max(0, parseFloat(deudasCb[idx].monto) + diffUSD);
                    const movsAct = (deudasCb[idx].movimientos || []).map(m => {
                      if (imeiEq && m.detalle && m.detalle.includes(imeiEq)) {
                        return { ...m, titulo: `${eqOrig.modelo} (${editandoRepHist.nuevaFalla.trim()})`, montoUSD: nvoMontoUSD, monto: nvoMontoUSD };
                      }
                      return m;
                    });
                    deudasCb[idx] = { ...deudasCb[idx], monto: redondear(nvoSaldo), movimientos: movsAct };
                  }
                }

                // 2. Si es CLIENTE MINORISTA (y ya fue cobrado / enviado a Cuentas a Cobrar): recalcula Costo Repuesto + 50% Ganancia
                if (eqOrig.origen === 'cliente' && editandoRepHist.estadoCobro !== 'pendiente' && Math.abs(diffUSD) > 0.001) {
                  const costoRepUSD = parseFloat(editandoRepHist.costoRepuestoUSD) || 0;
                  const antCorrespondeUSD = costoRepUSD + ((antMontoUSD - costoRepUSD) / 2);
                  const nvoCorrespondeUSD = costoRepUSD + ((nvoMontoUSD - costoRepUSD) / 2);
                  const diffClienteUSD = nvoCorrespondeUSD - antCorrespondeUSD;

                  const coincideMovCliente = (m) => {
                    const tit = (m.titulo || '').toLowerCase();
                    const det = (m.detalle || '').toLowerCase();
                    if (imeiEq && (det.includes(imeiEq.toLowerCase()) || tit.includes(imeiEq.toLowerCase()))) return true;
                    if (nomCli && (tit.includes(nomCli) || det.includes(nomCli)) && (!modEq || tit.includes(modEq) || det.includes(modEq))) return true;
                    return false;
                  };

                  let idxC = deudasCb.findIndex(d => (d.movimientos || []).some(coincideMovCliente));
                  if (idxC === -1) {
                    idxC = deudasCb.findIndex(d => 
                      (d.motivo || '').toLowerCase().includes('taller') || 
                      (d.motivo || '').toLowerCase().includes('50%') ||
                      ((d.motivo || '').toLowerCase().includes('reparaciones') && d.deudor !== eqOrig.gremio)
                    );
                  }

                  if (idxC !== -1) {
                    const esDeudaARS = deudasCb[idxC].moneda === 'ARS';
                    const deltaAplicar = esDeudaARS ? (diffClienteUSD * db.cotizacionDolar) : diffClienteUSD;
                    const nvoMontoMov = esDeudaARS ? Math.round(nvoCorrespondeUSD * db.cotizacionDolar) : redondear(nvoCorrespondeUSD);
                    const nvoSaldo = Math.max(0, parseFloat(deudasCb[idxC].monto) + deltaAplicar);

                    let actualizoAlgunMov = false;
                    const movsAct = (deudasCb[idxC].movimientos || []).map(m => {
                      if (!actualizoAlgunMov && coincideMovCliente(m)) {
                        actualizoAlgunMov = true;
                        return {
                          ...m,
                          montoUSD: nvoCorrespondeUSD,
                          monto: nvoMontoMov
                        };
                      }
                      return m;
                    });

                    deudasCb[idxC] = {
                      ...deudasCb[idxC],
                      monto: esDeudaARS ? Math.round(nvoSaldo) : redondear(nvoSaldo),
                      movimientos: movsAct
                    };
                  }
                }

                const repsAc = (db.reparacionesFin || []).map(r => {
                  if (r.id === editandoRepHist.id) {
                    const cobradoYaUSD = Math.max(0, antMontoUSD - (parseFloat(r.montoAdeudadoRestante) || 0));
                    const nuevoRestante = r.estadoCobro === 'pendiente' ? Math.max(0, nvoMontoUSD - cobradoYaUSD) : 0;
                    const pagosAct = (Array.isArray(r.detallePagos) && r.detallePagos.length === 1 && r.estadoCobro !== 'pendiente')
                      ? [{ ...r.detallePagos[0], monto: mOrig, moneda: monOrig, montoUSD: nvoMontoUSD }]
                      : (r.detallePagos || []);
                    return {
                      ...r,
                      montoCobradoOriginal: mOrig,
                      monedaCobroOriginal: monOrig,
                      montoCobrado: nvoMontoUSD,
                      montoAdeudadoRestante: nuevoRestante,

                      diasGarantia: diasG,
                      equipoOriginal: { ...r.equipoOriginal, falla: editandoRepHist.nuevaFalla.trim() }
                    };
                  }
                  return r;
                });

                const log = generarLog('Editó Reparación Histórica', `Modificó ${eqOrig.modelo} a ${mOrig} ${monOrig}.`);
                guardarEnNube({ ...db, reparacionesFin: repsAc, deudasCobrar: deudasCb, actividad: [log, ...(db.actividad || [])].slice(0, 500) });

                    <div>
                      <label className="text-slate-400 font-bold mb-1 block">Modelo</label>
                      <input type="text" required value={editandoTaller.modelo} onChange={e => setEditandoTaller({...editandoTaller, modelo: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                    </div>
                    <div>
                      <label className="text-slate-400 font-bold mb-1 block">IMEI (15 núm.)</label>
                      <input type="text" maxLength="15" required value={editandoTaller.imei} onChange={e => setEditandoTaller({...editandoTaller, imei: e.target.value.replace(/\D/g, '')})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono" />
                    </div>
                  </div>

                  {editandoTaller.origen === 'cliente' ? (
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-slate-400 font-bold mb-1 block">Nombre Cliente</label>
                        <input type="text" required value={editandoTaller.clienteNombre} onChange={e => setEditandoTaller({...editandoTaller, clienteNombre: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                      </div>
                      <div>
                        <label className="text-slate-400 font-bold mb-1 block">Teléfono (10 núm.)</label>
                        <input type="text" maxLength="10" required value={editandoTaller.clienteTelefono} onChange={e => setEditandoTaller({...editandoTaller, clienteTelefono: e.target.value.replace(/\D/g, '')})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono" />
                      </div>
                    </div>
                  ) : (
                    <div>
                      <label className="text-slate-400 font-bold mb-1 block">Gremio / Mayorista</label>
                      <input type="text" required value={editandoTaller.gremio} onChange={e => setEditandoTaller({...editandoTaller, gremio: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                    </div>
                  )}

                  <div>
                    <label className="text-slate-400 font-bold mb-1 block">Falla Declarada / Trabajo a realizar</label>
                    <input type="text" required value={editandoTaller.falla} onChange={e => setEditandoTaller({...editandoTaller, falla: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold mb-1 block">Estado Visual / Observaciones</label>
                    <textarea rows="2" required value={editandoTaller.estadoVisual} onChange={e => setEditandoTaller({...editandoTaller, estadoVisual: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white resize-none"></textarea>
                  </div>
                  {editandoTaller.origen === 'cliente' && (
                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 space-y-2">
                      <label className="text-amber-400 font-bold block">¿Fue reparado o abierto antes?</label>
                      <select value={editandoTaller.reparadoAntesIngreso || 'no'} onChange={e => setEditandoTaller({...editandoTaller, reparadoAntesIngreso: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white font-bold">
                        <option value="no">No</option>
                        <option value="si">Sí, ya había sido reparado / abierto</option>
                        <option value="no_sabe">Cliente no sabe</option>
                      </select>
                      {editandoTaller.reparadoAntesIngreso === 'si' && (
                        <input type="text" placeholder="Detalle de reparación previa..." value={editandoTaller.detalleReparadoIngreso || ''} onChange={e => setEditandoTaller({...editandoTaller, detalleReparadoIngreso: e.target.value})} className="w-full bg-slate-900 border border-amber-500/50 rounded-lg px-2.5 py-1.5 text-white" />
                      )}
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-cyan-400 font-bold mb-1 block">Estado en Taller</label>
                      <select value={editandoTaller.estadoTaller || 'En revisión'} onChange={e => setEditandoTaller({...editandoTaller, estadoTaller: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-2 text-white font-bold">
                        <option value="En revisión">🔍 En revisión</option>
                        <option value="Esperando repuesto">⏳ Esperando repuesto</option>
                        <option value="Presupuesto pasado">💬 Presupuesto pasado</option>
                        <option value="En reparación">🔧 En reparación</option>
                        <option value="Listo / A retirar">✅ Listo / A retirar</option>
                        <option value="Sin solución">❌ Sin solución</option>
                      </select>
                    </div>
                    {editandoTaller.origen === 'cliente' && (
                      <div>
                        <label className="text-emerald-400 font-bold mb-1 block">Presupuesto</label>
                        <div className="flex">
                          <input type="number" step="any" placeholder="A confirmar" value={editandoTaller.presupuesto} onChange={e => setEditandoTaller({...editandoTaller, presupuesto: e.target.value})} className="w-full min-w-0 bg-slate-950 border border-slate-700 rounded-l-xl px-2.5 py-2 text-white font-mono" />
                          <select value={editandoTaller.presupuestoMoneda} onChange={e => setEditandoTaller({...editandoTaller, presupuestoMoneda: e.target.value})} className="bg-slate-950 border border-slate-700 border-l-0 rounded-r-xl px-2 text-white font-bold"><option value="ARS">ARS</option><option value="USD">USD</option></select>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
                <div className="flex gap-2 pt-2">
                  <button type="submit" className="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 rounded-xl transition text-xs">Guardar Cambios</button>
                  <button type="button" onClick={() => setEditandoTaller(null)} className="bg-slate-800 text-white font-bold px-4 py-2.5 rounded-xl transition text-xs">Cancelar</button>
                </div>
              </form>
            </div>
          )}
          {editandoGastoPuntual && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-xs flex items-center justify-center p-4 z-50 fade-in">
              <form onSubmit={procesarEdicionGastoPuntual} className="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-xs w-full space-y-4 shadow-2xl">
                <h3 className="font-black text-white text-base border-b border-slate-800 pb-2.5">Editar Gasto</h3>
                <div className="space-y-3 text-xs">
                  <div><label className="text-slate-400 font-bold mb-1 block">Concepto</label><input type="text" required value={editandoGastoPuntual.concepto} onChange={e => setEditandoGastoPuntual({...editandoGastoPuntual, concepto: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white" /></div>
                  <div><label className="text-indigo-400 font-bold mb-1 block">Detalle / Subconcepto (Opcional)</label><input type="text" placeholder="Ej: Bonos, Estampilla, Consulta..." value={editandoGastoPuntual.detalle || ''} onChange={e => setEditandoGastoPuntual({...editandoGastoPuntual, detalle: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white" /></div>
                  <div>
                    <label className="text-slate-400 font-bold mb-1 block">Monto Correcto</label>
                    <div className="flex gap-2">
                      <input type="number" step="any" required value={editandoGastoPuntual.monto} onChange={e => setEditandoGastoPuntual({...editandoGastoPuntual, monto: e.target.value})} className="flex-1 min-w-0 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono" />
                      <select value={editandoGastoPuntual.moneda} onChange={e => setEditandoGastoPuntual({...editandoGastoPuntual, moneda: e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-2.5 text-white font-bold"><option value="USD">USD</option><option value="ARS">ARS</option></select>
                    </div>
                  </div>
                  <div>
                    <label className="text-slate-400 font-bold mb-1 block">Billetera de donde salió</label>
                    <select required value={editandoGastoPuntual.walletIdOriginal} onChange={e => setEditandoGastoPuntual({...editandoGastoPuntual, walletIdOriginal: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold">
                      <option value="">Seleccionar billetera...</option>
                      {billeterasDisponibles.map(a => <option key={a.id} value={a.id}>{a.nombre} (Disp: {a.monto})</option>)}
                    </select>
                  </div>
                </div>
                <div className="flex gap-2 pt-1">
                  <button type="submit" className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl transition text-xs">Actualizar</button>
                  <button type="button" onClick={() => setEditandoGastoPuntual(null)} className="bg-slate-800 text-white font-bold px-4 py-2.5 rounded-xl transition text-xs">Cancelar</button>
                </div>
              </form>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
